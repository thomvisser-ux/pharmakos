# SPDX-FileCopyrightText: 2026 Pharmakos contributors
# SPDX-License-Identifier: MIT OR Apache-2.0
#
# REUSE 3.2 licence manifest. This file is the machine-readable source of truth
# for who owns what and under which licence; docs/LICENSING.md is the prose
# version and LICENSE at the root is the short pointer. Full licence texts live
# in LICENSES/ under their canonical SPDX file names.
#
# Individual files also carry SPDX headers. Precedence is "aggregate"
# throughout: a header in a file is combined with the entry below, so a file
# that states its own copyright keeps it, and a file that cannot carry a header
# (a .vox model, an .ogg, a binary golden file) is covered by this manifest.
# Two blocks break that rule on purpose, each with precedence = "override":
# docs/DCO.txt, which is somebody else's document, and the three files whose
# own bytes quote another file's SPDX header (the last block below, decisions
# log item 116 (6)(i)).
#
# ORDER MATTERS. When two blocks match the same path the LAST one wins, so the
# narrow blocks (crates/proto/**, the per-directory LICENSE pointers,
# docs/DCO.txt) sit below the broad ones they carve out of.
#
# Check with: `reuse lint` (the `reuse` step of `cargo xtask ci`, run on the
# Linux leg in CI).

version = 1

SPDX-PackageName = "Pharmakos"
SPDX-PackageSupplier = "Pharmakos contributors"
# PLACEHOLDER: the public repository URL — owner, the v0.1 gate (decisions-log
# item 127 (4)). Replace with the canonical clone URL before the first public release;
# REUSE accepts the string "NOASSERTION" until then.
SPDX-PackageDownloadLocation = "NOASSERTION"

# --- The game: everything that executes ------------------------------------
# The sim, plan-core, verifier, operator, gateway and gamectl crates, the build
# and CI tooling, and the Godot client with its thin gdext crate.
#
# `godot/**` is the Godot project itself (decisions-log item 72: `godot/` at the
# repository root, one ownable unit with crates/client-gdext). It is listed here
# because several of its formats CANNOT carry a header: a `.tscn` is a Godot
# text resource with no comment syntax, and a `.uid` file is a single line the
# editor rewrites. The files that can carry one — `project.godot`, the
# `.gdextension` and every `.gd` — do, and precedence stays "aggregate" so those
# headers are combined with this entry rather than replaced by it. The staged
# library and Godot's `.godot/` import cache are build output and are
# git-ignored, so neither needs covering.
#
# `client/**` was the pre-decision placeholder path for the same thing and is
# kept so that a tree still holding it lints clean; item 72 chose `godot/`.
[[annotations]]
path = [
    "crates/**",
    "xtask/**",
    "client/**",
    "godot/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Pharmakos contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# godot/fixtures/ holds byte-identical copies of gateway goldens, so Godot can load them
# from res:// for the hostless shots, and a report the rows shot draws. A copy cannot
# carry a header of its own without ceasing to be a copy, so its licence is stated here,
# and it is the licence of the file it copies:
#   * view_keyframe.jsonl copies tests/golden/gateway/view_keyframe/expected.keyframe.jsonl
#     (the vista shot, T16); crates/client-gdext/tests/vista_fixture.rs keeps the two
#     identical;
#   * instantiate_suggested.json copies tests/golden/gateway/instantiate_suggested/
#     expected.response.json (the wizard shot, T19), a gateway answer that EMBEDS a
#     permissive template — library/hold_and_build.jsonc, header and all — inside a JSON
#     string. The answer is the gateway's output and stays GPL (decisions-log item
#     113 (10)); because the embedded header would otherwise be read as the file's own,
#     the pair is recorded by the override block at the end of this file (item 114 (5)).
[[annotations]]
path = ["godot/fixtures/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Pharmakos contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# --- Interfaces and words: reusable by anyone ------------------------------
# The wire format (gp.v1, gp.api.v1), generated JSON Schema, documentation,
# example playbooks, the harness docs and llms.txt. Permissive so third-party
# tools, SDKs and playbook generators are not forced to be GPL.
# NOTE: schemas/ and llms.txt do not exist yet; the entries are here so the
# manifest is correct the moment they land.
[[annotations]]
path = [
    "proto/**",
    "schemas/**",
    "docs/**",
    "examples/**",
    "llms.txt",
    "AGENTS.md",
    "CLAUDE.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Pharmakos contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# --- The template library: permissive, like the example playbooks ----------
# library/ is the folder the Seat Gateway reads to list and instantiate
# templates (spec section 13, "Local-first library"): Hold & Build, Expand &
# Mine and the Safe Playbook at the skeleton (decisions-log item 81). They are
# playbook files, data a player copies and changes, and nothing in them
# executes, so they take the example playbooks' licence (decisions-log item
# 111, decision C13). The files carry the header themselves as well.
[[annotations]]
path = ["library/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Pharmakos contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# --- Packaging: the zip's note, manifest template and changelog ------------
# packaging/ holds what `cargo xtask package` puts into the unsigned zips beside
# the build (decisions-log item 117 (11) and (12)): the note's per-platform
# templates, which carry no header because the note they become takes its licence
# from the zip's own manifest; the zip's REUSE manifest template, named
# REUSE.toml.in so that this repository's reuse does not read it as a nested
# manifest (a file named REUSE.toml anywhere in the tree would be), and whose
# quoted Godot copyright lines sit between REUSE-IgnoreStart and REUSE-IgnoreEnd so
# they are not attributed to the template; and the canonical MPL-2.0 and BSL-1.0
# texts under LICENSE-prefixed names, which reuse ignores, so they are copied into
# the zip's LICENSES/ without being licences this repository uses. The changelog
# at the top level carries its own header as well. Documentation tier, with
# packaging/LICENSE, like the other permissive directories.
[[annotations]]
path = ["packaging/**", "CHANGELOG.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Pharmakos contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# --- The schema crate: permissive, unlike the rest of crates/ --------------
# crates/proto holds the generated gp.v1 / gp.api.v1 types, which are the same
# public surface as proto/**: a third party writing a tool against the API must
# not be forced to take the GPL (spec §15, Licences). crates/proto/Cargo.toml
# sets `license = "MIT OR Apache-2.0"` deliberately, and the sources carry that
# header. This block sits AFTER crates/** so it wins for these paths.
[[annotations]]
path = ["crates/proto/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Pharmakos contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# --- Golden files and other test data --------------------------------------
# tests/golden/<area>/expected.* is the committed half of the harness: hash
# chains, canonical playbooks, verifier reports, path hashes, geometry digests,
# feed logs and vista PNGs. They are produced by the game's own code and are
# read only by it, so they take the game's licence. Most of them cannot carry a
# header (a .txt hash chain, a .png), which is what this manifest is for.
[[annotations]]
path = ["tests/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Pharmakos contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The proto area was the first carve-out, for the same reason crates/proto is one:
# these files are canonical gp.v1 JSON and views of the schema — the same public
# surface as proto/** — so a third party writing a playbook tool must be able to
# use them as the reference they are. AFTER the block above, so it wins.
[[annotations]]
path = ["tests/golden/proto/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Pharmakos contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# tests/golden/plan-core/** is the canonical form of the example playbooks and of
# the crate's own fixtures, re-encoded: the file format an alternative tool has to
# reproduce, and expand_east's golden carries the example's own permissive header
# through the round trip it exists to prove. Permissive, as proto/ is (decisions
# log item 100, taken at T8). AFTER the tests/** block, so it wins.
[[annotations]]
path = ["tests/golden/plan-core/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Pharmakos contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# tests/golden/schema/** is the generated JSON Schema `get_schema` serves: a view
# of proto/**, which is the permissive tier, and the document a third party
# writing a playbook tool reads to know what a playbook is. Permissive, exactly
# as tests/golden/proto/ and tests/golden/plan-core/ are, and for the same
# reason (decisions-log item 100 (11), taken at T13 — the task that commits the
# first golden in this area). AFTER the tests/** block, so it wins.
[[annotations]]
path = ["tests/golden/schema/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Pharmakos contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# tests/golden/operator/** is what the built-in operator seals: playbook files
# instantiated from library/'s templates, each carrying its template's own
# permissive header through the instantiation. A playbook is the example
# playbooks' tier, and library/ is permissive (decisions-log item 111, C13), so
# this area is too, as tests/golden/plan-core/ is for the same reason
# (decisions-log item 113, taken at T18). AFTER the tests/** block, so it wins.
[[annotations]]
path = ["tests/golden/operator/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Pharmakos contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# The three templates' render goldens quote library/: the renderer prints each
# playbook's `meta` title and summary and its step labels, and for these three cases
# those strings come from library/'s permissive templates. The answer is the gateway's
# output, in the game tier like the rest of tests/golden/gateway/, and the quotation is
# small; T22a judged no override necessary and wrote this block in its pull request for
# the owner to take or leave (decisions-log item 124 (5) (e)). S1's plan's decision 9
# takes it (item 128), so each file records both licences it carries: the gateway's GPL
# and the templates' MIT OR Apache-2.0. Aggregate, so a header a file ever states is
# combined with this, and AFTER the tests/** block, so it wins.
[[annotations]]
path = [
    "tests/golden/gateway/demo_hold_and_build_render/**",
    "tests/golden/gateway/demo_expand_and_mine_render/**",
    "tests/golden/gateway/demo_safe_playbook_render/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Pharmakos contributors"
SPDX-License-Identifier = "GPL-3.0-or-later AND (MIT OR Apache-2.0)"

# The wizard's goldens (S1's `oper`, crates/gamectl/tests/wizard.rs) sit in the
# permissive tests/golden/operator/** area, and each case's playbook is a sealed
# file instantiated from library/, permissive as that area is. Its other three files
# are the game's outputs: the gateway's instantiate_template answer
# (expected.parameters.json), the verifier's report (expected.report.json) and the
# renderer's prose (expected.prose.txt), which quote the template's strings. They
# take the render goldens' two licences, as the block above does and for the same
# reason (decisions-log item 136). AFTER the tests/golden/operator/** block, so it
# wins.
[[annotations]]
path = [
    "tests/golden/operator/wizard/*/expected.parameters.json",
    "tests/golden/operator/wizard/*/expected.report.json",
    "tests/golden/operator/wizard/*/expected.prose.txt",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Pharmakos contributors"
SPDX-License-Identifier = "GPL-3.0-or-later AND (MIT OR Apache-2.0)"

# --- The rules table -------------------------------------------------------
# rules/rules.v1.json is the canonical JSON of one gp.v1.RulesTable
# (decisions-log item 78): the shape is schema and the values are data. It is
# permissive for the same reason proto/** is — an alternative verifier or
# planner has to read the same rules to reach the same estimates. The JSON
# itself cannot carry a comment, so it has a .license sidecar as well.
[[annotations]]
path = ["rules/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Pharmakos contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# --- Art and audio ---------------------------------------------------------
# Voxel models, textures, sound effects and music. CC BY-SA 4.0 is one-way
# compatible into GPLv3, so these ship inside the GPL'd game. Third-party
# assets are NOT covered by this entry: each keeps its own upstream copyright
# and licence, recorded in its own .license sidecar file and in the credits
# screen (see docs/LICENSING.md).
[[annotations]]
path = ["assets/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Pharmakos contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# --- Build configuration and developer scripts -----------------------------
# The workspace manifest, the toolchain pin, cargo config, lint and dependency
# policy, git config, the CI workflows and the developer setup scripts. Same
# tier as xtask/: this is how the game is built and checked. The files that
# exist already carry matching SPDX headers; the directories are covered here
# so a helper without a header still lints clean.
[[annotations]]
path = [
    "Cargo.toml",
    "Cargo.lock",
    "rust-toolchain.toml",
    "clippy.toml",
    "deny.toml",
    ".cargo/**",
    ".github/**",
    "scripts/**",
    ".gitignore",
    ".gitattributes",
    "README.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Pharmakos contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# --- Scenarios -------------------------------------------------------------
# The headless matches that assert on the goldens: a map seed, a playbook per
# seat, a segment list and the assertions over events and hashes. Same tier as
# the code that runs them.
#
# tests/** is covered by the blocks above, and this block deliberately does
# NOT re-list it. A second `tests/**` line here would be the last match for
# tests/golden/proto/** as well, and would silently revert that directory from
# the permissive tier back to the GPL — exactly the trap the ORDER MATTERS note
# at the top of this file warns about.
#
# Why the golden areas need a manifest entry rather than a header at all:
# several of the formats CANNOT carry one. A hash chain is
# `<tick>\t<16 hex digits>` per line and nothing else — it is byte-compared
# across three operating systems, so a comment at the top of it is a format
# violation, not a licence header — and a PNG cannot carry a text header.
# tests/golden/README.md and scenarios/README.md carry their own headers and
# are unaffected, and so do the JSONC scenario files, which have comments.
#
# tests/golden/docs/ (T15's `gamectl docs` reference) STAYS in the game tier, under
# the broad tests/** block, and has no block of its own (decisions-log item
# 116 (6)(i)). Unlike proto/, plan-core/, schema/ and operator/ above, it is not
# a reproduction of permissive material: three of its four sources are GPL code
# — gamectl's command table and its exit codes (crates/gamectl) and the
# verifier's diagnostic catalogue and string table (crates/verifier) — and only
# the vocabulary comes from the permissive gp.v1 descriptor set.
[[annotations]]
path = ["scenarios/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Pharmakos contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The throwaway stack spikes had their own blocks here (spikes/** in the game
# tier, spikes/README.md in the documentation tier). The directory was deleted
# from main at the `spike-end` tag, so the blocks went with it; the tag still
# carries the manifest that covered them. See docs/spikes/README.md rule 3.

# --- Repository metadata ---------------------------------------------------
# Licence pointers and directory placeholders, documentation-tier, so the
# manifest itself can be copied into another project without dragging the
# copyleft along.
#
# This block changes nothing `reuse lint` reports, and says so (the register's
# S1-08, corrected in S1's first contract pull request): reuse ignores every file
# named LICENSE*, LICENCE* or COPYING* and every empty file (REUSE Specification
# 3.3, "excluded files"), and REUSE.toml carries its own header. Deleting the
# block leaves the lint compliant, which is how this was checked. What the lines
# still do is state, for a reader and for a tool that does not share reuse's
# ignore rule, which tier each pointer belongs to: the per-directory LICENSE files
# are listed one by one rather than as `*/LICENSE`, because assets/LICENSE is also
# matched by assets/** and tests/LICENSE by the game tier's tests/**, and a
# pointer that read as two licences at once would be the ambiguity these files
# exist to remove. The block is last so that, for such a tool, each listed path
# resolves here.
[[annotations]]
path = [
    "LICENSE",
    "assets/LICENSE",
    "docs/LICENSE",
    "examples/LICENSE",
    "library/LICENSE",
    "packaging/LICENSE",
    "proto/LICENSE",
    "rules/LICENSE",
    "tests/LICENSE",
    "REUSE.toml",
    "examples/.gitkeep",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Pharmakos contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# --- Not ours: the Developer Certificate of Origin -------------------------
# docs/DCO.txt is the DCO 1.1, reproduced verbatim. It is copyright The Linux
# Foundation and may be copied verbatim but not changed, so the docs/** block
# above must not be allowed to put our copyright and our licence on it.
# `precedence = "override"` says the manifest is the last word for this path;
# the block below is the file's other override. docs/LICENSE says the same thing in
# prose; docs/DCO.txt.license repeats it beside the file for anyone who copies
# the file out of the tree. The terms are in LICENSES/LicenseRef-DCO-1.1.txt.
[[annotations]]
path = ["docs/DCO.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2004, 2006 The Linux Foundation and its contributors"
SPDX-License-Identifier = "LicenseRef-DCO-1.1"

# --- Files whose bytes quote another file's header ---------------------------
# Three files carry, inside their own bytes, text that `reuse` reads as their
# own header, and in each case that text is not their licence:
#   * tests/golden/gateway/instantiate_suggested/expected.response.json and its
#     byte-identical Godot copy godot/fixtures/instantiate_suggested.json are the
#     gateway's answer to instantiate_template, which embeds library/'s permissive
#     Hold & Build template, header included, inside a JSON string. `reuse spdx`
#     recorded the whole embedded template, escapes and all, as the files'
#     copyright text. The answer is the gateway's output: GPL (decisions-log item
#     113 (10)).
#   * tests/golden/plan-core/awkward/expected.jsonc is the round trip of
#     plan-core's own `awkward` fixture, whose GPL-3.0-or-later header it carries
#     through byte for byte, as expand_east's golden carries the example's
#     permissive one; the permissive plan-core/ block above would add a second and
#     third licence to a file that states its own. It is plan-core/'s one GPL file;
#     awkward/expected.canonical.json has no header and stays permissive (item 100).
# precedence = "override": the manifest is the last word for exactly these paths.
# Its downside: an override also stops reading any header these files carry in
# future, so a change of licence here is an edit to this block. AFTER every block
# that matches them (godot/**, godot/fixtures/**, tests/**, tests/golden/plan-core/**),
# so it is the last match (decisions-log item 116 (6)(i)).
[[annotations]]
path = [
    "godot/fixtures/instantiate_suggested.json",
    "tests/golden/gateway/instantiate_suggested/expected.response.json",
    "tests/golden/plan-core/awkward/expected.jsonc",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Pharmakos contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"
