# ============================================================================
# THIS FILE MUST BE COPIED TO `.github/workflows/spike-g4.yml` TO RUN.
#
# It is staged here because the agent that wrote it was restricted to
# `spikes/g4-determinism/`, and a workflow outside `.github/workflows/` is inert.
# Copy it verbatim:
#
#     cp spikes/g4-determinism/ci/spike-g4.yml .github/workflows/spike-g4.yml
#
# Until that copy exists, G4-a ("identical hashes on 3 operating systems") is
# UNMEASURED — every number in section 9 of docs/spikes/G4-determinism.md comes
# from one host, one OS and one architecture. Deleted with the rest of
# `spikes/` at week 5 (spikes/README.md rule 6); what survives is re-expressed
# inside `cargo xtask ci`.
#
# Two preconditions that are NOT in this file and must be satisfied first:
#
#   1. `spikes/g4-determinism/Cargo.lock` must be COMMITTED. `spikes/.gitignore`
#      line 10 is a bare `Cargo.lock`, which ignores it. Only the five direct
#      dependencies carry `=` pins; rkyv 0.8.18 itself depends on rend, bytecheck,
#      munge, ptr_meta and rancor as caret ranges, and rend's endian-aware scalar
#      types are literally what the archive bytes are made of. With no committed
#      lock the three runners resolve their own graphs and the snapshot-byte
#      comparison below is not a controlled experiment. Fix:
#          add `!*/Cargo.lock` under the `Cargo.lock` line in spikes/.gitignore
#          git add -f spikes/g4-determinism/Cargo.lock
#      Every cargo invocation below passes `--locked` so a drifted graph fails
#      the build instead of silently changing the bytes.
#
#   2. `.gitattributes` must keep trace files out of Git's line-ending rewriter.
#      The four patterns it already carries (`tests/golden/**`, `*.hashes.txt`,
#      `spikes/**/trace*.txt`, `*.trace.txt`) cover the trace. If a snapshot hash
#      list is ever force-added as a finding, add `spikes/**/snapshots-*.txt -text`
#      alongside them.
# ============================================================================

name: spike-g4-determinism

on: [push, workflow_dispatch]

permissions:
  contents: read

env:
  # No incremental compilation and no compiler cache anywhere in this workflow.
  # A cached artefact reused across OSes could mask exactly the difference this
  # gate exists to find (G4 plan, section 4, second CI detail).
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: ""

jobs:
  trace:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: spikes/g4-determinism
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # rust-toolchain.toml pins the exact compiler; `rustup show` installs and
      # records it. "Identical across operating systems" is only meaningful at
      # one pinned version, so the version is printed into every job's log.
      - name: Toolchain
        run: |
          rustup show
          rustc -vV
          cargo -vV

      # The xxh3 reference vectors, the fixed-point edge cases, the RNG golden
      # pins and the canonical-encoding stride.
      - name: Tests (default features)
        run: cargo test --release --locked

      # The ten-match trace digest as an assertion. Ignored by default because
      # it runs the full 96,000 ticks (~1.4 s release, ~30 s debug); CI has the
      # budget, and it means the spike carries its own golden rather than
      # keeping it only in a document.
      - name: Trace digest golden
        run: cargo test --release --locked -- --ignored

      # The two cfg-gated tests — `snapshot_bytes_round_trip` (encode is a pure
      # function of the value, which is what the cross-OS snapshot comparison
      # rests on) and `fork_is_equivalent_to_stepping` — do not exist in the
      # default build. A test that passes by not being compiled is not a test.
      # The two snapshot features are mutually exclusive by `compile_error!`,
      # so they get one invocation each rather than an `--all-features` run.
      - name: Tests (postcard + research)
        run: cargo test --release --locked --features snap-postcard,research
      - name: Tests (rkyv + research)
        run: cargo test --release --locked --features snap-rkyv,research

      # G4-a, this runner's half: ten matches, 9,600 ticks each.
      - name: Trace 10 matches
        run: cargo run --release --locked --bin run -- --matches 10 --ticks 9600 --out trace-${{ matrix.os }}.txt

      # G4-b, both candidate formats. Each exits non-zero on any mismatch and
      # writes one `snapshot<TAB>match<TAB>tick<TAB>bytes<TAB>hash` line per
      # checkpoint (50 lines) for the compare job to diff.
      - name: Round trip (postcard)
        run: cargo run --release --locked --bin roundtrip --features snap-postcard -- --snapshots snapshots-postcard-${{ matrix.os }}.txt
      - name: Round trip (rkyv)
        run: cargo run --release --locked --bin roundtrip --features snap-rkyv -- --snapshots snapshots-rkyv-${{ matrix.os }}.txt

      # The default build must not contain a line of fork.
      - name: Default build (no features)
        run: cargo build --release --locked

      # G4-c.
      - name: Fork equivalence (research)
        run: cargo run --release --locked --features research --bin forkcheck

      # Step 9: symbol check with its positive control, plus the feature
      # resolution check with its own positive control.
      - name: Feature isolation
        run: sh ./check-features.sh

      # The braces of `${{ }}` are YAML indicators inside a flow mapping, so any
      # scalar containing an expression must be quoted. Block style is used here
      # and the quoting is kept anyway, because this is the line the plan calls
      # out as the one that makes GitHub reject the workflow outright.
      - uses: actions/upload-artifact@v4
        with:
          name: "trace-${{ matrix.os }}"
          path: |
            spikes/g4-determinism/trace-${{ matrix.os }}.txt
            spikes/g4-determinism/snapshots-postcard-${{ matrix.os }}.txt
            spikes/g4-determinism/snapshots-rkyv-${{ matrix.os }}.txt
          if-no-files-found: error

  compare:
    needs: trace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List what arrived
        run: find artifacts -type f | sort

      # Byte comparison, with ubuntu as the reference. On a mismatch, print the
      # first differing line with three lines of context from each side so the
      # culprit (match, tick) is named rather than guessed, then fail.
      - name: Compare traces and snapshot hashes across the three OSes
        run: |
          set -u
          status=0

          compare_pair () {
            ref="$1"; other="$2"; label="$3"
            if [ ! -f "$ref" ] || [ ! -f "$other" ]; then
              echo "::error::$label — a side is missing ($ref / $other)"
              return 1
            fi
            if cmp -s "$ref" "$other"; then
              echo "OK   $label — byte identical ($(wc -l < "$ref") lines)"
              return 0
            fi
            line=$(cmp "$ref" "$other" 2>&1 | sed -n 's/.*line \([0-9]*\).*/\1/p')
            [ -n "$line" ] || line=1
            lo=$((line > 3 ? line - 3 : 1))
            hi=$((line + 3))
            echo "::error::$label — FIRST DIFFERENCE at line $line"
            echo "--- $ref (lines $lo..$hi)"
            sed -n "${lo},${hi}p" "$ref"
            echo "--- $other (lines $lo..$hi)"
            sed -n "${lo},${hi}p" "$other"
            return 1
          }

          for f in trace snapshots-postcard snapshots-rkyv; do
            ref="artifacts/trace-ubuntu-latest/${f}-ubuntu-latest.txt"
            for os in windows-latest macos-latest; do
              compare_pair "$ref" "artifacts/trace-${os}/${f}-${os}.txt" "${f}: ubuntu vs ${os}" || status=1
            done
          done

          # macOS is the ARM leg and is the single most likely source of a
          # divergence — and therefore the most valuable agreement. If it is the
          # only side that disagrees, the plan's section 6 says to record it as
          # an architecture finding and treat the fallback separately for that
          # platform, so the log says which pairs failed rather than just "1".
          exit $status
