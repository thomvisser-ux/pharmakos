#
# Plan §5. Lives here rather than in .github/workflows/ so the spike stays
# self-contained; copy it to .github/workflows/spike-g1.yml in the spike
# worktree. Deleted with this directory in week 5 (spikes/README.md rule 6).
#
# The thresholds below are the *measured* numbers from the Quadro P4000 machine
# plus headroom, held as a regression budget. They are not guesses and they are
# not the gate: the gate is judged from the developer-machine runs recorded in
# the plan's §10.
#
# NOTE ON STATUS: the `mesher-cpu` job is exercised — every command in it has
# been run on the authoring machine. The `geometry` job has NOT: it needs a
# Linux runner with a software rasteriser and a bootstrap golden image, and no
# Linux GPU or runner was available (plan §3 step 8 is outstanding, see §10). It
# is written to fail closed — a missing PNG, a blank PNG or a missing golden are
# all hard failures — precisely so that "not yet run" cannot read as "passing".

name: spike-g1-remesh

on: [push, workflow_dispatch]

# A new push cancels the previous run: the only way to stop a hung job
# without a GitHub login.
concurrency:
  group: spike-g1-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: spikes/g1-remesh

env:
  GODOT_VERSION: 4.7.2

jobs:
  mesher-cpu: # blocking; real numbers, no GPU needed
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt

      # The spike's own discipline, checked with the spike's own clippy.toml.
      - run: cargo fmt --all --check
      # Two passes. Without the second, `upload_rs.rs`, `upload_arraymesh.rs` and
      # the whole `gdext_node` module are `#[cfg]`-ed out and never linted — and
      # that is the half of the crate doing manual RID lifetime management and
      # raw byte-buffer packing. The gdext half needs no Godot binary to lint,
      # only the crate.
      - run: cargo clippy --release --no-default-features --all-targets -- -D warnings
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release --no-default-features

      # Step 1 + step 2. --no-default-features: meshbench must not link gdext,
      # or the "no Godot" claim is not true.
      - run: cargo run --release --no-default-features --bin meshbench -- --json out.json
      # Regression budget, from the 2026-09-14 measurement on the Quadro P4000
      # machine. `us_p99` is the best-of-5-reps statistic (see meshbench's header
      # for why a single-shot p99 flaps by 2.5x): worst of three consecutive runs
      # was flat 348 us / cratered 502 us, and the thresholds are ~3x that,
      # because hosted CI runners are both slower and far noisier than the dev
      # machine. `us_raw_p99` is deliberately NOT gated: it is the single-shot
      # number and it is scheduler noise as much as code.
      - name: assert mesher CPU budget
        shell: bash
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open("out.json"))
          fails = []
          if d["cratered"]["us_p99"] > 1500: fails.append(f'cratered mesh p99 {d["cratered"]["us_p99"]} us > 1500')
          if d["flat"]["us_p99"] > 1050: fails.append(f'flat mesh p99 {d["flat"]["us_p99"]} us > 1050')
          if d["cratered"]["bytes_p99"] > 280 * 1024: fails.append(f'bytes/surface p99 {d["cratered"]["bytes_p99"]} > 280 KiB')
          if d["cratered"]["verts_max"] > 65535: fails.append("a surface exceeded the 16-bit index cap")
          if d["cratered"]["allocs_per_mesh_milli"] > 100: fails.append("mesher allocates per call; scratch reuse regressed")
          if d["fanout"]["r4"]["max"] > 8: fails.append(f'dirty fan-out max {d["fanout"]["r4"]["max"]} > 8')
          print("\n".join(fails) or "mesher CPU budget ok")
          sys.exit(1 if fails else 0)
          PY

      # Step 7 / §4 part 1: the CI-stable proxy for G1-a. 3,600 frames, matching
      # the in-engine run length the plan specifies. `--upload-rate` is path B's
      # measured throughput expressed in *FFI* bytes per ms — 96 623 FFI bytes
      # per chunk over path B's 54.1/55.5/57.3 us per chunk, i.e. 1 687/1 740/
      # 1 687 B/us, median 1 740 000 B/ms — because the proxy charges every
      # upload the full FFI byte count and has no way to know which ones path B
      # would have satisfied with a 16 B/vertex in-place region write. It is a
      # model, and the job title says proxy, not frame time.
      - run: >
          cargo run --release --no-default-features --bin meshbench --
          --json pipeline.json --pipeline --explosions-per-s 20 --frames 3600
          --k 4 --b 524288 --upload-rate 1740000
      - name: assert modelled latency <= 3 frames
        shell: bash
        run: |
          python3 - <<'PY'
          import json, sys
          p = json.load(open("pipeline.json"))["pipeline"]
          ok = p["lat_p99"] <= 3 and p["lat_max"] <= 4 and p["max_queue_depth"] <= 16
          print(p)
          sys.exit(0 if ok else 1)
          PY

  geometry: # blocking; correctness, not speed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: "1.98.1" }
      - run: cargo build --release
      - name: stage the cdylib where Godot can see it
        run: |
          mkdir -p godot/bin
          target=$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys;print(json.load(sys.stdin)["target_directory"])')
          cp "$target/release/libg1_remesh.so" godot/bin/

      # `--headless` selects the DUMMY rendering driver: nothing is rasterised,
      # `RenderingServer.frame_post_draw` never fires, `main.gd`'s screenshot
      # coroutine never resumes, and no PNG is written — silently. Plan §4 asks
      # for a *software rasteriser*, which is a different thing. lavapipe under
      # xvfb is that thing.
      - name: install Godot ${{ env.GODOT_VERSION }} and a software rasteriser
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers libvulkan1 vulkan-tools
          curl -sSLo godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      # Bounded and self-reporting. `timeout` bounds a parked run — a per-frame
      # script error never reaches _finish, and a coroutine awaiting a signal
      # that never fires parks for ever — and --quit-after is Godot's own bound,
      # independent of the script. 200 frames: the geometry is settled long
      # before that, and lavapipe renders forward+ at seconds per frame. The
      # first run of this job (run 34809807473) sat in this step for hours with
      # no way to read why, because job logs need a GitHub login; the summary
      # step below is the channel that does not.
      - name: render the fixed vista
        run: |
          mkdir -p out
          export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          export VK_DRIVER_FILES=$VK_ICD_FILENAMES
          vulkaninfo --summary > out/vulkaninfo.txt 2>&1 || true
          set +e
          timeout -k 30 900           xvfb-run -a --server-args="-screen 0 1920x1080x24"             godot --verbose --path godot --rendering-driver vulkan --resolution 1280x720 --quit-after 600 --             --path=b --frames=200 --eps=20 --radius=4 --k=4 --b=524288             --shot=180 --out=$PWD/out --tag=ci > out/godot.log 2>&1
          echo "godot exit code: $?" | tee -a out/godot.log

      # The run summary page is readable without a login; job logs are not.
      - name: diagnostics into the run summary
        if: always()
        run: |
          {
            echo '## geometry job diagnostics'
            echo '### vulkaninfo --summary'; echo '```'; head -n 60 out/vulkaninfo.txt 2>/dev/null; echo '```'
            echo '### godot.log (tail)'; echo '```'; tail -n 150 out/godot.log 2>/dev/null; echo '```'
            echo '### out/'; echo '```'; ls -la out 2>/dev/null; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # THE ASSERTION. Without it the job cannot fail on cracks, missing faces or
      # inverted winding — exactly the bug class the screenshot exists to catch,
      # and the one this spike actually hit. A missing or blank PNG fails too, so
      # a silently-not-rendered frame cannot read as a pass.
      - name: compare the vista against the golden
        run: python3 ci/compare_vista.py out/vista_ci.png ci/golden/vista_ci.png 6.0 0.02

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: vista-linux, path: spikes/g1-remesh/out/* }

  frame-time: # advisory; no GPU on hosted runners
    if: false # enable only on a self-hosted GPU runner
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - run: pwsh ./build.ps1
      - run: >
          godot --path godot --rendering-driver vulkan --resolution 1920x1080 --
          --path=b --frames=3600 --eps=20 --radius=4 --k=4 --b=524288 --shot=0
          --out=$PWD/out --tag=ci
      - run: python3 analyse.py "out/frames_*.csv"
