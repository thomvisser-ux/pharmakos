# Standalone workspace: the empty [workspace] table detaches this manifest from
# any parent workspace, so `cargo build` at the repository root never sees it
# (spikes/README.md rule 1).
[workspace]

[package]
name = "g3-tick-budget"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "GPL-3.0-or-later"
publish = false
description = "Throwaway synthetic tick benchmark for spike G3' (segment budget). Deleted after week 5."

[dependencies]
# Exact pin, the same one the G4 spike uses: the per-tick state hash is the
# artefact both spikes produce, and a version bump under it must be visible.
xxhash-rust = { version = "=0.8.18", default-features = false, features = ["xxh3"] }

# NOT taken, deliberately, though the task list permits them:
#   * `imbl` — G4 keeps its kill-credit table in an `imbl::OrdMap`. Here the
#     kill-credit counters are a dense Vec-backed SoA table (tables.rs), because
#     the plan's §2 file list puts them in the SoA tables and because a dense
#     table is what a 1_200-unit configuration would actually use. The
#     persistent-structure allocator risk of plan §5 is still exercised: the
#     32^3 chunk store is copy-on-write over `Arc`, which is the first structure
#     that row names.
#   * `postcard`/`serde` — no snapshot is taken here; that is G4's subject.

# ---------------------------------------------------------------------------
# Profiles. THE MEASURED PROFILE IS `release`, and it carries
# `overflow-checks = true` (plan §3 step 0, plan §5 row 1): the shipping
# configuration per spec section 15, so measuring without the checks would
# produce a power budget the game cannot honour.
# ---------------------------------------------------------------------------
[profile.dev]
overflow-checks = true

[profile.release]
overflow-checks = true
debug-assertions = false
lto = "thin"
codegen-units = 1

# Used ONCE, for the checked-vs-unchecked delta of plan §3 step 0 and the §5
# risk table's first row, and for nothing else. Every number quoted in the plan's
# Results section comes from `release`.
#
#     cargo run --profile release-unchecked --bin tickbench -- ...
[profile.release-unchecked]
inherits = "release"
overflow-checks = false

[profile.test]
overflow-checks = true

[profile.bench]
overflow-checks = true
debug-assertions = false

[[bin]]
name = "tickbench"
path = "src/bin/tickbench.rs"

[[bin]]
name = "costmodel"
path = "src/bin/costmodel.rs"
