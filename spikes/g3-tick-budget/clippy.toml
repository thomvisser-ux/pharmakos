#
# Clippy configuration for the G3' spike ONLY.
#
# WHY THIS FILE EXISTS. Clippy reads `clippy.toml` from the current directory and
# then walks up the ancestors, taking the NEAREST file and not merging. A run
# from `spikes/g3-tick-budget` with no file of its own therefore picks up the
# *product's* root `clippy.toml` — even though this directory is a standalone
# cargo workspace the product build never sees (spikes/README.md rule 1). The
# root file's `disallowed-types` list includes `std::time::Instant`, so without
# this file
#
#     cargo clippy --release --all-targets -- -D warnings
#
# fails on every clock read in `src/bin/`, plus an MSRV-mismatch warning, and the
# claim that clippy verified this spike's discipline stops being reproducible.
# The G2 spike hit the same leak and solved it the same way; its header is the
# template for this one.
#
# WHAT IS DIFFERENT HERE — the same thing that was different for G2. This
# spike's library IS sim code in the sense of AGENTS.md §4: `tables.rs`,
# `tick.rs`, `broadphase.rs`, `power.rs`, `quartermaster.rs`, `decision.rs`,
# `voxels.rs`, `hash.rs`, `fixed.rs`, `rng.rs` and `lib.rs` are prototypes of
# `pharmakos-sim` modules, and the whole point of the measurement is that the
# thing measured is the thing that would ship. So the discipline is enforced
# here rather than waived — but it could not be expressed in *this* file,
# because clippy's configuration is crate-wide and has no per-path allow-list,
# while the plan's §5 (row "Wall-clock time inside sim code" and row "`as` casts
# and float creep in a benchmark") explicitly sanctions the clock, floats and
# statistics in `src/bin/` and only there.
#
# THE MECHANISM, in two halves, because neither half covers it alone:
#
#  1. Floats, `as` casts and the disallowed-type set are denied at the CRATE
#     ROOT of the library, by `#![deny(...)]` in `src/lib.rs` — the way the G4
#     spike does it. Those attributes travel with the code, not with the working
#     directory, and cover every library module through the module tree. The two
#     binaries are separate crate roots and deliberately do NOT carry the float
#     denial: percentiles, least-squares fits and ns-per-entity arithmetic are
#     what they are for.
#
#  2. The clock ban and the hash-container ban are what clippy would have to
#     express through `disallowed-types`, which is exactly the knob that cannot
#     be scoped to a path. They are enforced instead by a source-text test —
#     `tests/wall.rs`, which reads every `src/*.rs` at test time and fails if any
#     of them mentions the clock types, the hash containers or a float type. It
#     also asserts the confinement in the other direction: that the clock does
#     appear in `src/bin/`, so the test cannot pass by the harness quietly
#     losing its ability to measure anything.
#
# WHAT TO TAKE FROM THIS FOR HARNESS PART 1 — the same two findings G2 recorded,
# restated because two spikes hitting the same wall is the evidence:
#
#   * the ancestor walk means `cargo xtask clippy` should pass an explicit
#     `--config-path`; any out-of-workspace directory inherits the product's
#     configuration today;
#   * a crate-root `#![deny]` plus a text test is what you are reduced to when
#     the wall is not a crate boundary (AGENTS.md §4.9 says exactly this). It is
#     defensible in a throwaway single-crate spike whose library and binaries
#     must live in one package. It would not be defensible in `crates/`, and the
#     shape the product wants is visible from here: `tickbench`'s statistics are
#     `presentation`-side code, and the tick is not.

# Match the pinned toolchain in rust-toolchain.toml and `rust-version` in
# Cargo.toml exactly. The root file says 1.85 — the product's MSRV — and that
# mismatch is itself a warning under `-D warnings`.
msrv = "1.98.1"

avoid-breaking-exported-api = false
allow-unwrap-in-tests = true
allow-expect-in-tests = true

# Deliberately empty — see the header. The library's bans live in the source.
disallowed-types = []
disallowed-methods = []
disallowed-macros = []
