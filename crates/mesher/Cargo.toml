[package]
name = "pharmakos-mesher"
description = "Walled greedy mesher: integer chunk data in, vertex buffers out; links without gdext."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# None, and that is the point: this crate links without gdext and without the sim, so the
# headless CPU proxy and the CI geometry check can reuse it (decisions log §2.7 item 56).
# Expected later, from [workspace.dependencies]: dot_vox, for the .vox models the same
# mesher meshes. Nothing from crates/sim ever appears here — the input is plain integer
# chunk data handed across a named boundary.

[dev-dependencies]
# The geometry golden's digests. `xxhash-rust` and no other hash function: AGENTS.md §3's
# approved list names it, the sim already pins the same exact version for the state hash,
# and "never add a second hash function" (AGENTS.md §5) holds for a golden as much as for
# hashed state. It is a DEV dependency on purpose — the shipped mesher still has none, so
# `cargo tree -p pharmakos-mesher` stays a single line and the "links without gdext"
# property is visible rather than argued.
xxhash-rust = { workspace = true }

[lints]
workspace = true
