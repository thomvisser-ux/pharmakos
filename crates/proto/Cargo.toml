[package]
name = "pharmakos-proto"
description = "Generated Protobuf types for gp.v1 and gp.api.v1, and the canonical proto-JSON codec."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Deliberately NOT license.workspace: schemas, docs, llms.txt and example
# playbooks are MIT OR Apache-2.0 so third parties can build against the API
# without taking on the GPL (spec §15, Licences). The rest of the workspace is
# GPL-3.0-or-later. The canonical JSON codec is in this crate and under this
# licence for the same reason: an alternative editor or a lint tool has to be
# able to read and write the file format.
license = "MIT OR Apache-2.0"
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The only dependency, and the only one this crate will take. `prost-types` is
# deliberately absent: the descriptor set is parsed by hand in `src/wire.rs`,
# because prost drops unknown fields and the method/scope table travels as a
# custom option, which is an unknown field to every generated
# `EnumValueOptions`.
#
# There is no JSON dependency either. `serde`, `serde_json`,
# `protoc-gen-prost-serde` and `pbjson` are all off the approved list
# (AGENTS.md §3 rule 5), and decisions-log item 74 settles the question: the
# canonical proto3-JSON codec is hand-written here, driven by the descriptor
# set, with the JSONC comment layer in plan-core on top.
prost = { workspace = true }

# No [build-dependencies] and no build script, on purpose. The generated types
# are a CHECKED-IN tree at src/generated/, written by `buf generate` from the
# workspace root through proto/buf.gen.yaml. That is the decision, not
# build-time codegen with prost-build: a plain `cargo build` then needs neither
# buf nor protoc, and a schema change arrives as a reviewable diff — which is
# what a contract file wants. Regenerating and checking the tree against what
# is committed is `tests/generated.rs` here and `cargo xtask ci`'s schema step
# (AGENTS.md section 9, item 8).
#
# The .proto files themselves live outside this crate — proto/gp/v1 and
# proto/gp/api/v1, with proto/buf.yaml and proto/buf.gen.yaml — and are
# contract files: changes need owner approval.

[lints]
workspace = true
