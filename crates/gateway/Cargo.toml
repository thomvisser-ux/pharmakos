[package]
name = "pharmakos-gateway"
description = "Seat Gateway: hosts the match and serves it over localhost JSON-RPC -- tokens, scopes, fog filter, rate limits, event bus, snapshots and the method slice."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

# No [features] section on purpose: this crate must never define, forward or enable the
# `research` feature. A seat reaches the world only through this API, so if the gateway
# could reach `fork` then "no dry runs" would be reachable from a seat (spec §15). A CI
# dependency check fails the build if it can. Any dependency on pharmakos-sim must
# read: pharmakos-sim = { workspace = true, default-features = false }

[dependencies]
# The schema: the method list, the scope annotation, the closed error set, the Json
# value, the canonical codec and its base64. The gateway invents none of those five.
pharmakos-proto = { workspace = true }
# `default-features = false`, so the `research` feature is unreachable and `fork` with
# it. The gateway HOSTS the match (crate map, spec §15), so it takes the runner, the
# world and the travel estimator as well as the integer newtypes -- and stepping the
# runner happens in `src/host.rs` and nowhere else, because a handler that stepped one
# would be the dry run AGENTS.md §3 rule 2 forbids. `tests/confinement.rs` asserts that
# over this crate's own source text.
pharmakos-sim = { workspace = true, default-features = false }
# Everything done TO a playbook that is not simulating it: the canonical form, the JSONC
# round trip, JSON Patch, `render_plan`'s prose, the template library and the travel
# estimator's seam. In process with the gateway (crate map).
pharmakos-plan-core = { workspace = true }
# Seal inspection. `verify_plan` and `submit_plan` hand its report back unchanged; an
# invalid playbook is a report with `qualifies: false` and never a method error.
pharmakos-verifier = { workspace = true }
# OS entropy for the 256-bit seat tokens, and for nothing else (decisions-log item 99).
# The only off-list dependency in the crate. The rest of the transport -- RFC 6455 and
# SHA-1 -- is hand-written over `std`, and JSON-RPC rides the proto crate's own Json value
# and base64 (item 100 (10) made the second of those reachable and this crate's copy went).
getrandom = { workspace = true }

[lints]
workspace = true
