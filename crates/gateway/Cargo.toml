[package]
name = "pharmakos-gateway"
description = "Seat Gateway: tokens, scopes, fog filter, rate limits, event bus and snapshots over localhost JSON-RPC."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

# No [features] section on purpose: this crate must never define, forward or enable the
# `research` feature. A seat reaches the world only through this API, so if the gateway
# could reach `fork` then "no dry runs" would be reachable from a seat (spec §15). A CI
# dependency check fails the build if it can. Any future dependency on pharmakos-sim must
# read: pharmakos-sim = { workspace = true, default-features = false }

[dependencies]
# None yet. Expected: pharmakos-proto, pharmakos-plan-core, pharmakos-verifier, and a
# WebSocket/JSON-RPC stack chosen during the walking skeleton (bound to loopback only).

[lints]
workspace = true
