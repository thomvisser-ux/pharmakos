[package]
name = "pharmakos-client-gdext"
description = "Thin gdext bridge between the Rust core and the Godot 4.7 client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# cdylib is what Godot loads through the .gdextension file; rlib keeps `cargo test`
# and workspace-internal use working.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The walled greedy mesher. This crate is its only dependant, which is the shape decisions
# log §2.7 item 56 fixed: the mesher links without gdext so the headless CPU proxy and the
# CI geometry check can reuse it, and `cargo xtask wall-guard` keeps it away from the
# deterministic crates.
pharmakos-mesher = { workspace = true }
# Still expected: godot (gdext, Godot 4.7) from [workspace.dependencies], plus
# pharmakos-proto. This crate stays thin: it marshals, it does not decide.

[lints]
workspace = true
# NOTE: gdext's macros may generate code that trips `unsafe_code = "deny"` from the
# workspace lints. If it does, override it HERE with a comment naming the macro, rather
# than relaxing the workspace-wide setting.
