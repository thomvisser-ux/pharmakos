[package]
name = "pharmakos-client-gdext"
description = "Thin gdext bridge between the Rust core and the Godot 4.7 client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# cdylib is what Godot loads through the .gdextension file; rlib keeps `cargo test`
# and workspace-internal use working.
crate-type = ["cdylib", "rlib"]

[features]
# Item 53's build-time switch, and nothing else. BOTH upload paths are compiled, linted
# and tested in every configuration; this feature only flips which one
# `upload::DEFAULT_UPLOAD_PATH` names, so the retreat from path B to path A is
# `--features pharmakos-client-gdext/upload-path-a` — "a flag, not a rewrite". A feature
# that compiled only one path would leave the retreat untested, which is the opposite of
# what keeping A alive is for.
#
# NOTE: there is no `default` list and there never will be one that reaches the sim. The
# `research` feature (AGENTS.md §3 rule 1) belongs to crates/sim alone, this crate does
# not depend on the sim at all, and `cargo xtask research-guard` and `wall-guard` both
# hold regardless of what is enabled here.
upload-path-a = []

[dependencies]
# gdext, pinned by decisions log §2.7 item 73. The pin, the API level and the reason
# `__codegen-full` is named explicitly all live in [workspace.dependencies].
godot = { workspace = true }
# The walled greedy mesher. This crate is its only dependant, which is the shape decisions
# log §2.7 item 56 fixed: the mesher links without gdext so the headless CPU proxy and the
# CI geometry check can reuse it, and `cargo xtask wall-guard` keeps it away from the
# deterministic crates.
pharmakos-mesher = { workspace = true }
# The schema. Gateway results arrive as canonical `gp.api.v1` JSON and the rules table as
# canonical `gp.v1` JSON; decoding one into its generated type is marshalling, which is
# all this crate does. NOTE what is NOT here and never will be: `pharmakos-sim`. The crate
# map grants this crate gdext, proto and the mesher's public surface and nothing else, and
# `tests/no_sim.rs` walks Cargo.lock to prove no edge reaches the sim, directly or
# transitively (skeleton plan T12, acceptance).
pharmakos-proto = { workspace = true }

[dev-dependencies]
# The geometry digests paths A and B are compared by. `xxhash-rust` and no other hash
# function: AGENTS.md §3's approved list names it, the sim pins the same exact version for
# the state hash, and "never add a second hash function" (AGENTS.md §5) holds for a test's
# digest as much as for hashed state. A DEV dependency, so the shipped bridge does not
# carry it.
xxhash-rust = { workspace = true }

[lints]
workspace = true
# NOTE: `unsafe_code` is denied workspace-wide and gdext needs it — `unsafe impl
# ExtensionLibrary` is how the entry point is registered. The allow is CRATE-LOCAL, in
# src/lib.rs, with a comment naming gdext: decisions log §2.7 item 83 chose that shape over
# a per-crate [lints] override here, so the exception is visible in the source that needs
# it rather than in a manifest table. This crate is walled and `wall-guard` proves no
# deterministic crate depends on it.
