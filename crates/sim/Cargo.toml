[package]
name = "pharmakos-sim"
description = "Deterministic 20 Hz voxel simulation: world, runner, mandates, programs, power grid, replay."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# `research` is defined HERE and in no other crate of this workspace (spec §15,
# Determinism; decisions log §2.4). It gates `fork` — speculative stepping of the sim —
# which exists for the G4 fork-equivalence spike and for research builds only.
#
#   * Release builds never enable it.
#   * CI builds both configurations, so neither one rots.
#   * plan-core, verifier, operator and gateway may never reach it: they depend on this
#     crate with default-features = false and never name the feature. `cargo xtask ci`
#     runs a dependency check that fails the build if they do.
#   * "No dry runs" is a hard guarantee in shipped builds; snapshot/restore is in the core
#     and is what saves and replays use, not fork.
research = []

[dependencies]
# Four, all from [workspace.dependencies]. Three carry exact `=` pins and were decided by
# spike G4:
#   * xxhash-rust — the per-tick state hash (item 48). No second hash function exists.
#   * postcard    — the snapshot/replay encoding (item 49). rkyv was measured and rejected.
#   * serde       — postcard's companion, for the derives on `Snapshot`. Nothing else uses it.
# The fourth is the schema, which AGENTS.md §3's crate map has always had the sim taking:
#   * pharmakos-proto — gp.v1, and the canonical proto-JSON codec that reads
#     rules/rules.v1.json into `gp.v1.RulesTable` (items 74 and 78). It is the ONLY JSON
#     reader in the sim: src/rules.rs's stand-in parser was deleted when T1 merged, so one
#     codec answers for the sim, the verifier and the editor alike.
# Still expected later: imbl (ordered persistent collections) and pathfinding primitives
# under our own HPA* (T7).
xxhash-rust = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true }
pharmakos-proto = { workspace = true }

[lints]
workspace = true
