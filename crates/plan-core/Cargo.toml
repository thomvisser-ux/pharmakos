[package]
name = "pharmakos-plan-core"
description = "Playbook core: verify, estimate, render, patch, canonicalise. Runs in process with the Seat Gateway."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

# No [features] section on purpose. This crate must never define, forward or enable the
# `research` feature — only crates/sim defines it, and a CI dependency check fails the
# build if plan-core can reach it (spec §15, Determinism). The dependency on
# pharmakos-sim below therefore reads `default-features = false`, which is the form
# `cargo xtask ci`'s research-guard checks for.

[dependencies]
# The schema and the canonical proto3-JSON codec (decisions-log item 74). The JSONC
# comment-and-formatting layer in this crate sits on top of it and owns no JSON of its
# own beyond the trivia.
pharmakos-proto = { workspace = true }

[lints]
workspace = true
