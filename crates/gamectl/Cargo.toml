[package]
name = "pharmakos-gamectl"
description = "gamectl CLI: verify, schema, docs, scenarios, seat doctor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

# A library as well as a binary. The binary is the four lines that turn an exit code
# into a process status; everything else is the library, because an integration test
# cannot call into a `[[bin]]` and `scenario run`'s acceptance is a chain compared with
# another chain rather than a string compared with a golden.
[lib]
name = "pharmakos_gamectl"
path = "src/lib.rs"

[[bin]]
name = "gamectl"
path = "src/main.rs"

# gamectl is a client of the Seat Gateway like any other, so it inherits the same rule:
# it must never define, forward or enable the `research` feature that gates `fork`.
# Only crates/sim defines it. (gamectl is not in the CI dependency check's named list —
# that covers plan-core, verifier, operator and gateway — but a research build shipped
# inside the CLI would defeat the same guarantee, so keep it out by hand.)

[dependencies]
# AGENTS.md §3's crate map gives this crate pharmakos-proto, pharmakos-plan-core,
# pharmakos-verifier and pharmakos-gateway, plus an argument parser chosen during the
# walking skeleton (lexopt, item 105 (3)). The gateway is on the list because
# `gamectl scenario run` hosts a headless match; `verify`, `schema` and `docs` need only
# the first three.
#
# ONE EDGE THE CRATE MAP DOES NOT LIST, and it is not optional: pharmakos-sim.
# The gateway's public API is written in the sim's types -- `Surface::new` takes a
# `RulesTable` and `SeatId`s, `Host::open` takes a `WorldConfig`, `Surface::step`
# returns a `TickReport` -- so a client of the gateway cannot name a single one of
# those calls without naming the sim. It is taken with `default-features = false`,
# like every other crate that takes it, so the `research` feature that gates `fork`
# is never reachable from here. Decisions-log item 106 (3) draws the line this crate
# is actually held to: `scenario run` hosts *through the same `Surface` and `Host`*
# and never names the sim's `Runner`, and `tests/confinement.rs` asserts that over
# this crate's own source text. Decisions-log item 109 keeps the edge and adds it to the
# crate map, and puts this crate on xtask's research and wall guards.
pharmakos-proto     = { workspace = true }
pharmakos-sim       = { workspace = true, default-features = false }
pharmakos-plan-core = { workspace = true }
pharmakos-verifier  = { workspace = true }
pharmakos-gateway   = { workspace = true }
# The built-in operator (T18; decisions-log items 111 and 112 (7), AGENTS.md section 3's
# gamectl row): `host` adapts it to the gateway's `serve::Operators` seam. It depends on
# pharmakos-proto alone, so this edge adds no path to the sim that the gateway's does not.
pharmakos-operator  = { workspace = true }
lexopt              = { workspace = true }

[lints]
workspace = true
