#
# One toolchain for every developer, every agent worktree and CI. Cross-OS hash equality
# is a release gate (spec §15, Determinism), so the toolchain is part of the contract:
# changing this file is a contract change and needs owner approval.

[toolchain]
# Pinned to the exact version G4 produced its golden hash with (docs/spikes/G4-determinism.md
# section 9: rustc 1.98.1, the chain byte-identical on Windows, Linux and macOS), so a
# toolchain bump is a deliberate, reviewed step with a hash re-baseline rather than a
# surprise on someone's machine (decisions-log item 123 (4); S1's plan, decision 9, ruling
# the register's S1-01). The `toolchain:` input of every Rust install step in
# .github/workflows/ names the same version, and `[workspace.package] rust-version` and
# clippy.toml's `msrv` sit at or below it (clippy.toml says why they are not raised with
# it yet); xtask's `the_toolchain_is_pinned_once_everywhere` holds all of them to that.
channel = "1.98.1"
components = ["rustfmt", "clippy"]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    # macOS is a signed CI artefact only, built on GitHub-hosted runners (spec §15):
    "aarch64-apple-darwin",
]
profile = "minimal"
