#
# Pharmakos schema module. Protobuf is the single source of truth for the
# gp.v1 (playbook) and gp.api.v1 (Seat Gateway) packages (spec section 15,
# "Schema"). Playbooks live on disk as JSONC: canonical proto JSON plus
# comments, which the editor round-trips.
#
# Run from the WORKSPACE ROOT, with this directory as the input:
#   buf lint proto
#   buf breaking proto --against '.git#branch=main,subdir=proto'
#   buf build proto -o target/gp-descriptor.binpb --as-file-descriptor-set
#
# The root, not this directory, and that is not a style choice: buf resolves the
# path in a `.git#...` reference relative to the directory it is invoked from,
# and `.git` lives at the repository root. Run from `proto/` it looks for
# `proto/.git`, which does not exist, and every breaking check fails with
# "could not read git repository" — a red CI leg rather than a skip, because
# .github/workflows/ci.yml sets PHARMAKOS_REQUIRE_TOOLS=1. `cargo xtask ci`'s
# `buf` step runs the first two of those, from the root
# (xtask/src/main.rs, `step_buf`); examples/README.md quotes the same form.
#

version: v2

modules:
  - path: .
    # PLACEHOLDER: no BSR module is named — owner, v1.1, only if the schemas
    # are ever pushed to a registry. Nothing is published in v1 (spec section
    # 12); add `name:` here then.

lint:
  use:
    - STANDARD
  except:
    # DELIBERATE, and the reason this file needs owner approval:
    #
    # Playbooks are hand-edited JSONC. Canonical proto JSON serialises an enum
    # as its value name verbatim, so ENUM_VALUE_PREFIX would force a player to
    # type "author_kind": "AUTHOR_KIND_HUMAN" instead of the spec's
    # "author_kind": "HUMAN" (spec section 10, the expand_east example). The
    # file format is player-facing text, so the bare names win.
    #
    # To keep the bare names unique inside a package, every enum in gp.v1 is
    # nested inside the message that owns it (proto enum values live in the
    # parent scope, so two top-level enums could not both spell CONTINUE).
    # Zero values keep a full prefix — AUTHOR_KIND_UNSPECIFIED — because they
    # are sentinels that never appear in a valid playbook; that is what
    # ENUM_ZERO_VALUE_SUFFIX is excepted for.
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX

breaking:
  use:
    # WIRE_JSON, not WIRE: playbooks on disk are JSON, so a renamed field or a
    # renamed enum value is a breaking change even though the wire tags are
    # unchanged (spec section 10, "Versioning and reserved seams").
    - WIRE_JSON
  except:
    # Nothing. Minor versions add optional fields; a major version comes with a
    # converter that is kept forever.
  # A change that DISCHARGES a held field number (fills a reserved range with the
  # field it was held for) trips RESERVED_MESSAGE_NO_DELETE, which buf cannot tell
  # apart from a genuine un-reservation. That change adds an ignore_only block here
  # scoped to the files it discharges in, with the justification written out, and
  # the next proto change that discharges nothing deletes it again, so an
  # un-reservation nobody intended never passes unnoticed (decisions-log items
  # 100 (10), 109 and 111).
  ignore_only:
    # S1's targeting proto (S1's plan, task con2; targeting.md's contract pull
    # request 1). One rule, two files, four narrowed ranges, each number taken
    # by the field it was held for and nothing else. con1's block for
    # gp/v1/rules.proto is gone: that discharge is on main, both sides of the
    # comparison now say `reserved 13 to 15`, and keeping the file listed
    # would let a later un-reservation there pass unseen.
    #
    # gp/v1/playbook.proto, `Location`: 10 to 49 were held for a non-beacon
    # selector catalogue ("an area, a seam, a vent"). Targeting's sites take
    # 10 (`on`) and 11 (`covering`), both `FeatureRef`s (decisions-log item
    # 127 (12), docs/design/targeting.md "Sites"), and the range narrows to
    # 12-49, with 12 held for `toward` (S1's plan, decision 3).
    #
    # gp/api/v1/gateway.proto, three messages whose tails were held for
    # exactly these fields, each a PLACEHOLDER that named them:
    #   * `GetRecapResponse`: 2 and 3, the settlement lines and the shortfall
    #     (the register's X-16); 4-15 stay held.
    #   * `GetMapSummaryResponse`: 5, the vent and seam list (S1-48); 6-15
    #     stay held for the terrain summary.
    #   * `GetEconomyForecastResponse`: 5 and 6, the next BMI and the
    #     committed spend (S1-46, decision 12); 7-15 stay held for S3's
    #     projection and what-if answers.
    #
    # buf sees each old range go away and cannot tell a discharge from an
    # un-reservation; tests/golden/proto/expected.reserved.txt shows each
    # narrowing, which is the reviewable half. Inert once this change is on
    # main. The next proto pull request replaces this block with its own, or
    # deletes it if it discharges nothing.
    RESERVED_MESSAGE_NO_DELETE:
      - gp/v1/playbook.proto
      - gp/api/v1/gateway.proto
