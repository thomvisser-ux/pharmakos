// CONTRACT FILE: changes need owner approval.
//
// The Seat Gateway surface (spec section 12).
//
// The Seat Gateway is one internal API with several clients: the Godot
// editor, the gamectl CLI and the built-in operator all call it, JSON-RPC
// over a localhost WebSocket. The editor is simply one more client — it runs
// no validation and no time maths of its own.
//
// Nothing is published in v1: no MCP server, no SDK, no script runtime. The
// gateway is kept agent-shaped anyway, because that is what the roadmap opens
// up (v1.1 publishes it under minor-version rules; v1.2 puts an MCP server
// over it).
//
// WHAT THIS FILE IS. The method names, the closed error set, the scope each
// method needs, and a request/response pair for every method the walking
// skeleton's clients call (skeleton plan T13). `buf breaking` guards all four.
//
// A payload the spec enumerates is written out. A payload the spec names but
// does not enumerate — most of the knowledge results, whose contents are
// section 12's salience-ordered budgets rather than a field list — is a
// message with its first fifteen numbers RESERVED and a PLACEHOLDER naming
// the task that fills it. The pair and its name are the contract; the payload
// is that method's slice. This is the shape that makes the plan's rule work:
// "if a method needs a gp.api.v1 change, the change goes back to T1 as a
// proto PR rather than being made in the gateway".
//
// FOUR METHODS HAVE NO PAIR AT ALL: query_area, list_known_enemies,
// get_reports and get_capabilities. That is the third case, not an oversight.
// A stub pair is written when the skeleton names the method as one its
// clients call and only the payload is open; these four are not called by any
// skeleton client, and the stage that introduces the thing each one reports
// on (S3's knowledge store, S4's licences) is the stage that will know what
// the request even takes. Writing an empty pair now would freeze a shape
// chosen by nobody. Each of the four carries its stage on its enum value.
//
// There is still no `service` block: the transport is JSON-RPC 2.0 over a
// WebSocket, not gRPC, and a service block would imply a gRPC surface v1 does
// not have and v1.1 has not chosen.
//
// TRANSPORT NOTES:
//   * JSON-RPC 2.0 method strings are the lower_snake_case names in the
//     comments below ("get_status"), not the enum value spellings.
//   * Params spelled as enums here (depth, detail, part) travel as LOWER-CASE
//     STRINGS on the JSON-RPC wire — `verify_plan{depth:"quick"}`, spec
//     section 12's own worked example — and the gateway translates at the
//     boundary (decisions-log item 80, which resolves this file's earlier
//     casing PLACEHOLDER). The wire and the schema therefore spell the same
//     value two ways, and the one conversion function is tested in both
//     directions. gp.v1 is the other way round: a playbook on disk carries
//     the enum value name verbatim, because the file is canonical proto JSON
//     and the player hand-edits it.
//   * Every result carries a `_status` footer with the phase and the timer.
//     The leading underscore is not a legal proto identifier, so the footer
//     is an envelope concern: `Status` below is its shape, and the gateway
//     writes it under the key `_status` on every result.
//   * Pagination uses opaque cursors tied to the snapshot.
//   * An invalid playbook is NOT a method error. verify_plan and submit_plan
//     return a full report with qualifies:false; GatewayError.Code is for
//     transport and phase failures only.
//   * Times are game milliseconds, never ticks — including the coming
//     segment's length, which get_status and get_briefing read from the
//     frozen snapshot rather than from a constant. Durations here take int32
//     like gp.v1's, for the same reason: the proto3 JSON mapping emits a
//     64-bit integer as a quoted string, and the on-wire JSON here is read by
//     hand (proto/gp/v1/playbook.proto's header has the full note).

syntax = "proto3";

package gp.api.v1;

import "google/protobuf/descriptor.proto";
import "gp/v1/playbook.proto";

// =============================================================================
// Scopes
// =============================================================================

// The six scopes of spec section 12. A per-seat 256-bit token carries a set of
// them; the gateway checks the one `required_scope` names before the method
// runs.
//
// Two invariants are asserted in the gateway's code and are not expressible
// here: a SEAT token can never hold SCOPE_SPECTATE_NOFOG (only a separate
// spectator token can), and SCOPE_ADMIN can never read another seat's
// playbooks, drafts or knowledge. Fog itself is a per-match server-side
// policy, so no token is reissued mid-match.
enum Scope {
  SCOPE_UNSPECIFIED = 0;

  // Read the seat's own knowledge, status and feed.
  SCOPE_OBSERVE = 1;

  // Author: drafts, the notebook, verification, rendering, patching,
  // templates and the safe playbook. Reads and writes the seat's own private
  // state and nobody else's.
  SCOPE_PLAN = 2;

  // Seal: submit_plan and set_ready. Separate from SCOPE_PLAN because filing
  // an order is the irrevocable act the whole game is about.
  SCOPE_PLAN_SUBMIT = 3;

  // Generated schema and template listings. Carries no match state at all,
  // which is why it is its own scope.
  SCOPE_DOCS = 4;

  // Spectator only. A seat token can never hold it.
  SCOPE_SPECTATE_NOFOG = 5;

  // Lobby and match control. Never another seat's secrets.
  SCOPE_ADMIN = 6;
}

// The scope a token must hold to call a method, attached to the method itself
// so the table cannot drift from the list. `buf breaking` guards it, and
// crates/proto reads it back out of the checked-in descriptor set to check the
// Rust table against this file (`pharmakos_proto::scope`).
extend google.protobuf.EnumValueOptions {
  // 50001: inside the 50000-99999 range Protobuf sets aside for extensions
  // that are never published to a registry.
  Scope required_scope = 50001;
}

// =============================================================================
// Methods
// =============================================================================

// Every Seat Gateway method in v1, in the spec's grouping. The enum is the
// authority for the method list; `buf breaking` in WIRE_JSON mode makes a
// silent rename or removal impossible.
//
// Scope required per method is a separate table owned by the auth contract.
// The scopes are: observe, plan, plan.submit, docs, spectate.nofog, admin.
// Seat tokens can never hold spectate.nofog.
enum Method {
  METHOD_UNSPECIFIED = 0;

  // --- Status --------------------------------------------------------------

  // "get_status" — phase, timers, and the coming segment's length from the
  // frozen snapshot.
  METHOD_GET_STATUS = 1 [(required_scope) = SCOPE_OBSERVE];

  // "wait_for" — long poll on a phase change or a feed digest.
  METHOD_WAIT_FOR = 2 [(required_scope) = SCOPE_OBSERVE];

  // --- Memory --------------------------------------------------------------

  // "save_notes" — the private seat notebook, 4,000 characters, returned at
  // the top of get_briefing. Sits under the plan scope; the editor's notes box
  // reaches it like any other editor feature. Never leaves the gateway for
  // another seat.
  METHOD_SAVE_NOTES = 10 [(required_scope) = SCOPE_PLAN];

  // --- Knowledge -----------------------------------------------------------

  // "get_briefing" — the main one. Carries the notebook, the seat's displayed
  // standing and the coming segment's length.
  METHOD_GET_BRIEFING = 20 [(required_scope) = SCOPE_OBSERVE];

  // "get_recap"
  METHOD_GET_RECAP = 21 [(required_scope) = SCOPE_OBSERVE];

  // "list_beacons"
  METHOD_LIST_BEACONS = 22 [(required_scope) = SCOPE_OBSERVE];

  // "get_beacon"
  METHOD_GET_BEACON = 23 [(required_scope) = SCOPE_OBSERVE];

  // "get_map_summary"
  METHOD_GET_MAP_SUMMARY = 24 [(required_scope) = SCOPE_OBSERVE];

  // "query_area" — NO REQUEST/RESPONSE PAIR YET, and that is deliberate: no
  // skeleton client calls it. Its pair arrives with S3's knowledge store,
  // which is what defines the area query's own salience budget.
  METHOD_QUERY_AREA = 25 [(required_scope) = SCOPE_OBSERVE];

  // "list_known_enemies" — no pair yet; arrives with S3's knowledge store,
  // which is where "known" gets its reach-memory definition.
  METHOD_LIST_KNOWN_ENEMIES = 26 [(required_scope) = SCOPE_OBSERVE];

  // "get_reports" — no pair yet; arrives with S3's knowledge store, alongside
  // the report kinds it returns.
  METHOD_GET_REPORTS = 27 [(required_scope) = SCOPE_OBSERVE];

  // "get_economy_forecast" — $ and kW, with what-ifs.
  METHOD_GET_ECONOMY_FORECAST = 28 [(required_scope) = SCOPE_OBSERVE];

  // "get_capabilities" — no pair yet; arrives with S4, which is the stage
  // that introduces licences and therefore gives the method something to
  // report.
  METHOD_GET_CAPABILITIES = 29 [(required_scope) = SCOPE_OBSERVE];

  // "estimate_route"
  METHOD_ESTIMATE_ROUTE = 30 [(required_scope) = SCOPE_OBSERVE];

  // --- Docs ----------------------------------------------------------------

  // "get_schema" — sliced to what the seat can use. Generated from the
  // schema, so it cannot drift.
  METHOD_GET_SCHEMA = 40 [(required_scope) = SCOPE_DOCS];

  // "list_templates"
  METHOD_LIST_TEMPLATES = 41 [(required_scope) = SCOPE_DOCS];

  // --- Planning ------------------------------------------------------------

  // "instantiate_template"
  METHOD_INSTANTIATE_TEMPLATE = 50 [(required_scope) = SCOPE_PLAN];

  // "verify_plan" — takes depth: quick | full, defaults to full. See
  // VerifyPlan.Depth below.
  METHOD_VERIFY_PLAN = 51 [(required_scope) = SCOPE_PLAN];

  // "render_plan" — the plain-language rendering. Reads the coming segment's
  // length from the frozen snapshot.
  METHOD_RENDER_PLAN = 52 [(required_scope) = SCOPE_PLAN];

  // "patch_plan" — applies the JSON Patch suggestions a report carries.
  METHOD_PATCH_PLAN = 53 [(required_scope) = SCOPE_PLAN];

  // "save_draft"
  METHOD_SAVE_DRAFT = 54 [(required_scope) = SCOPE_PLAN];

  // "list_drafts"
  METHOD_LIST_DRAFTS = 55 [(required_scope) = SCOPE_PLAN];

  // "get_safe_plan" — what the operator would file on a timeout, so a seat
  // can see the cost of one (spec section 14).
  METHOD_GET_SAFE_PLAN = 56 [(required_scope) = SCOPE_PLAN];

  // --- Commit --------------------------------------------------------------

  // "submit_plan" — always runs FULL. The latest verified submission replaces
  // the previous one, any number of times until the timer ends.
  METHOD_SUBMIT_PLAN = 60 [(required_scope) = SCOPE_PLAN_SUBMIT];

  // "set_ready"
  METHOD_SET_READY = 61 [(required_scope) = SCOPE_PLAN_SUBMIT];

  // --- During play ---------------------------------------------------------

  // "get_segment_feed" — fog-filtered events (no-fog for every seat in casual
  // matches) plus a digest for every 60 s of game time. Engine chatter rides
  // the same feed as labelled one-way lines. Planning is closed during play
  // and the recap.
  METHOD_GET_SEGMENT_FEED = 70 [(required_scope) = SCOPE_OBSERVE];

  // "get_view" — the one read a camera needs: terrain chunks and the entities
  // standing on them, as THIS viewer may see them. Cursor-driven: an empty
  // cursor is a keyframe, any other cursor is "what changed since the view it
  // came from". Every phase, because a Lull is watched as well as played.
  METHOD_GET_VIEW = 71 [(required_scope) = SCOPE_OBSERVE];

  // --- Match control -------------------------------------------------------
  //
  // The four methods the local lobby drives the match with. `admin` covers
  // lobby and match control (spec section 12) and can never read another
  // seat's playbooks, drafts or knowledge, so none of these four reports
  // anything about a seat beyond the one aggregate bit `report_host_clock`
  // answers.
  //
  // GAME MILLISECONDS ONLY. No tick and no state hash reaches the wire, here
  // or anywhere else: this file's transport note has said "times are game
  // milliseconds, never ticks" since T1, and a state hash handed to the human
  // seat's own process would be the whole world in eight bytes.

  // "end_lull" — seal every seat's orders and open the Push. PHASE_CLOSED
  // outside a Lull.
  METHOD_END_LULL = 90 [(required_scope) = SCOPE_ADMIN];

  // "advance_push" — run the Push for a stretch of GAME time. PHASE_CLOSED
  // outside a Push.
  METHOD_ADVANCE_PUSH = 91 [(required_scope) = SCOPE_ADMIN];

  // "end_recap" — close the recap and open the next Lull. PHASE_CLOSED
  // outside a recap.
  METHOD_END_RECAP = 92 [(required_scope) = SCOPE_ADMIN];

  // "report_host_clock" — the host's own clock, reported to a gateway that
  // has none. Valid in every phase that consumes no sim tick.
  METHOD_REPORT_HOST_CLOCK = 93 [(required_scope) = SCOPE_ADMIN];

  // --- Roadmap -------------------------------------------------------------

  // RESERVED — voting between rounds, deferred (spec section 12, "Roadmap";
  // section 18). No version fixed.
  //   80 get_ballot
  //   81 cast_vote
  reserved 80, 81;
  reserved "METHOD_GET_BALLOT", "METHOD_CAST_VOTE";

  // RESERVED — "get_dispatches". Player Dispatches are cut from v1 and
  // return in v1.2 with the live conduit, alongside the reserved dispatch
  // field in gp.v1.Playbook.
  reserved 82;
  reserved "METHOD_GET_DISPATCHES";

  // There is deliberately no "connect" in v1: nothing outside the game
  // attaches to a seat. gamectl connect arrives in v1.2.
  reserved 83;
  reserved "METHOD_CONNECT";
}

// =============================================================================
// Shared parameters
// =============================================================================

// Namespace holder for the verify_plan depth. The verifier pipeline is
// decode -> structure -> resolve -> semantics (together QUICK, <= 5 ms p99,
// run on every edit) -> estimate -> lint (FULL, <= 50 ms p99 at the size
// budget, always run on submit) — spec section 11.
message VerifyPlan {
  Depth depth = 1;

  enum Depth {
    DEPTH_UNSPECIFIED = 0;

    // "quick"
    QUICK = 1;

    // "full". The default when depth is omitted, and what submit_plan always
    // runs.
    FULL = 2;
  }
}

// Namespace holder for the read-method budgets. Results are truncated in a
// fixed salience order. No v1 client is a model, so nothing actually spends
// these tokens; the budgets are kept because they are the shape the v1.1 API
// needs (spec section 12, "Budgets").
message ReadOptions {
  Detail detail = 1;

  enum Detail {
    DETAIL_UNSPECIFIED = 0;

    // <= 1.5k model tokens.
    BRIEF = 1;

    // <= 4k model tokens.
    STANDARD = 2;

    // <= 10k model tokens.
    FULL = 3;
  }
}

// =============================================================================
// Errors
// =============================================================================

// The closed error set (spec section 12, "Errors"). Closed means closed:
// adding a code is a contract change and needs owner approval, and no client
// may invent one.
//
// Again: an invalid playbook is not a method error. It comes back as a full
// verifier report with qualifies:false and diagnostics carrying codes from
// the E/W/I families (spec section 11), which are a different namespace from
// these.
message GatewayError {
  Code code = 1;

  // English. Every user-facing string in v1 lives in one string table;
  // translation is roadmap. The code is what a client branches on — codes are
  // language-neutral, messages are not.
  string message = 2;

  enum Code {
    ERROR_CODE_UNSPECIFIED = 0;

    // --- Named in the spec -------------------------------------------------

    // The method is not available in the current phase. Planning is closed
    // during the Push and the recap.
    PHASE_CLOSED = 1;

    // The request is pinned to a snapshot that is no longer current, or to an
    // expired pagination cursor. Cursors are opaque and tied to the snapshot.
    STALE_SNAPSHOT = 2;

    // No verified submission exists where one is required.
    NO_QUALIFYING_PLAN = 3;

    // Rate limited.
    RATE_LIMITED = 4;

    // Numbers 5-9 are free for a further code the spec names.

    // --- Derived from section 12's security paragraph, not named there
    // --- verbatim ----------------------------------------------------------
    //
    // KEPT, all six, and the test is the one the block below asks of itself:
    // a code earns its place only if a client can act on it differently from
    // every other code. UNAUTHENTICATED means get a token; FORBIDDEN_SCOPE
    // means this token will never work for this method, so stop asking;
    // NOT_FOUND means the name is wrong or is not yours; INVALID_ARGUMENT
    // means the request is wrong and retrying it unchanged cannot help;
    // UNSUPPORTED_SCHEMA_VERSION means the file needs converting, and is
    // distinct from a verifier diagnostic because no report can be produced
    // for a version that will not decode; INTERNAL means retry is reasonable
    // and nothing the caller did caused it. Collapsing any of them into
    // INVALID_ARGUMENT would make a closed error set that cannot tell a
    // client whether to fix the request, fix the token or try again — and the
    // set is closed, so a client has nothing else to read.
    //
    // PLACEHOLDER: the six are the schema's proposal, not a ratified
    // decision. OWNER ratifies or cuts them with an entry in
    // docs/design/decisions-log.md section 2.7, at the latest when T13 fills
    // the gateway payloads and becomes the first code that raises one — that
    // is the first point at which the choice is testable rather than
    // theoretical. Cutting one afterwards is a contract change and its number
    // stays reserved either way; nothing in the schema depends on the six, so
    // the cost of holding the question open to T13 is a comment.

    // Missing, malformed, expired or revoked token, or a failed Host/Origin
    // check. Per-seat 256-bit tokens are tied to the match and the seat and
    // are revocable from the lobby.
    UNAUTHENTICATED = 10;

    // The token is valid but lacks the scope this method needs. Also the
    // answer when a seat token asks for anything spectate.nofog gates, and
    // when an admin token reaches for another seat's playbooks, drafts or
    // knowledge.
    FORBIDDEN_SCOPE = 11;

    // A named beacon, draft, template or cursor does not exist, or is not
    // this seat's.
    NOT_FOUND = 12;

    // The request itself is malformed: an unknown method, a missing param, a
    // param out of range.
    INVALID_ARGUMENT = 13;

    // The playbook decodes at a schema version this build does not support.
    // Distinct from a verifier E000x, because the gateway cannot produce a
    // report for a version it cannot decode.
    UNSUPPORTED_SCHEMA_VERSION = 14;

    // The gateway failed. Never used to report anything the caller could have
    // avoided.
    INTERNAL = 15;
  }
}

// =============================================================================
// The result envelope
// =============================================================================

// The `_status` footer every result carries (spec section 12, "Budgets").
// Written under the key `_status`, which is not a legal proto identifier, so
// this message is the footer's SHAPE and never a field of the messages below.
message Status {
  Phase phase = 1;

  // Game milliseconds left in the current phase. The Lull's timer is a host
  // concern and the Push's is game time; both are reported here in the same
  // unit so a client needs no arithmetic of its own.
  int32 phase_remaining_ms = 2;

  // The coming segment's length, from the frozen snapshot rather than from a
  // constant (spec section 10, "Segment end").
  int32 segment_length_ms = 3;

  // 1-based. The round the match is on.
  uint32 round = 4;

  enum Phase {
    PHASE_UNSPECIFIED = 0;
    LOBBY = 1;
    LULL = 2;
    PUSH = 3;
    RECAP = 4;
    ENDED = 5;
  }
}

// =============================================================================
// Status
// =============================================================================

message GetStatusRequest {}

message GetStatusResponse {
  Status status = 1;
}

// Long poll. Returns when the trigger fires or the timeout elapses; a timeout
// is a normal result, not an error.
message WaitForRequest {
  Trigger trigger = 1;

  // Game milliseconds. The gateway caps it.
  int32 timeout_ms = 2;

  // Opaque, snapshot-tied. For FEED_DIGEST, where to wait from.
  string cursor = 3;

  enum Trigger {
    TRIGGER_UNSPECIFIED = 0;
    PHASE_CHANGE = 1;
    FEED_DIGEST = 2;
  }
}

message WaitForResponse {
  // False when the call returned because its timeout elapsed.
  bool fired = 1;

  Status status = 2;

  // Where to wait from next.
  string cursor = 3;
}

// =============================================================================
// Memory
// =============================================================================

// The private seat notebook. Never leaves the gateway for another seat.
message SaveNotesRequest {
  // 4,000 characters. Longer is INVALID_ARGUMENT, never a silent truncation.
  string notes = 1;
}

message SaveNotesResponse {
  // Characters stored, so the editor's counter reads the gateway's number
  // rather than counting for itself.
  uint32 characters = 1;
}

// =============================================================================
// Knowledge
// =============================================================================

// The main read. Carries the notebook, the seat's displayed standing and the
// coming segment's length (spec section 12).
message GetBriefingRequest {
  ReadOptions read_options = 1;
}

message GetBriefingResponse {
  // The notebook, at the top, as spec section 12 asks.
  string notes = 1;

  // The seat's OWN score and rank only. Live standings never carry another
  // seat's numbers (spec section 3).
  Standing standing = 2;

  int32 segment_length_ms = 3;

  // Deterministic template prose (spec section 12, "Output": each result has
  // structured JSON plus prose).
  string prose = 4;

  // PLACEHOLDER STUB - the structured knowledge payload, truncated in the
  // fixed salience order the detail budget sets. Filled by T13 (the gateway's
  // method slice) against the seat's frozen snapshot; 5-15 are held so its
  // first fields stay in the one-byte tag range.
  reserved 5 to 15;
}

// The seat's own place on the displayed standing (the full audit score of
// spec section 3), not the BMI band.
message Standing {
  uint32 rank = 1;
  int32 score = 2;
  uint32 living_seats = 3;
}

message GetRecapRequest {
  ReadOptions read_options = 1;
}

message GetRecapResponse {
  string prose = 1;

  // PLACEHOLDER STUB - the settlement lines of spec section 7. Filled by T13
  // once T14's economy produces them.
  reserved 2 to 15;
}

message ListBeaconsRequest {
  ReadOptions read_options = 1;

  // Opaque and snapshot-tied. An expired cursor is STALE_SNAPSHOT.
  string cursor = 2;
}

message ListBeaconsResponse {
  repeated BeaconSummary beacons = 1;

  // Empty when the listing is complete.
  string next_cursor = 2;
}

// One beacon as the seat knows it.
message BeaconSummary {
  string beacon_id = 1;
  gp.v1.Voxel at = 2;

  // PLACEHOLDER STUB - mandate, HP, power state, units by role, tags, and the
  // sighting age for a beacon that is not the seat's own. Filled by T13; the
  // fields that exist here are the two a beacon has before any other system
  // does.
  reserved 3 to 15;
}

message GetBeaconRequest {
  string beacon_id = 1;
  ReadOptions read_options = 2;
}

message GetBeaconResponse {
  BeaconSummary summary = 1;
  string prose = 2;

  // PLACEHOLDER STUB - the per-beacon detail. Filled by T13.
  reserved 3 to 15;
}

message GetMapSummaryRequest {
  ReadOptions read_options = 1;
}

message GetMapSummaryResponse {
  // Voxels on each axis.
  gp.v1.Voxel size = 1;

  // DEPRECATED, and never served: the match seed is 64 bits wide
  // (pharmakos_sim::world::WorldConfig::match_seed, and "the map seed IS the
  // match seed"), so a uint32 cannot carry it and the low half of a seed names
  // no map at all. T13 found this the first time a method had to answer the
  // question. `match_seed` below replaces it; this number stays occupied
  // rather than being reused, which is the rule for every retired number in
  // this schema.
  uint32 map_seed = 2 [deprecated = true];

  string prose = 3;

  // The seed the map was generated from, as a quoted hexadecimal string:
  // "0x00000000ca5caded". Part of the match, not a secret.
  //
  // A STRING, for the reason scenarios/README.md gives about the same number:
  // a JSON number is a double in half the world's parsers and a 64-bit seed
  // loses its low bits in one. The proto3 JSON mapping would have quoted a
  // uint64 anyway; spelling it as a string makes the base explicit and matches
  // the scenario file a reader will compare it against.
  string match_seed = 4;

  // PLACEHOLDER STUB - vents, seams and terrain summary, fog-filtered. Filled
  // over T5's generated map at S1, with the economy that gives a vent and a
  // seam something to report.
  reserved 5 to 15;
}

// `$` and kW, with what-ifs (spec section 12). The arithmetic is the
// Quartermaster's projection, which is an ALLOWED estimate: no dry run, no
// stepping, no modelling of anybody else (spec section 11).
message GetEconomyForecastRequest {
  ReadOptions read_options = 1;

  // Each one is answered independently against the same frozen snapshot.
  repeated WhatIf what_ifs = 2;
}

// PLACEHOLDER STUB - the what-if vocabulary (place a beacon here, queue this
// structure, field these units). Filled by T13 with T14's economy; 1-15 are
// held.
message WhatIf {
  reserved 1 to 15;
}

message GetEconomyForecastResponse {
  // PLACEHOLDER STUB - treasury, projected income, kW supply, draw and
  // headroom, plus one answer per what-if. Filled by T13 with T14's economy.
  reserved 1 to 15;
}

// The travel estimate of item 61, exposed. Abstract search only; it never
// refines, steps or forks. Never optimistic: the answer is a bound the editor
// may round up, and a fogged leg is labelled as a bound rather than an ETA.
message EstimateRouteRequest {
  // Two or more. Legs are estimated in order.
  repeated gp.v1.Location waypoints = 1;
}

message EstimateRouteResponse {
  // False when the connectivity oracle answers "no route" before any search.
  // The other fields are then unset (spec: `estimate(...) -> Option<...>`).
  bool reachable = 1;

  // Whole-route travel, game milliseconds. Never ticks on the wire.
  int32 ms = 2;

  repeated Leg legs = 3;
}

message Leg {
  // Where this leg ends.
  gp.v1.Location to = 1;

  // Game milliseconds.
  int32 ms = 2;

  // True when the leg crosses ground the seat has not seen. Its cost was
  // priced at 3/2 per abstract edge, and the editor draws it dashed and
  // labels it as a bound (item 57).
  bool fogged = 3;
}

// =============================================================================
// Docs
// =============================================================================

// Generated from the schema, so it cannot drift (spec section 12).
message GetSchemaRequest {
  // Which slice. Lower-case, matching the walkthrough's `{part:"step"}`.
  // Empty means the whole of what the seat can use.
  string part = 1;
}

message GetSchemaResponse {
  // JSON Schema, as generated text.
  string json_schema = 1;
}

message ListTemplatesRequest {
  // Optional filter, matching the walkthrough's `{tag:"attack"}`.
  string tag = 1;

  string cursor = 2;
}

message ListTemplatesResponse {
  repeated TemplateSummary templates = 1;
  string next_cursor = 2;
}

message TemplateSummary {
  string template_id = 1;
  string title = 2;
  repeated string tags = 3;

  // One sentence, from the template file itself.
  string summary = 4;
}

// =============================================================================
// Planning
// =============================================================================

message InstantiateTemplateRequest {
  string template_id = 1;
  repeated Parameter parameters = 2;
}

// PLACEHOLDER STUB - a typed parameter catalogue is S6's, with the editor and
// the template library. Name and text value until then: the template declares
// what it accepts and the verifier rejects what does not fit, so the wire
// shape does not have to carry the type.
message Parameter {
  string name = 1;
  string value = 2;
}

message InstantiateTemplateResponse {
  // A whole playbook file, JSONC, comments included.
  string playbook_jsonc = 1;
}

message VerifyPlanRequest {
  string playbook_jsonc = 1;

  // Defaults to FULL when omitted (spec section 11).
  VerifyPlan.Depth depth = 2;
}

message VerifyPlanResponse {
  VerifyReport report = 1;
}

// Spec section 11. The result is a pure function of five inputs - playbook
// bytes, snapshot, rules hash, verifier version and depth - so a pre-check and
// the check at submit are byte-identical, and two reports compare only within
// one depth.
message VerifyReport {
  bool qualifies = 1;

  // Which depth produced this report. Part of the hashed input, so it is part
  // of the report.
  VerifyPlan.Depth depth = 2;

  repeated Diagnostic diagnostics = 3;

  // xxh3-64 over the five inputs, eight bytes big-endian.
  bytes report_hash = 4;

  // The rules table this report was produced against.
  bytes rules_hash = 5;

  // gp.v1.Meta.fingerprint for the bytes that were checked.
  bytes plan_fingerprint = 6;

  // Opaque build identity of the verifier. Changing it moves report_hash.
  string verifier_version = 7;

  // Where the playbook sits against the size budget, so the editor's meter
  // reads the verifier's number rather than counting for itself.
  uint32 size_units = 8;
  uint32 size_budget = 9;
}

// Modelled on rustc's JSON output (spec section 11).
message Diagnostic {
  // Language-neutral. E000x, E01xx, ... W07xx, I... . Append-only from the
  // day a code ships.
  string code = 1;

  Severity severity = 2;

  // RFC 6901 JSON Pointer into the playbook.
  //
  // ONE NAMED EXCEPTION, and it is the only one (decisions-log item 96 (2)):
  // when the bytes are not JSON at all there is no tree to point into, so
  // E0001 carries `/byte/<offset>` — the byte offset the parser stopped at —
  // and the verifier forwards that unchanged. It is deliberately not an RFC
  // 6901 pointer, because there is no document for one to address; a client
  // branches on the `/byte/` prefix and puts the caret at that offset rather
  // than resolving a path.
  string path = 3;

  // Other places that matter to this diagnostic.
  repeated string related_paths = 4;

  // Precise, English, from the one string table.
  string message = 5;

  // The plain-language beginner sentence.
  string beginner = 6;

  repeated PatchSuggestion suggestions = 7;

  // Places on the map the diagnostic refers to.
  repeated gp.v1.Voxel map_refs = 8;

  enum Severity {
    SEVERITY_UNSPECIFIED = 0;
    ERROR = 1;
    WARNING = 2;
    INFO = 3;
  }
}

// A fix the editor can offer. `patch_plan` applies one.
message PatchSuggestion {
  // What the button says.
  string title = 1;

  // RFC 6902 JSON Patch, as text, so it round-trips through the same JSONC
  // layer the playbook does.
  string json_patch = 2;

  Applicability applicability = 3;

  // rustc's four, minus the one that has no meaning here.
  enum Applicability {
    APPLICABILITY_UNSPECIFIED = 0;

    // Safe to apply without review. These are the editor's Fix buttons.
    MACHINE_APPLICABLE = 1;

    // Probably right; the author should look.
    MAYBE_INCORRECT = 2;

    // Contains something the author must fill in.
    HAS_PLACEHOLDERS = 3;
  }
}

message RenderPlanRequest {
  string playbook_jsonc = 1;
}

message RenderPlanResponse {
  // Deterministic template prose. Reads the coming segment's length from the
  // frozen snapshot, never from a constant.
  string prose = 1;
}

message PatchPlanRequest {
  string playbook_jsonc = 1;

  // RFC 6902 JSON Patch.
  string json_patch = 2;
}

message PatchPlanResponse {
  // The patched file, comments and formatting preserved.
  string playbook_jsonc = 1;

  // The patch that undoes this one, for the editor's undo stack.
  string inverse_json_patch = 2;
}

message SaveDraftRequest {
  string playbook_jsonc = 1;

  // The author's name for it.
  string label = 2;
}

message SaveDraftResponse {
  string draft_id = 1;
}

message ListDraftsRequest {
  string cursor = 1;
}

message ListDraftsResponse {
  repeated DraftSummary drafts = 1;
  string next_cursor = 2;
}

message DraftSummary {
  string draft_id = 1;
  string label = 2;

  // Which round it was saved in. A draft is bound to a match.
  uint32 round = 3;
}

// What the operator would file on a timeout, so a seat can see the cost of one
// (spec section 14). Always qualifies.
message GetSafePlanRequest {}

message GetSafePlanResponse {
  string playbook_jsonc = 1;
}

// =============================================================================
// Commit
// =============================================================================

// Always runs FULL. The latest verified submission replaces the previous one,
// any number of times until the timer ends.
message SubmitPlanRequest {
  string playbook_jsonc = 1;
}

message SubmitPlanResponse {
  // An invalid playbook is NOT a method error: this comes back with
  // qualifies:false and `accepted` false.
  VerifyReport report = 1;

  // True when this submission is now the seat's sealed order.
  bool accepted = 2;
}

message SetReadyRequest {
  bool ready = 1;
}

message SetReadyResponse {
  Status status = 1;
}

// =============================================================================
// During play
// =============================================================================

// Fog-filtered events plus a digest for every 60 s of game time. Engine
// chatter rides the same feed as labelled one-way lines. Planning is closed
// during play and the recap.
message GetSegmentFeedRequest {
  // Opaque, snapshot-tied. Empty starts at the beginning of the segment.
  string cursor = 1;

  ReadOptions read_options = 2;
}

message GetSegmentFeedResponse {
  repeated Event events = 1;
  repeated Digest digests = 2;
  string next_cursor = 3;
}

message Event {
  // Game milliseconds since the start of the segment.
  int32 at_ms = 1;

  // PLACEHOLDER STUB - the event-kind catalogue is T10's event bus and grows
  // with every stage, so it is a string here rather than an enum that would
  // have to be re-cut at S1, S2 and S4. It becomes an enum when the catalogue
  // stops moving; until then the golden feed files are what pin it.
  string kind = 2;

  // English, from the one string table. Engine chatter is a line of this kind
  // and is labelled as one-way: no seat reads another seat's anything.
  string text = 3;

  // Where it happened, when it happened somewhere.
  gp.v1.Voxel at = 4;

  // PLACEHOLDER STUB - the per-kind structured payload. Filled by T13.
  reserved 5 to 15;
}

// One 60-second digest of game time.
message Digest {
  int32 from_ms = 1;
  int32 to_ms = 2;
  string text = 3;

  // How many events of each kind the window held, in kind-name order so two
  // machines render the same digest.
  //
  // Decisions-log item 97: the scenario format's `event_fired` assertion names
  // an event by the same lower_snake_case string, and T15's
  // `event_count_in_range` extension counts it. Carrying the count here is
  // what lets that assertion land without a new event shape or a format
  // change. The counts are of the events THIS VIEWER may see — a digest is
  // part of a fog-filtered answer — and they cover the whole segment rather
  // than one page of it, so a caller's `cursor`, `limit` and `detail` budget
  // never move them.
  repeated KindCount counts = 4;
}

// How many events of one kind a digest's window held.
message KindCount {
  // The event kind, lower_snake_case, exactly as Event.kind spells it and as a
  // scenario file asserts on it.
  string kind = 1;

  uint32 count = 2;
}

// =============================================================================
// The view
// =============================================================================

// What a camera asks for. One read method, cursor-driven.
//
// An EMPTY cursor asks for a keyframe: every chunk of the map and every entity
// this viewer may see. Any other cursor asks "what changed since the view this
// cursor came from", and a cursor issued before the match was attached is
// STALE_SNAPSHOT — the client's answer to which is to ask for a keyframe
// again.
//
// The answer is PAGED: follow `next_cursor` until `complete` is true. A page
// is cut on encoded bytes, never on a chunk count, and the first chunk always
// goes through, so a chunk larger than the page budget is delivered rather
// than being a hole nothing can fill.
message GetViewRequest {
  // Opaque and match-tied. Empty asks for a keyframe.
  string cursor = 1;
}

// One page of the view.
//
// BUILT BY INCLUSION. What a viewer may not see is simply absent: there is no
// total, no count of what was withheld and no "hidden" marker anywhere in this
// message, because a count of what a seat cannot see is a fog leak by
// arithmetic (decisions-log item 26). Nothing here carries a destination, a
// route, a step or rule index, a mandate, a treasury, a score, a hit point or
// a power state.
message GetViewResponse {
  // Game milliseconds since the start of the current segment — the same epoch
  // Event.at_ms has, so a recording can interleave view frames and feed events
  // on one clock. Zero in a Lull. The round is in the `_status` footer.
  int32 at_ms = 1;

  // The chunks this page carries, in ascending chunk order. On a keyframe that
  // is the whole map; on a delta it is the chunks whose bytes FOR THIS VIEWER
  // changed since the cursor.
  repeated ViewChunk chunks = 2;

  // The complete visible entity list, on the page where `complete` is true and
  // on no other. An id absent from it is an entity that is gone or is no
  // longer visible; a client holds no list of its own past that.
  //
  // A delta mode for entities is deliberately NOT here. It arrives, if it
  // arrives, as a new field of GetViewRequest that a client opts into, so that
  // the meaning of this field never changes under a client that did not ask.
  repeated ViewEntity entities = 3;

  // Where to read from next. Opaque.
  string next_cursor = 4;

  // False while more pages of this view are waiting.
  bool complete = 5;
}

// One 32x32x32 chunk of terrain, as materials.
//
// THE PAYLOAD FREEZES TWO FACTS OF THE SIM, so both are written out here and a
// gateway test pins each of them to the sim's own value
// (`the_wire_material_table_is_the_sims`).
//
// 1. THE VOXEL ORDER inside a chunk is x east fastest, then y north, then z
//    up: `index = x + 32*y + 1024*z` (decisions-log item 92). The chunk's
//    extent is implied by the run lengths summing to exactly 32 768; there is
//    no length field and no index field, because `origin` is the chunk's key
//    and an index would freeze an addressing formula into this API.
//
// 2. THE MATERIAL BYTE VALUES:
//
//      0  air                    5  scrap seam, rich
//      1  dirt                   6  heat vent, lean
//      2  stone                  7  heat vent, standard
//      3  scrap seam, lean       8  heat vent, rich
//      4  scrap seam, standard
//
//    ADDITIVE ONLY: a new material takes the next free value and nothing is
//    ever renumbered. A DECODER DRAWS NOTHING FOR A VALUE IT DOES NOT KNOW —
//    which is what lets a material be added without breaking a client built
//    against this list, and what leaves room for a future "not seen" value if
//    the owner ever fogs generated terrain.
message ViewChunk {
  // The chunk's lowest voxel on each axis. This is the chunk's key: a client
  // stores chunks by origin and replaces one when it is sent again.
  gp.v1.Voxel origin = 1;

  // Run-length encoded materials, 3 bytes a run: the material byte, then the
  // run length as a LITTLE-ENDIAN uint16, 1 to 32 768. Runs cross rows and
  // layers freely, and the lengths must sum to exactly 32 768 or the chunk is
  // refused rather than drawn short.
  bytes voxels_rle = 2;

  // RESERVED. 3 was a per-chunk digest, cut because no client in v1 can check
  // one — this schema carries no hash function and a second one is forbidden
  // (AGENTS.md section 5). It comes back, if it comes back, with S7's
  // recordings, which are the first thing that could verify it.
  reserved 3 to 15;
}

// One thing standing on the terrain, as this viewer may see it.
//
// WHERE IT IS AND WHAT IT IS, and nothing else. What a seat may know about an
// ENEMY asset beyond its position is a rule the spec does not state (it lists
// HP, power state and "under attack" for a seat's OWN beacons, and only "units
// near, beacon known, structure near" as enemy knowledge), so hit points,
// power state, heading and build progress are held at 6 to 15 for the stage
// that makes them matter rather than being guessed at here. Facing is derived
// from successive positions by whoever draws it.
message ViewEntity {
  // OPAQUE, and scoped to the viewer this answer was built for. A beacon is
  // `b_NN`, which is already public through list_beacons and is what a
  // playbook names; a unit or a structure is a handle this viewer was given in
  // the order it first saw the thing, because a dense table row id would be a
  // count of everything the match has ever made.
  //
  // It is stable for one viewer for as long as the match is attached, and it
  // means nothing to any other viewer or to any other method — except a `b_NN`
  // id, which get_beacon takes.
  string id = 1;

  Kind kind = 2;

  // What kind of thing within its Kind: `commander`, `drone`, `generator`.
  // Lower_snake_case, from the sim's own catalogue, and empty when this build
  // has no name for it.
  string subtype = 3;

  // The seat that owns it, spelt as this project spells a seat everywhere
  // else: `seat.0`. Empty for a thing nobody owns.
  string owner = 4;

  // Where it stands, in WHOLE voxels, floored on every axis. Finer-than-voxel
  // positions are a recording's concern and are held at 6 to 15 with the rest.
  gp.v1.Voxel at = 5;

  // RESERVED — hit points, power state, heading, build progress, and
  // sub-voxel position. See the message comment.
  reserved 6 to 15;

  enum Kind {
    KIND_UNSPECIFIED = 0;
    UNIT = 1;
    BEACON = 2;
    STRUCTURE = 3;
  }
}

// =============================================================================
// Match control
// =============================================================================

// Seal every seat's orders and open the Push.
message EndLullRequest {}

message EndLullResponse {
  // Nothing but the `_status` footer, which is where the phase is. A field
  // here would be a second place to read what the footer already says.
}

// Run the Push for a stretch of GAME time.
//
// The client decides the pace: speed is how much game time it asks for per
// wall millisecond, and a skip is this call repeated with the largest step it
// allows until the `_status` footer leaves PUSH. The gateway converts to whole
// ticks by FLOORING, stops at segment end, and answers what it actually ran.
message AdvancePushRequest {
  // Game milliseconds, 1 to 60 000. Outside that range the call is
  // INVALID_ARGUMENT and is refused rather than clamped: a client that asked
  // for ten minutes and was told "fine" would read the answer as ten minutes
  // of match.
  int32 ms = 1;
}

message AdvancePushResponse {
  // Game milliseconds actually run, which is a whole number of ticks and may
  // be less than was asked for — at segment end, or when the request was too
  // small to fill one tick. Zero is a normal answer and not an error; the
  // client carries `ms - advanced_ms` as its remainder.
  int32 advanced_ms = 1;
}

// Close the recap and open the next Lull.
message EndRecapRequest {}

message EndRecapResponse {
  // As EndLullResponse: the phase is the footer's.
}

// The host's own clock, reported to a gateway that has none.
//
// THE GATEWAY READS NO CLOCK (AGENTS.md section 4.5). Its tick is the sim's,
// and a Lull, a recap and an ended match consume no sim tick at all — so
// without this call every token would hold one tick's worth of calls for a
// whole recap and for ever after the match ended, which is exactly where the
// full-map unlock lands. `elapsed_ms` is what moves the gateway's tick in
// every phase that spends none.
//
// PHASE_CLOSED during a Push, where the sim's own tick is the clock.
message ReportHostClockRequest {
  // Host time spent in the CURRENT phase, in game milliseconds. Monotone
  // within a phase and at most 60 000 ms further on than the last report;
  // anything else is INVALID_ARGUMENT, refused and audited. After a long stall
  // the client reports in steps.
  int32 elapsed_ms = 1;

  // What the `_status` footer should show as left in a Lull. Zero in every
  // other phase, because no other phase has a declared length to count down.
  int32 remaining_ms = 2;
}

message ReportHostClockResponse {
  // True when every seat of the match has said it is ready — the one bit the
  // lobby needs to let "Ready" end the Lull.
  //
  // An AGGREGATE, deliberately: it names no seat and says nothing about any
  // seat's plan, draft or notebook, so it does not breach "admin can never
  // read another seat's playbooks, drafts or knowledge".
  bool all_ready = 1;
}
