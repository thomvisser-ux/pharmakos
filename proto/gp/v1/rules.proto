// CONTRACT FILE: changes need owner approval.
//
// The rules table (decisions-log item 78). Every tuning value the sim, the
// verifier, the estimator and the mesher read lives in one reviewable file
// whose canonical JSON is `rules/rules.v1.json`, loaded by `pharmakos-sim`
// and hashed with item 48's encoder so `rules_hash` is one of the verifier's
// five inputs by construction.
//
// The split that makes this work, and the reason the table is a schema at
// all: the SHAPE is the contract and `buf breaking` guards it; the VALUES are
// data in the JSON, and a tuning change during S1 or S2 is an ordinary PR.
// AGENTS.md section 12 — "Tuning values are data, versioned in the rules
// table and stamped into the rules hash — not constants sprinkled through the
// code" — is enforced by this file existing.
//
// What is NOT in here: anything that varies with the machine rather than with
// the game. Item 67's caveat and G3''s calibration-constant lesson both point
// the same way, and a performance knob inside hashed state is a desync
// waiting for a slower laptop. Two values sit right on that line and are
// called out where they are declared: the mesher's K and B (a per-frame
// presentation budget, but item 54 makes the drain ORDER a rule, so the whole
// block is data the mesher reads rather than constants it holds) and the
// per-tick repath cap (item 60 makes the cap part of the sim's behaviour, so
// it is hashed like any other rule). Neither is a calibration constant: both
// are the same number on every machine, which is exactly the test.
//
// Every duration is int32 game milliseconds, for the reason
// proto/gp/v1/playbook.proto's header gives at length.

syntax = "proto3";

package gp.v1;

// A value that varies with the richness of the feature it is read off
// (decisions-log item 90). Three rows rather than a proto map: lean, standard
// and rich are the whole domain — spec sections 7 and 9 name those three
// grades and no others — and three named rows diff better in a tuning pull
// request than a map whose canonical JSON key order nobody should have to
// reason about.
//
// Top level in `gp.v1` rather than nested in `RulesTable`, unlike `UnitKind`
// and `StructureKind` further down, and the rule that separates them is what
// the message MEANS rather than how many fields read it. `ByRichness` is a
// QUANTITY type — "this number varies with a grade" — and its nested
// `Richness` enum is the grade itself, which `RulesTable.Map`'s rows name
// directly; both describe the world rather than this table, and a later
// message that has to say "by richness" should be able to say
// `gp.v1.ByRichness` without reaching inside a table. `UnitKind` and
// `StructureKind` are the shape of one block's ROWS and mean nothing outside
// it, so they are nested where they are read.
//
// Two blocks read this one: `Power.generator_output_kw` (output per vent
// richness) and `Economy.ore_yield_per_voxel_dollars` (yield per seam
// richness); `Map` reads the enum. A message's fully-qualified name is part
// of the schema, so relocating it later is a `buf breaking` failure in
// `WIRE_JSON` mode — which is why the choice is stated here rather than left
// to the next reader to infer.
message ByRichness {
  uint32 lean = 1;
  uint32 standard = 2;
  uint32 rich = 3;

  // Which grade the map generator places a feature at (item 90's map rows).
  //
  // Nested, like every enum in `gp.v1` without exception, because proto enum
  // values live in the PARENT scope: a top-level enum here would put the bare
  // names LEAN, STANDARD and RICH into `gp.v1` itself, where canonical JSON
  // needs them to stay unique, and no other enum in the package could ever
  // spell them (proto/buf.yaml's `ENUM_VALUE_PREFIX` exception says why the
  // names are bare; playbook.proto's header says why every enum is nested).
  //
  // The zero value keeps its full prefix because it is a sentinel: an unset
  // richness is a map-generator error, never a default.
  enum Richness {
    RICHNESS_UNSPECIFIED = 0;
    LEAN = 1;
    STANDARD = 2;
    RICH = 3;
  }
}

// The whole table. One file, one match, one `rules_hash`.
message RulesTable {
  // Bumped whenever a VALUE changes, so a save or a replay that refuses to
  // load can say which table it was recorded against. The shape's version is
  // the package version, `gp.v1`.
  uint32 revision = 1;

  // Free text: what changed in this revision and why.
  string note = 2;

  Match match = 10;
  Locomotion locomotion = 11;
  Broadphase broadphase = 12;
  InterfaceTimes interface_times = 13;
  Mesher mesher = 14;
  Economy economy = 15;
  Power power = 16;
  Commander commander = 17;
  Beacon beacon = 18;
  Map map = 19;
  Units units = 20;
  Structures structures = 21;
  Verifier verifier = 22;

  // S2's blocks (S2's plan, task con3; decisions-log item 144). 3 to 9 stay
  // free for scalars of the table itself; the blocks continue from 23.
  Combat combat = 23;
  Defend defend = 24;
  Collapse collapse = 25;
  Materials materials = 26;

  // Match structure (spec section 3; item 68).
  message Match {
    // The per-round length list, in game milliseconds, in the order the
    // rounds are played. Item 68 measured the 3 / 5 / 8 ladder affordable and
    // kept it. The runner reads the coming segment's length from the frozen
    // snapshot, never from a constant — this list is where the snapshot's
    // value comes from.
    repeated int32 segment_lengths_ms = 1;

    // The planning timer of every Lull after the first, in game milliseconds:
    // spec section 3's five minutes (decisions-log item 127 (2), which
    // re-rules D-01's 180 000 for S1). The first Lull's is `first_lull_ms`
    // below. Read by the host and the editor, never by the sim: the Lull
    // timer is a UI and host concern (AGENTS.md section 4.5). Ready still
    // ends a Lull at once.
    //
    // The gateway and `gamectl` time every Lull after the first with this
    // row, and the first with `first_lull_ms` (S1's `econ`, #92).
    //
    // PLACEHOLDER: value is Tuning — owner, at S2's demo (decisions-log item
    // 139 (1) ruling 6: the two Lull rows stand for S1).
    int32 lull_ms = 2;

    // The interpreter's decision tick, in game milliseconds: how often a
    // sealed playbook is re-evaluated during a Push (spec section 11; item
    // 90). 250 ms is exactly five sim ticks at 20 Hz, so it divides the tick
    // rate and no decision lands between ticks.
    //
    // PLACEHOLDER: tuning — owner, S3.
    int32 decision_tick_ms = 3;

    // The first Lull's planning timer, in game milliseconds: spec section 3's
    // ten minutes, the time a seat has to read the map and write its first
    // playbook (decisions-log item 127 (2); S1's plan, decision 10). A row of
    // its own because `lull_ms` is one value and the spec gives the first
    // Lull a different one. Read by the host and the editor, never by the
    // sim, like `lull_ms`.
    //
    // PLACEHOLDER: value is Tuning — owner, at S2's demo (item 139 (1) ruling
    // 6: the two Lull rows stand for S1).
    int32 first_lull_ms = 4;
  }

  // Locomotion and pathing (item 59, item 69).
  message Locomotion {
    // Integer move costs. Cost converts to ticks by CEILING, never by
    // truncation, so an estimate is never optimistic (item 61).
    uint32 step_cost_cardinal = 1;   // item 59: 10
    uint32 step_cost_diagonal = 2;   // item 59: 14
    uint32 climb_surcharge = 3;      // item 59: 4, one-voxel climbs

    // SUPERSEDED by the per-kind `*_cost_per_second` rows below (item 90).
    //
    // Item 59's value of 3 cost units per tick is 6 voxels/s at 20 Hz — an
    // order of magnitude above the spec's stated commander range of 1 to 1.5
    // voxels/s on a 384-voxel map, so item 90 amends the REPRESENTATION while
    // keeping item 59's model in full (10 / 14 / 4, and cost converts to ticks
    // by ceiling, never optimistically). The row stays in the schema because
    // deleting a field is a `buf breaking` failure in WIRE_JSON mode and it
    // costs nothing to carry until the schema's first allowed break. Nothing
    // reads it.
    uint32 move_cost_per_tick = 4;   // item 59: 3, superseded

    // Per-tick repath cap, served round-robin in (seat, beacon, unit) order
    // (item 60). Hashed state, not a calibration constant: the cap changes
    // which unit repaths on which tick, so it has to be the same number
    // everywhere.
    //
    // PLACEHOLDER: 16 is item 69's value — owner, at S2's exit, re-derived once
    // the burst frequency is a measurement rather than a spike's estimate.
    uint32 repath_cap_per_tick = 5;

    // Fog multiplier on an abstract edge, as a fraction: an unseen edge costs
    // `cost * numerator / denominator`, rounded up (item 61: cost * 3 / 2).
    // A fraction rather than a percentage because the arithmetic is integer
    // and the rounding has to be stated.
    uint32 fog_cost_numerator = 6;
    uint32 fog_cost_denominator = 7;

    // Cluster edge in voxels. Item 58: 32, one chunk footprint, a single
    // abstract level.
    uint32 hpa_cluster_voxels = 8;

    // Walking speed per kind, in COST UNITS PER SECOND (item 90, spec section
    // 4). At item 59's 10 cost per cardinal voxel that is decivoxels per
    // second, so commander 10 is 1.0 voxels/s — the low end of the spec's
    // range, which is what makes "several minutes of commander walking" true
    // on a 384-voxel map.
    //
    // The accumulator rule, so that no division rounds a speed down: each tick
    // a walker adds `cost_per_second` to an integer accumulator and spends one
    // cost unit per 20 accumulated (20 being the tick rate). An ESTIMATE of
    // the same journey is `ceil(cost * 20 / cost_per_second)` ticks, which
    // keeps item 59's ceiling property — an estimate is never optimistic
    // (item 61).
    //
    // PLACEHOLDER: tuning — owner, at S2's demo, with `tune2`'s balance report,
    // whose spawn travel line reads this speed (item 139 (1) ruling 6: it
    // stands for S1, after it stood at the skeleton's demo and at S1's).
    // `commander.cost_per_second` restates it, and the two move together.
    uint32 commander_cost_per_second = 9;    // item 90: 10 — 1.0 voxels/s

    // Build, mining and repair-reclaim drones all walk at the same speed.
    //
    // PLACEHOLDER: tuning — owner, at S3, with the balance check re-run once
    // `toward` lets Easy reach past one beacon (item 139 (1) ruling 6: it stands
    // for S1, after `tune`'s report kept item 90's seed). The three drone
    // kinds' `cost_per_second` restate it: if `tune2` moves
    // `units.repair_drone`'s speed in S2, this row and the other two drones'
    // move with it there.
    uint32 drone_cost_per_second = 10;       // item 90: 10

    // PLACEHOLDER: tuning — owner, S2.
    uint32 raider_cost_per_second = 11;      // item 90: 12

    // PLACEHOLDER: tuning — owner, S2.
    uint32 scout_cost_per_second = 12;       // item 90: 20 — 2.0 voxels/s

    // Voxels of clear air a walker needs above the column it stands on: a
    // column whose surface is within this many voxels of the world ceiling is
    // not walkable. The locomotion rule, not a performance knob (the
    // register's S2-05; S2's plan, E26). The sim held it as a named constant
    // (`pathing.rs`' `HEADROOM_VOXELS`); this is that constant's row, at its
    // own value, so a table that carries it moves no chain until S2's `ids`
    // swaps the constant for the row.
    //
    // PLACEHOLDER: tuning, today's constant — owner, at S2's demo, with
    // `tune2`'s report (decision 17 proposes no change from 2).
    uint32 headroom_voxels = 13;             // S2-05: 2
  }

  // The CSR uniform grid the broadphase rebuilds by counting sort (item 67).
  message Broadphase {
    // Cell edge in voxels.
    //
    // PLACEHOLDER: Tuning, tied to unit density — owner, at S2's exit. Item
    // 67's caveat: the broadphase is super-linear in density, so this number
    // is a real tuning value and not a constant anybody may guess.
    uint32 cell_size_voxels = 1;
  }

  // On-site interface times (spec section 5). All game milliseconds.
  message InterfaceTimes {
    int32 visit_handshake_ms = 1;          // 1500
    int32 set_priority_ms = 2;             // 1500
    int32 edit_settings_base_ms = 3;       // 2000
    int32 edit_settings_per_field_ms = 4;  // 500
    int32 edit_settings_max_ms = 5;        // 6000
    int32 build_target_ms = 6;             // 2500, add or remove, each
    int32 queue_structure_ms = 7;          // 5000, plus construction time
    int32 switch_mandate_ms = 8;           // 8000
    int32 recycle_ms = 9;                  // 10000
    int32 place_beacon_deploy_ms = 10;     // 12000 (spec section 5)
  }

  // The mesher's per-frame drain budget and its drain order (item 54). Read
  // by `pharmakos-mesher`, which is a walled crate: these values cross the
  // wall as integers, which is the only direction anything crosses it.
  message Mesher {
    // K: surfaces uploaded per frame.
    //
    // PLACEHOLDER: Tuning — owner, at S6's art pass: no measured frame-time
    // reason separates K = 4 from K = 8 on the spike machine (item 54).
    uint32 surfaces_per_frame = 1;

    // B: bytes uploaded per frame. Item 54: 512 KiB.
    //
    // PLACEHOLDER: Tuning, same note as K — owner, at S6's art pass.
    uint32 bytes_per_frame = 2;

    // The ageing term of the drain order: a queued surface older than this
    // many frames drains before the nearest-camera rule applies. Item 54's
    // "older than 2 frames".
    //
    // PLACEHOLDER: untested insurance (item 54) — owner, at S6's art pass.
    uint32 age_frames = 3;

    // Light bake. LIGHT_MAX is the brightest sky value, LIGHT_ATTEN the fall
    // per voxel; the mesher derives its dirty pad from them as light reach
    // plus one rather than asserting a number (G1 section 10.12).
    //
    // PLACEHOLDER: Tuning — owner, at S6's art polish.
    uint32 light_max = 4;
    uint32 light_atten = 5;
  }

  // Every `$` row that is not a per-item price (those are in `Units` and
  // `Structures`). Spec section 7; the numbers are item 90's. Each one is
  // Tuning and none of them may become a constant in code.
  //
  // Field numbers 13-15 stay held so the next three rows keep the one-byte tag
  // range, the reason the stub reserved 1 to 15 in the first place. Field 12
  // was held the same way and is discharged by `mining_carry_voxels` (S1's
  // first contract pull request, whose scoped `ignore_only` in
  // `proto/buf.yaml` told buf about the discharge until it was on `main`).
  message Economy {
    reserved 13 to 15;

    // Base Maintenance Indemnity: the `$` a seat is paid per settlement
    // (spec section 7).
    //
    // PLACEHOLDER: tuning — owner, at S3, with the balance check re-run once
    // `toward` lets Easy reach past one beacon (item 139 (1) ruling 6: it stands
    // for S1, after `tune`'s report kept item 90's seed).
    uint32 bmi_dollars = 1;                        // item 90: 100

    // Starting `$` as a MULTIPLE of the BMI, so the spec's rule — "starting
    // money is two indemnities" — stays a rule rather than being flattened
    // into a second number that can drift away from the first.
    //
    // PLACEHOLDER: tuning — owner, at S3, with the balance check re-run once
    // `toward` lets Easy reach past one beacon (item 139 (1) ruling 6: it stands
    // for S1, after `tune`'s report kept item 90's seed).
    uint32 starting_bmi_multiplier = 2;            // item 90: 2, so $ 200

    // Settlement scaling by standing (spec section 7): last place is paid
    // this many percent more, the leader this many percent less, linear
    // between.
    //
    // PLACEHOLDER: tuning — owner, at S3, with the balance check re-run once
    // `toward` lets Easy reach past one beacon (item 139 (1) ruling 6: it stands
    // for S1, after `tune`'s report kept item 90's seed).
    uint32 scaling_last_place_bonus_percent = 3;   // item 90: 10
    // PLACEHOLDER: tuning — owner, at S3, with the balance check re-run once
    // `toward` lets Easy reach past one beacon (item 139 (1) ruling 6: it stands
    // for S1, after `tune`'s report kept item 90's seed).
    uint32 scaling_leader_malus_percent = 4;       // item 90: 5

    // The award fund, as a percentage of one BMI per settlement (S4's
    // licences and awards).
    //
    // PLACEHOLDER: tuning — owner, S4.
    uint32 award_fund_percent_of_bmi = 5;          // item 90: 50

    // Recycling a standing asset refunds this percentage of its REMAINING
    // value (spec section 7).
    //
    // PLACEHOLDER: tuning — owner, at S3, with the balance check re-run once
    // `toward` lets Easy reach past one beacon (item 139 (1) ruling 6: it stands
    // for S1, after `tune`'s report kept item 90's seed).
    uint32 recycle_refund_percent = 6;             // item 90: 50

    // A wreck or a ruin salvages this percentage of the thing's build cost
    // (S2's destruction).
    //
    // PLACEHOLDER: tuning — owner, S2.
    uint32 salvage_percent = 7;                    // item 90: 25

    // The fabricator's backlog warning: outstanding work items per available
    // drone, above which the Quartermaster reports a backlog.
    //
    // PLACEHOLDER: tuning — owner, at S3, with the balance check re-run once
    // `toward` lets Easy reach past one beacon (item 139 (1) ruling 6: it stands
    // for S1, after `tune`'s report kept item 90's seed).
    uint32 backlog_threshold_per_drone = 8;        // item 90: 2

    // Ore yield in `$` per mined voxel, by the richness of the seam it came
    // out of (item 90). With `seam_voxels` below, a seam is worth 300 / 600 /
    // 1 200 `$`.
    //
    // PLACEHOLDER: tuning — owner, at S3, with the balance check re-run once
    // `toward` lets Easy reach past one beacon (item 139 (1) ruling 6: it stands
    // for S1, after `tune`'s report kept item 90's seed).
    ByRichness ore_yield_per_voxel_dollars = 9;    // item 90: 2 / 4 / 8

    // Ore voxels in one scrap seam, whatever its richness.
    //
    // PLACEHOLDER: tuning — owner, at S3, with the balance check re-run once
    // `toward` lets Easy reach past one beacon (item 139 (1) ruling 6: it stands
    // for S1, after `tune`'s report kept item 90's seed).
    uint32 seam_voxels = 10;                       // item 90: 150

    // Game milliseconds one mining drone spends per ore voxel.
    //
    // PLACEHOLDER: tuning — owner, at S3, with the balance check re-run once
    // `toward` lets Easy reach past one beacon (item 139 (1) ruling 6: it stands
    // for S1, after `tune`'s report kept item 90's seed).
    int32 mining_ms_per_voxel = 11;                // item 90: 2000

    // Ore voxels a mining drone carries before it walks its load home, where
    // the delivered ore is credited at once (spec sections 6 and 7). No row
    // said how much a drone carries, so the sim held it as a named constant;
    // this is that constant's row (the register's S1-25; S1's plan, decisions
    // 10 and 13), at the constant's own value, so a table that carries it
    // moves no chain. Sixteen makes a `seam_voxels` = 150 seam about nine
    // round trips rather than one or a hundred and fifty. The sim reads it at
    // load (`RulesTable::mining_carry_voxels`, S1's `mine`, #86), refused at
    // zero, and the constant is gone.
    //
    // `carry`, not the register's proposed `mining_load_voxels`: a field name
    // is permanent under WIRE_JSON, and `crates/gateway/tests/confinement.rs`
    // refuses any `gp.*` field named with the word `load`, which reads as
    // loading code or a file (AGENTS.md section 7).
    //
    // PLACEHOLDER: tuning — owner, at S3, with the balance check re-run once
    // `toward` lets Easy reach past one beacon (item 139 (1) ruling 6: it stands
    // for S1, after `tune`'s report kept revision 4's value).
    uint32 mining_carry_voxels = 12;               // S1-25: 16
  }

  // Every `kW` row (spec section 7; items 65, 90 and 91). Per-item draw is in
  // `Units` and `Structures`; what is here is the supply side and the two
  // numbers the brownout and the map generator are sized against.
  //
  // Field numbers 8-15 stay held for S1's dormancy and S2's brownout
  // tie-breaks, so those rows keep the one-byte tag range.
  //
  // The supply rows marked for S3 below wait for S3 unless S2's exit lowers
  // `map_ceiling_kw` below the map's supply (mapgen's supply-fits-ceiling
  // rule, item 91): then they move with it, under `g3r` and `tune2`.
  message Power {
    reserved 8 to 15;

    // The pre-placed key core's deep-bore surplus: supply a seat has before
    // it builds anything.
    //
    // PLACEHOLDER: tuning — owner, at S3, with the balance check re-run once
    // `toward` lets Easy reach past one beacon (item 139 (1) ruling 6: it stands
    // for S1, after `tune`'s report kept item 90's seed).
    uint32 core_surplus_kw = 1;                    // item 90: 10

    // A Generator's output, by the richness of the heat vent it sits on.
    //
    // PLACEHOLDER: tuning — owner, at S3, with the balance check re-run once
    // `toward` lets Easy reach past one beacon (item 139 (1) ruling 6: it stands
    // for S1, after `tune`'s report kept item 90's seed).
    ByRichness generator_output_kw = 2;            // item 90: 20 / 30 / 40

    // Draw per fielded unit, every kind (item 91). Every per-kind `draw_kw`
    // row in `Units` is this same 1, so item 65's average and the per-kind
    // draws agree at the skeleton.
    //
    // PLACEHOLDER: tuning — owner, at S2's exit (item 91 moves all three of
    // this, `reserve_percent` and `map_ceiling_kw` together).
    uint32 kw_per_unit = 3;                        // item 91: 1

    // The headroom item 65 keeps free inside the ceiling, as a percentage.
    //
    // PLACEHOLDER: tuning — owner, at S2's exit (item 91).
    uint32 reserve_percent = 4;                    // item 91: 40

    // The per-map supply ceiling, in kW.
    //
    // DERIVED, and a row anyway (item 91). It is the result of item 65's
    // budget at 20 craters/s, but two of that budget's three inputs — the
    // tick's fixed cost and the crater cost — are measurements of the code
    // rather than rules, so there is nowhere else the RESULT can live where
    // the map generator and a reviewer can both read it. T5 checks its own
    // total against this row: three seats supply 3 x 10 + 3 x 20 + 2 x 30 +
    // 40 = 190 kW, exactly the ceiling; two seats, 160.
    //
    // PLACEHOLDER: tuning — owner, at S2's exit (item 91).
    uint32 map_ceiling_kw = 5;                     // item 91: 190

    // Headroom a dormant asset needs before it may revive, so a grid on the
    // edge does not oscillate.
    //
    // PLACEHOLDER: tuning — owner, at S3, with the balance check re-run once
    // `toward` lets Easy reach past one beacon (item 139 (1) ruling 6: it stands
    // for S1, after `tune`'s report kept item 90's seed).
    uint32 revive_margin_kw = 6;                   // item 90: 2

    // A beacon's own draw. Net zero through its own key-core, which is why it
    // is stated rather than assumed (item 90, spec section 5).
    //
    // PLACEHOLDER: tuning — owner, at S3, with the balance check re-run once
    // `toward` lets Easy reach past one beacon (item 139 (1) ruling 6: it stands
    // for S1, after `tune`'s report kept item 90's seed).
    // `structures.beacon.draw_kw` restates it, and moves with it.
    uint32 beacon_base_draw_kw = 7;                // item 90: 2
  }

  // The commander (spec section 4; items 11, 21 and 90). One per seat, the
  // only thing that can change a sealed order, and so the only thing whose
  // walking speed is felt directly by the player.
  message Commander {
    // PLACEHOLDER: tuning — owner, S2.
    uint32 hp = 1;                                 // item 90: 300

    // Cost units per second, the same unit as `locomotion.*_cost_per_second`
    // and repeated here because the commander is not a unit kind.
    //
    // PLACEHOLDER: tuning — owner, at S2's demo, with `tune2`'s balance report
    // (item 139 (1) ruling 6: it stands for S1, after it stood at the
    // skeleton's demo and at S1's).
    uint32 cost_per_second = 2;                    // item 90: 10

    // Respawn after a death: `respawn_base_ms` plus `respawn_growth_ms` per
    // earlier death in the same Push, always completing by segment end (the
    // spec's "for example 30 s, growing with each death").
    //
    // PLACEHOLDER: tuning — owner, S2.
    int32 respawn_base_ms = 3;                     // item 90: 30000
    // PLACEHOLDER: tuning — owner, S2.
    int32 respawn_growth_ms = 4;                   // item 90: 15000

    // How close a walked route has to get before it counts as arrived.
    //
    // PLACEHOLDER: tuning — owner, at S2's demo, with `tune2`'s balance report
    // (item 139 (1) ruling 6: it stands for S1, after it stood at the
    // skeleton's demo and at S1's).
    uint32 arrive_radius_voxels = 5;               // item 90: 2

    // How far from the commander a new beacon may be placed.
    //
    // SUPERSEDED by walk-in (decisions-log item 127 (12), which amends item
    // 11): `place_beacon` walks the commander to its site before it deploys,
    // so there is no range left to check, and since targeting's behaviour
    // lane (`tgt`, #81) nothing reads this row: the deploy needs only the
    // interface range (the sim's `site_is_legal`). The row stays in the
    // schema, as `locomotion.move_cost_per_tick` does, because deleting a
    // field is a `buf breaking` failure in WIRE_JSON mode.
    //
