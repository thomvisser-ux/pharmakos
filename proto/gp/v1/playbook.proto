// CONTRACT FILE: changes need owner approval.
//
// The playbook envelope. A playbook is typed declarative data, not a script:
// a route of steps, prioritised handlers (rules), a required on_death block
// and a required fallback. It drives one seat's commander for one segment
// (spec section 10).
//
// On disk a playbook is a JSONC file: canonical proto JSON for this package
// plus comments, which the editor round-trips. See
// examples/playbooks/expand_east.jsonc for the worked example this file is
// checked against.
//
// Conventions in this package, all load-bearing:
//
//   * Enums are nested inside the message that owns them. Canonical proto
//     JSON writes an enum as its value name verbatim, so a player types
//     "author_kind": "HUMAN", not "AUTHOR_KIND_HUMAN". Bare value names are
//     only unique if each enum has its own scope, hence the nesting. The
//     buf lint exceptions this needs are recorded in proto/buf.yaml.
//   * Zero values keep a full prefix (AUTHOR_KIND_UNSPECIFIED). They are
//     sentinels; an unset enum is a verifier error (E000x), never a default.
//     ONE MESSAGE IS EXCEPTED, BY NAME: BeaconFilter. Both of its enums are
//     FILTER TERMS rather than settings — the message's whole job is to say
//     which beacons a selector ranks, and the editor's bare selector ("the
//     nearest beacon") filters on nothing at all. So an unset
//     BeaconFilter.mandate means "any writ" and an unset BeaconFilter.side
//     reads as OWN, which is the sense of a bare selector and the only side a
//     playbook can rank without the knowledge store. The alternative is
//     making a player write {"nearest":{"filter":{"side":"OWN"}}} for the
//     commonest construct in the vocabulary, in a file format they hand-edit.
//     Recorded here rather than only at the message, because the verifier
//     (T6) implements this list and needs one rule per enum, not two
//     readings. No other message in gp.v1 may join this exception without an
//     owner decision: it is the difference between "unset is a default" and
//     "unset is an error", and the rest of the schema is the second.
//     ONE CASE IS OPEN rather than excepted: MineSettings.seam_choice, where
//     section 10's worked example omits the field, so neither reading can be
//     asserted here without either failing that example or inventing a
//     default. The PLACEHOLDER at that message names the owner and the stage.
//   * Every duration is game milliseconds, never ticks. The sim runs at
//     20 Hz and takes decisions every 250 ms of game time, but no number in a
//     playbook is expressed in ticks (spec section 10, "Execution").
//   * Durations are int32, not int64, and that is a JSON decision rather than
//     a range one. The proto3 JSON mapping EMITS a 64-bit integer as a QUOTED
//     STRING ("timeout_ms": "120000") while accepting both forms; the spec's
//     worked example — which examples/playbooks/expand_east.jsonc copies
//     verbatim and which this schema is checked against — writes bare numbers
//     ("timeout_ms":120000). A stock encoder could not reproduce that file
//     byte for byte, and spec section 13 requires an exact byte round-trip
//     through plan-core's canonical form. int32 emits a bare number, so the
//     schema, the mapping and the golden file agree without anyone having to
//     deviate from the mapping. Range is not the constraint: 2^31 ms is about
//     24.8 days, against an 8-minute maximum segment.
//     SETTLED: docs/design/decisions-log.md section 2.7 item 46 ratifies
//     int32, and crates/proto's no_duration_field_in_gp_v1_is_int64 test walks
//     the descriptor set and fails if anyone widens one. The other way out —
//     a canonical writer that deviates from the proto3 mapping for int64 —
//     was rejected there, not here. examples/README.md open point 1 records
//     the same.
//   * proto3 has no required fields. "Required" below means the verifier
//     rejects the playbook without it (E01xx, limits and required blocks) —
//     nothing is ever silently defaulted, and nothing is silently stripped.
//   * Reserved field numbers are a promise, not a hint. Each reservation
//     names the version it returns in.

syntax = "proto3";

package gp.v1;

// =============================================================================
// Envelope
// =============================================================================

// The whole file. One playbook, one segment, one seat.
message Playbook {
  // Required. Rejected if unsupported (E000x).
  SchemaVersion schema_version = 1;

  // Required.
  Meta meta = 2;

  // Required. The route and the handlers.
  Declarative declarative = 3;

  // Required block (spec section 4: "Playbooks must include an on_death
  // block").
  OnDeath on_death = 4;

  // Required block. The guaranteed tail.
  Fallback fallback = 5;

  // RESERVED — player Dispatches. Cut from v1: chatter is engine-authored and
  // one-way, so a playbook never carries player text. Returns in v1.2 with
  // the live conduit (spec section 18).
  reserved 6;
  reserved "dispatch";

  // The `kind` half of the envelope's kind/version tag; schema_version above
  // is the version half. Item 47 reserved this number at the bootstrap and
  // deferred the enum to the walking skeleton; decisions-log item 76 settles
  // it. The verifier rejects KIND_UNSPECIFIED with a code and a JSON Pointer:
  // an unset tag is an error, never a default (E000x).
  Kind kind = 7;

  // What this file is. A fourth kind arrives as an additive value, which is
  // why the enum exists at all rather than a bool.
  enum Kind {
    KIND_UNSPECIFIED = 0;

    // A playbook a seat seals for a segment. What submit_plan takes.
    PLAYBOOK = 1;

    // A parameterised starting point the editor's wizard instantiates
    // (spec section 13). Not submittable as written: instantiate_template
    // produces a PLAYBOOK from it.
    TEMPLATE = 2;

    // A worked example in the local sample library, shipped to be read and
    // copied (spec section 13). Not submittable as written.
    SAMPLE = 3;
  }
}

// Minor versions add optional fields. A major version comes with a converter
// that is kept forever. Submitted playbooks with unknown fields are rejected.
message SchemaVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

message Meta {
  // Free text, shown in the editor and the recap.
  string title = 1;

  // Who wrote this file.
  AuthorKind author_kind = 2;

  // The plan fingerprint: one of the reserved seams (spec section 15, "Seams
  // kept for later"). Content hash of the canonicalised playbook, recorded by
  // the verifier alongside the rules hash and the report hash (section 11,
  // "Its hashes are recorded").
  //
  // Settled by decisions-log item 77: the fingerprint is
  // `xxh3-64( PLAN_FINGERPRINT_DOMAIN || canonical_json_bytes )`,
  // seeded with item 48's STATE_HASH_SEED = 0x5048_4152_4D4B_4F53, where
  // canonical_json_bytes is exactly what this package's canonical proto-JSON
  // encoder writes for this playbook with `fingerprint` itself cleared, and
  // PLAN_FINGERPRINT_DOMAIN is the domain separator b"gp.v1/fingerprint/1"
  // (crates/proto, `fingerprint` module). The project has exactly one hash
  // function, as AGENTS.md section 5 asks.
  //
  // Eight bytes, BIG-ENDIAN, so the base64 the JSON mapping emits for a
  // `bytes` field reads and sorts in digest order. It identifies a plan; it
  // does not authenticate one — xxh3 is not cryptographic, and a v1.1
  // tamper-evidence field would be a second, explicitly different field.
  //
  // Written by the verifier, not by the author: the editor round-trips
  // whatever is in the file and the verifier overwrites it. A file whose
  // fingerprint does not match its bytes is a diagnostic, never a silent fix.
  bytes fingerprint = 3;

  // Free text for the author. Round-tripped, never interpreted.
  string note = 4;

  // RESERVED — team_id, for teams and more than 3 seats. Roadmap, no version
  // fixed (spec section 18, unordered list).
  reserved 5;
  reserved "team_id";

  // What a TEMPLATE lets its wizard fill in, in the order the wizard asks
  // (spec section 13: "Each is a parameter wizard pre-filled with the
  // built-in operator's suggestion and a 'why' note"). Decisions-log item
  // 111, decision C1: a template declares its parameters in the file itself,
  // because the library is data a player can copy, and S6's "Save as
  // template" makes templates no operator has code for.
  //
  // Meaningful only when kind = TEMPLATE. instantiate_template removes the
  // list as it sets kind to PLAYBOOK, so no playbook's fingerprint moves. On a
  // hand-written PLAYBOOK it is round-tripped and never read, exactly as
  // `note` is; nothing is stripped. PLACEHOLDER: whether the verifier should
  // refuse it on a PLAYBOOK with a code of its own rather than round-trip it
  // is OWNER's, at S6 (a refusal is a new diagnostic catalogue code).
  //
  // Number 6, and not "the next free one" by accident: 5 stays held for
  // team_id above.
  repeated TemplateParameter parameters = 6;

  enum AuthorKind {
    AUTHOR_KIND_UNSPECIFIED = 0;

    // A human, through the editor or by hand.
    HUMAN = 1;

    // The built-in operator, including the safe playbook it files on a
    // timeout (spec section 14).
    BUILTIN = 2;

    // RESERVED VALUE, not implemented in v1. An external script that emits
    // the same canonical gp.v1 JSON the editor emits and goes through the
    // same verifier. Arrives in v1.1 with the scripting API (spec section
    // 18). The verifier rejects SCRIPT in v1.
    SCRIPT = 3;
  }
}

// One parameter a TEMPLATE declares (Meta.parameters).
//
// Untyped until S6, on purpose: the value a wizard fills in is the JSON at
// `pointer`, written as it would be written in the file (a duration is game
// milliseconds), and the verifier refuses what does not fit, so the
// declaration does not have to carry the type. PLACEHOLDER: the typed
// parameter catalogue — a parameter's type, unit, range and choices — is
// OWNER's, at S6, with the editor and the library, and takes numbers 3 to 15.
message TemplateParameter {
  // An RFC 6901 JSON Pointer into this file: where the value goes. The
  // wizard's edit is an RFC 6902 `replace` at this pointer, the same
  // mechanism as every other editor edit (spec section 13, "Edits are JSON
  // Patches"), so it must resolve in the template as written.
  string pointer = 1;

  // What the wizard calls it, in the author's words. English, like every
  // other string a template carries.
  string label = 2;

  // RESERVED — the typed catalogue (S6): type, unit, range, choices.
  reserved 3 to 15;
}

// The body of the playbook. "Declarative" is the v1 vocabulary: route steps
// with guards, handlers, selectors, on_death, fallback and options — exactly
// what the editor renders (spec section 10).
message Declarative {
  // Ordered. The commander walks it from the top.
  repeated Step route = 1;

  // Prioritised rules. On each decision the first enabled handler whose
  // condition is true starts its body; at most one body runs at a time and no
  // handler pre-empts another.
  repeated Handler handlers = 2;

  // Per-playbook switches.
  Options options = 3;
}

// PLACEHOLDER STUB. "Options" is named as part of the v1 vocabulary but the
// spec does not enumerate its fields. The one option the spec does pin down
// by name is "allow dormant beacons" (spec section 7: adding draw beyond
// supply is an error unless it is set).
message Options {
  // When false, a playbook that adds draw beyond supply is an error (E0601).
  // When true it is allowed, and the shortfall is a warning (W06xx).
  bool allow_dormant_beacons = 1;

  // There is deliberately no reflex_hp_pct. The self-preservation reflex
  // fires at commander HP <= 20%, fixed and not disableable (spec section
  // 10). Author-tuned bravery is an ordinary flee handler, not a setting.
  reserved 2;
  reserved "reflex_hp_pct";
}

// =============================================================================
// Steps
// =============================================================================

// One route step, or one step of a handler body. Every step supports the same
// guards.
message Step {
  // Author's name for this step. Jump targets refer to it, and it is what the
  // editor and the plain-language rendering show.
  string label = 1;

  // Free text. Round-tripped, never interpreted.
  string note = 2;

  // Guard: if true when the step would start, the step is skipped.
  Condition skip_if = 3;

  // Guard: game milliseconds. Required on wait_until, optional elsewhere
  // (spec section 10: "Timeout is required"). A step that times out fails,
  // and on_fail decides what happens next.
  int32 timeout_ms = 4;

  // Guard: what to do when the step fails.
  OnFail on_fail = 5;

  // 6-9 are free for further guards.

  // The step itself. Exactly one, required.
  oneof kind {
    // Completes within the arrive radius. Fails on no path or timeout.
    MoveStep move = 10;

    // Completes when all rows are committed. Fails if the beacon is
    // destroyed, the commander dies, or the commander leaves range. Damage
    // does not interrupt.
    InterfaceStep interface = 11;

    // 12 s deploy, then any initial settings at interface rates. Fails if
    // placement becomes illegal. Choosing the mandate type is free.
    PlaceBeaconStep place_beacon = 12;

    // Completes when the condition is true. timeout_ms is required.
    WaitUntilStep wait_until = 13;

    // Completes when the duration elapses.
    HoldStep hold = 14;

    // Only with a Radio Mast, and only while the commander is in mast
    // coverage.
    BroadcastStep broadcast = 15;
  }

  // RESERVED — held back to v1.1 with the expert editor view. A minor version
  // with no converter (spec section 10, section 18). Out-of-vocabulary
  // constructs are rejected on Load and on submit with a code and a JSON
  // Pointer, never silently stripped.
  reserved 16, 17, 18, 19;
  reserved "set_flag", "clear_flag", "branch", "repeat";

  // RESERVED — roadmap, no version fixed (spec section 18, unordered list).
  //   20 reassign  — reassigning units between beacons
  //   21 logistics — logistics delivery
  //   22 capture   — beacon capture objectives
  reserved 20, 21, 22;
  reserved "reassign", "logistics", "capture";
}

message MoveStep {
  // Fixed point or late-bound selector. Resolves when the step starts, then
  // stays pinned for that step.
  Location to = 1;

  Pace pace = 2;

  enum Pace {
    PACE_UNSPECIFIED = 0;
    DIRECT = 1;
    AVOID_KNOWN_THREATS = 2;
  }
}

// PLACEHOLDER STUB. The interface row catalogue is the on-site change list in
// spec section 5, which carries a duration per row; it is not enumerated
// here. Each row is atomic: one change that commits at the end of its own
// duration, so a multi-field edit is all-or-nothing. Committed rows stay, and
// a resumed visit is a new visit that pays the handshake again.
message InterfaceStep {
  // Which beacon to visit. Fixed id or selector.
  BeaconRef beacon = 1;

  // Applied in order. Each commits on its own.
  repeated InterfaceRow rows = 2;
}

// The on-site change list of spec section 5, complete. Every row the table
// names that an author can write is here; the visit handshake (1.5 s, once
// per visit) is charged by the engine and is not an authored row, and the
// per-row durations are rules-table data (gp.v1.RulesTable), not schema.
//
// Numbers 8 and 9 are free for a further row inside the one-byte tag range.
message InterfaceRow {
  oneof row {
    // Switch mandate type — 8 s. Clears the old mandate's settings and
    // targets; the Quartermaster priority belongs to the beacon and survives.
    MandateSettings set_mandate = 1;

    // Edit mandate settings — 2 s + 0.5 s per extra field, max 6 s. Changes
    // settings or targets within the current mandate.
    MandateSettings set_mandate_settings = 2;

    // Set Quartermaster priority — 1.5 s.
    QuartermasterPriority set_priority = 3;

    // Recycle beacon — 10 s.
    RecycleRow recycle = 4;

    // Add a build target — 2.5 s.
    AddBuildTargetRow add_build_target = 5;

    // Remove a build target — 2.5 s.
    RemoveBuildTargetRow remove_build_target = 6;

    // Queue a licensed capability structure — 5 s, plus the fabricator's
    // construction time, which is not interface time.
    QueueStructureRow queue_structure = 7;
  }

  // Belongs to the beacon, not the mandate: it survives a mandate switch (spec
  // section 6). Nested here, in the row that changes it, because a playbook's
  // initial settings ARE interface rows — InitialSettings.priority refers to
  // this same enum as InterfaceRow.QuartermasterPriority.
  //
  // Nested, not top-level, because proto enum values live in the PARENT scope:
  // a top-level enum here would put the bare names LOW, NORMAL and HIGH into
  // the package scope gp.v1, where seams.proto and every later message also
  // live, and no other enum in the package could ever spell them. That is the
  // collision the file's nesting convention exists to prevent (see the header
  // and proto/buf.yaml's ENUM_VALUE_PREFIX exception). Nesting does not change
  // the JSON spelling: "priority": "NORMAL" is unaffected.
  enum QuartermasterPriority {
    QUARTERMASTER_PRIORITY_UNSPECIFIED = 0;
    LOW = 1;
    NORMAL = 2;
    HIGH = 3;
  }
}

message RecycleRow {}

// Adds one target to the beacon's Build mandate. Adding a target to a beacon
// that is not on Build is a verifier error, not a silent no-op.
message AddBuildTargetRow {
  BuildTarget target = 1;
}

// Removes the Build target anchored here. Named by its anchor rather than by
// an index because a playbook is sealed before the round runs, and an index
// into a list the mandate may have changed is not a stable reference.
message RemoveBuildTargetRow {
  Location anchor = 1;
}

// Queues one licensed capability structure on the beacon's fabricator. The
// licence check is the verifier's (spec section 8).
message QueueStructureRow {
  // PLACEHOLDER STUB: the capability catalogue is spec section 8's contract
  // and its licences land at S4. A string id until then, exactly like
  // seams.proto's builtin ids — it becomes a nested enum when that contract
  // is written.
  string blueprint_id = 1;
}

// One entry in a Build mandate's target list: blueprint, anchor, rotation,
// order (spec section 6, the Build row).
message BuildTarget {
  // PLACEHOLDER STUB: the blueprint catalogue is spec section 8's contract.
  // The skeleton's minimal Build mandate ships one blueprint, the Generator.
  string blueprint_id = 1;

  // Where it goes. Must lie inside one of your own spheres.
  Location anchor = 2;

  // Quarter turns about the vertical axis, 0-3. An integer because the sim is
  // integer-only: there are no free rotations and no angles in a playbook
  // (AGENTS.md section 4.2).
  uint32 rotation_quarter_turns = 3;

  // Build order. The mandate builds the highest-order affordable target that
  // is unbuilt or damaged; lowest number first, ties by list position.
  uint32 order = 4;
}

// An axis-aligned box of voxels, inclusive at both ends. Protected areas,
// avoid areas and Survey probe areas are all of this shape.
//
// PLACEHOLDER STUB: the spec says "areas" without fixing their shape. A box
// is what the editor's drag-select produces and what an integer sim can test
// in three comparisons; a polygon or a sphere would be an owner decision.
message Area {
  Voxel min = 1;
  Voxel max = 2;
}

message PlaceBeaconStep {
  // The site must lie inside one of your own spheres and within the
  // commander's placement range.
  Location at = 1;

  // Author's labels. Selectors may match on them.
  repeated string tags = 2;

  // Applied after the 12 s deploy, at interface rates.
  InitialSettings initial = 3;
}

message InitialSettings {
  InterfaceRow.QuartermasterPriority priority = 1;

  // Choosing the mandate type is free; every other initial setting costs its
  // normal interface time after the deploy.
  MandateSettings mandate = 2;
}

message WaitUntilStep {
  // Required.
  Condition condition = 1;

  // The timeout lives on Step.timeout_ms and is required here (E01xx).
  // Every wait has a timeout: that is half of why every playbook halts.
}

message HoldStep {
  // Game milliseconds.
  int32 ms = 1;
}

// PLACEHOLDER STUB. The message bodies are named in spec section 10 ("Sent:
// mark target, threat at, go-code, rally") but not specified field by field.
// A radio message is untrusted data and is stamped by the engine with its
// sender and its Mast of origin; the author does not write those fields, and
// nothing over the air can reconfigure a beacon.
message BroadcastStep {
  oneof payload {
    MarkTarget mark_target = 1;
    ThreatAt threat_at = 2;
    GoCode go_code = 3;
    Rally rally = 4;
  }
}

message MarkTarget {
  Location at = 1;
}

message ThreatAt {
  Location at = 1;
}

message GoCode {
  // The code an Attack mandate's launch condition waits on, e.g. "A".
  string code = 1;
}

message Rally {
  Location at = 1;
}

// What happens when a step fails: skip it, abort the route, or jump to a
// later step (spec section 10). A jump only ever goes forward: that is the
// other half of why every playbook halts.
message OnFail {
  Action action = 1;

  // Only with JUMP_FORWARD. Must name a Step.label later in the same route.
  string jump_to_label = 2;

  enum Action {
    ON_FAIL_UNSPECIFIED = 0;
    SKIP = 1;
    ABORT_ROUTE = 2;
    JUMP_FORWARD = 3;
  }
}

// =============================================================================
// Handlers (rules)
// =============================================================================

message Handler {
  // Unique within the playbook. Referenced by diagnostics and by the
  // "rule fired" playbook-state predicate.
  string id = 1;

  // Required.
  Condition when = 2;

  // Runs to its end; no handler pre-empts another.
  repeated Step body = 3;

  // What the route does once the body ends.
  Resume resume = 4;

  // Game milliseconds. >= 5000 (spec section 10, "Rule firing").
  int32 cooldown_ms = 5;

  // 1-8 (spec section 10, "Rule firing").
  uint32 max_fires = 6;

  // Only with JUMP_FORWARD. Must name a Step.label later in the route.
  string resume_at_label = 7;

  // Free text. Round-tripped, never interpreted.
  string note = 8;

  enum Resume {
    RESUME_UNSPECIFIED = 0;
    CONTINUE = 1;
    SKIP_STEP = 2;
    JUMP_FORWARD = 3;
    END_ROUTE = 4;
  }
}

// =============================================================================
// Conditions
// =============================================================================

// all / any / not trees over predicates. Depth <= 4, <= 24 nodes, integer
// comparisons only (spec section 10, "Conditions").
//
// Conditions read only the seat's knowledge store. Deliberately absent, and
// deliberately not reserved, because they are never coming: enemy playbooks,
// enemy treasury and mandates, unseen positions, enemy intent, randomness.
//
// Numbers 20-99 are the predicate catalogue range, and the families of spec
// section 10 each own a block of ten so that adding a predicate is additive
// and never renumbers a neighbour:
//
//   20-29 commander        30-39 clock          40-49 own beacon
//   50-59 aggregates       60-69 enemy knowledge
//   70-79 economy          80-89 capability licence and mast coverage
//   90-99 playbook state
//
// The families the walking skeleton's three templates and the v1 interpreter
// need are filled; the rest are RESERVED as whole blocks, each naming the
// stage that fills it. A construct outside the vocabulary is rejected on Load
// with a code and a JSON Pointer and is never silently stripped, so a block
// that is reserved is a block a player cannot half-use.
message Condition {
  oneof node {
    All all = 1;
    Any any = 2;
    Not not = 3;

    // --- commander (20-29) ------------------------------------------------
    CmdrHpPct cmdr_hp_pct = 20;
    CmdrTookDamageWithin cmdr_took_damage_within = 21;
    CmdrDeaths cmdr_deaths = 22;

    // --- clock (30-39) ----------------------------------------------------
    SegmentElapsed segment_elapsed = 30;

    // --- own beacon (40-49) -----------------------------------------------
    BeaconHpPct beacon_hp_pct = 40;
    BeaconUnderAttack beacon_under_attack = 41;
    BeaconPowered beacon_powered = 42;

    // --- economy (70-79) --------------------------------------------------
    Treasury treasury = 70;
    KwHeadroom kw_headroom = 71;

    // --- playbook state (90-99) -------------------------------------------
    StepReached step_reached = 90;
    RuleFired rule_fired = 91;
  }

  // RESERVED — the rest of the commander family: position, and the "own
  // beacon" reports-since predicate's commander twin. S3, with the full
  // predicate catalogue.
  reserved 23 to 29;

  // RESERVED — the rest of the clock family. S3.
  reserved 31 to 39;

  // RESERVED — own beacon: units by role, mandate, structures, reports since.
  // Units by role and structures need S1's fabricator and S2's combat.
  reserved 43 to 49;

  // RESERVED — aggregates. S3.
  reserved 50 to 59;

  // RESERVED — enemy knowledge: units near, beacon known, structure near.
  // Every one of them carries a Freshness, and all of them need S2's combat
  // and S3's knowledge store to mean anything.
  reserved 60 to 69;

  // RESERVED — the rest of the economy family: income forecast, kW supply,
  // kW draw. S1, with the economy.
  reserved 72 to 79;

  // RESERVED — capability licence and structure state (S4, with licences) and
  // mast coverage (S4, with radio).
  reserved 80 to 89;

  // RESERVED — the rest of the playbook-state family: posture. S3.
  reserved 92 to 99;

  // RESERVED — flag predicates, held back to v1.1 with set_flag/clear_flag
  // and the expert editor view (spec section 10, section 18).
  reserved 100, 101;
  reserved "flag_set", "flag_clear";

  // RESERVED — radio predicates: link up, jammed, satellite pass. Roadmap, no
  // version fixed (spec section 18, "Radio warfare").
  reserved 110, 111, 112;
  reserved "link_up", "jammed", "satellite_pass";

  // RESERVED — grid-island predicates. Roadmap, no version fixed (spec
  // section 18, "Conflict and economy": grid islands and batteries).
  reserved 120;
  reserved "grid_island";
}

message All {
  repeated Condition items = 1;
}

message Any {
  repeated Condition items = 1;
}

message Not {
  Condition item = 1;
}

message CmdrHpPct {
  Cmp cmp = 1;

  // Percent, integer. 0-100.
  uint32 pct = 2;

  enum Cmp {
    CMP_UNSPECIFIED = 0;
    LT = 1;
    LE = 2;
    EQ = 3;
    NE = 4;
    GE = 5;
    GT = 6;
  }
}

message CmdrTookDamageWithin {
  // Game milliseconds.
  int32 ms = 1;
}

// One integer comparison, the only kind of comparison a condition may make
// (spec section 10: "integer comparisons only").
//
// CmdrHpPct above carries its own nested Cmp and does not use this message.
// That is deliberate rather than tidy. Spec section 10's worked example — the
// one examples/playbooks/expand_east.jsonc copies verbatim and this schema is
// checked against — writes the predicate as
// {"cmdr_hp_pct":{"cmp":"LE","pct":40}}, so `cmp` and `pct` are fixed spellings
// on a fixed shape; folding CmdrHpPct into IntCompare would rename them to
// `op` and `value` and stop that file loading as written. The two enums spell
// the same six operators and the verifier and the interpreter treat them
// identically; every predicate added from the walking skeleton onward uses
// IntCompare.
message IntCompare {
  Op op = 1;

  // The right-hand side. Always an integer in the predicate's own unit —
  // game milliseconds, whole percent, whole $, whole kW, a count.
  int32 value = 2;

  enum Op {
    OP_UNSPECIFIED = 0;
    LT = 1;
    LE = 2;
    EQ = 3;
    NE = 4;
    GE = 5;
    GT = 6;
  }
}

// How many times the commander has died this match.
message CmdrDeaths {
  IntCompare deaths = 1;
}

// How far into the current segment the Push has run, in game milliseconds.
// The segment's length is part of the frozen snapshot, so "at 4:00" and "with
// a minute left" are both expressible without a constant in the file.
message SegmentElapsed {
  IntCompare ms = 1;
}

// A beacon's own HP as a whole percentage of its maximum.
message BeaconHpPct {
  BeaconRef beacon = 1;
  IntCompare pct = 2;
}

// Whether a beacon has taken damage within a window of game milliseconds.
message BeaconUnderAttack {
  BeaconRef beacon = 1;

  // Game milliseconds. The predicate is true while the beacon has taken
  // damage at any point inside this window.
  int32 within_ms = 2;
}

// Whether a beacon is powered or dormant (spec section 7). An unpowered
// beacon powers down everything homed to it, which is what the safe playbook
// is watching for.
message BeaconPowered {
  BeaconRef beacon = 1;

  // True tests powered, false tests dormant. Both senses are needed and a
  // `not` wrapper would cost a node against the 24-node budget.
  bool powered = 2;
}

// The seat treasury in whole $.
message Treasury {
  IntCompare dollars = 1;
}

// Supply minus draw, in whole kW. Negative means the grid is short and the
// brownout order is running.
message KwHeadroom {
  IntCompare kw = 1;
}

// Whether the route has reached a step, by label. True from the moment the
// step starts and stays true for the rest of the segment.
message StepReached {
  // Must name a Step.label in this playbook's route.
  string label = 1;
}

// Whether a handler has fired. True from its first firing onward.
message RuleFired {
  // Must name a Handler.id in this playbook.
  string handler_id = 1;
}

// Every enemy predicate must declare its freshness. Attack target selectors
// do not: they take their freshness from the seat's reach memory N instead,
// so there is one reach window and one verifier check (spec section 10,
// "Knowledge").
message Freshness {
  Kind kind = 1;

  // Game milliseconds. Only with KNOWN_WITHIN.
  int32 known_within_ms = 2;

  enum Kind {
    FRESHNESS_UNSPECIFIED = 0;
    VISIBLE_NOW = 1;
    KNOWN_WITHIN = 2;
  }
}

// =============================================================================
// on_death and fallback
// =============================================================================

// Required block. The commander respawns at the core after a delay that grows
// with each death; if the core is gone, at the surviving beacon nearest to
// where it died (spec section 4).
message OnDeath {
  OnRespawn on_respawn = 1;

  // After this many deaths the playbook stops and the fallback takes over.
  uint32 max_deaths_before_fallback = 2;

  enum OnRespawn {
    ON_RESPAWN_UNSPECIFIED = 0;

    // Resume the route at the step the commander was on.
    CONTINUE = 1;

    // RESERVED — the rest of the on_respawn vocabulary. The spec names only
    // CONTINUE; anything else is an owner decision, not an invention here.
    reserved 2 to 9;
  }
}

// Required block. The guaranteed tail: what the commander does once the route
// is finished, aborted, or out of deaths. One of three postures (spec section
// 10, "A guaranteed tail").
message Fallback {
  oneof posture {
    FallbackHold hold = 1;
    FallbackShadow shadow = 2;
    FallbackPatrol patrol = 3;
  }
}

message FallbackHold {
  Location at = 1;
}

message FallbackShadow {
  // Stay with this beacon.
  BeaconRef beacon = 1;
}

message FallbackPatrol {
  // PLACEHOLDER STUB: the patrol route shape is not specified. A list of
  // locations is the obvious reading of "patrol" and is what the editor's map
  // route would produce.
  repeated Location waypoints = 1;
}

// =============================================================================
// Locations, selectors and references
// =============================================================================

// A place, fixed or late-bound. Selectors resolve when the step starts, then
// stay pinned for that step (spec section 10, "Late-bound selectors").
//
// The four selector forms — nearest, weakest, safest, most threatened (spec
// section 13, "Selectors stay": alt-click turns a fixed target into one of
// them) — live on BeaconRef, and a Location reaches them through
// beacon_anchor. There is one selector catalogue rather than two: a selector
// picks a beacon, and a place derived from a beacon is that beacon's anchor.
// `safest` keeps a Location form of its own because the fixed reflex names it
// directly and the editor renders it as a place, not as a beacon.
//
// Numbers 4-9 are free for a further fixed form; 10-49 stay held for a
// non-beacon selector catalogue (an area, a seam, a vent) if S3 needs one.
message Location {
  oneof place {
    Voxel voxel = 1;
    BeaconRef beacon_anchor = 2;

    // "the safest own beacon" — the same target the fixed 20% reflex walks
    // to. Shorthand for beacon_anchor { safest {} }.
    Safest safest = 3;
  }

  // RESERVED — the non-beacon selector range, held so a later form cannot
  // land on a number a hand-written file already used.
  reserved 10 to 49;
}

// Integer voxel coordinates. Not a position: sim positions are Q16.16 and
// squared distances Q32.32, but a playbook names voxels, which are whole
// numbers (spec section 15, "Maths").
message Voxel {
  int32 x = 1;
  int32 y = 2;
  int32 z = 3;
}

// A beacon, fixed or late-bound. The selector catalogue: the spec's worked
// examples are "my weakest Defend beacon" and "the nearest known enemy beacon
// within the reach window", and the editor's alt-click offers nearest,
// weakest, safest and most threatened (spec section 13).
//
// A selector resolves at step start over the beacons that pass its filter and
// stays pinned for that step. Resolving to nothing is a step failure, so
// on_fail decides what happens next — it is never a silent skip.
message BeaconRef {
  oneof ref {
    // A beacon id from the seat's frozen snapshot. Bindings are per-match: a
    // saved playbook is bound to seat, round, beacon ids and voxels, so
    // cross-match reuse needs a rebind step (roadmap, v1.1).
    string beacon_id = 1;

    // Safest first. Own beacons only; the one the fixed 20% reflex walks to.
    Safest safest = 2;

    // Least travel from the commander first.
    Nearest nearest = 10;

    // Lowest HP first (the beacon's own HP, not the structures homed to it).
    Weakest weakest = 11;

    // Most incoming threat first.
    MostThreatened most_threatened = 12;
  }

  // RESERVED — the rest of the selector catalogue, if S3 finds the four the
  // editor offers are not enough.
  reserved 13 to 49;
}

// "the safest own beacon". Takes no filter: it is a place as much as a
// selector, and the reflex's target has to mean one thing everywhere.
message Safest {}

// "the nearest beacon that ...".
message Nearest {
  BeaconFilter filter = 1;
}

// "my weakest Defend beacon" and its kind.
message Weakest {
  BeaconFilter filter = 1;
}

// "the most threatened beacon that ...".
message MostThreatened {
  BeaconFilter filter = 1;
}

// Which beacons a selector ranks. An empty filter means every own beacon: OWN
// is the sense of a bare selector in the editor, and an unset `side` reads as
// OWN rather than as an error, because a selector with no side is the common
// case and a playbook sees another seat's beacons only through its own
// knowledge store anyway.
message BeaconFilter {
  Side side = 1;

  // Optional. Only beacons on this writ.
  MandateKind mandate = 2;

  // Optional. Only beacons carrying every one of these author labels
  // (PlaceBeaconStep.tags). An enemy beacon carries none of your tags, so a
  // tag filter and ENEMY_KNOWN together select nothing — a verifier warning,
  // not an error.
  repeated string tags = 3;

  enum Side {
    // Reads as OWN. Kept as the zero value because proto3 has no presence on
    // an enum and OWN is what a bare selector means. This message is the one
    // named exception to "an unset enum is a verifier error" — the header at
    // the top of this file carries the exception and the reason, so the
    // verifier has a single list to implement.
    SIDE_UNSPECIFIED = 0;
    OWN = 1;

    // Enemy beacons the seat knows about. Freshness comes from the seat's
    // reach memory N, not from a per-selector window: one reach window, one
    // verifier check (spec section 10, "Knowledge").
    ENEMY_KNOWN = 2;
  }

  // The five writs (spec section 6). Nested, like every enum in this package,
  // so the bare names BUILD, DEFEND, ATTACK, SURVEY and MINE do not occupy
  // the gp.v1 scope.
  enum MandateKind {
    MANDATE_KIND_UNSPECIFIED = 0;
    BUILD = 1;
    DEFEND = 2;
    ATTACK = 3;
    SURVEY = 4;
    MINE = 5;
  }
}

// QuartermasterPriority used to live here, at package scope. It is nested in
// InterfaceRow now — every enum in gp.v1 is nested inside the message that owns
// it, without exception, because proto enum values live in the parent scope.

// =============================================================================
// Mandate settings
// =============================================================================

// PLACEHOLDER STUB, AND NOT THIS FILE'S CONTRACT. The five mandates and their
// settings are spec section 6; this message exists only so the envelope and
// the worked example type-check. It should move to gp/v1/mandate.proto when
// the section 6 contract is written, which is a separate owner-approved
// change.
//
// Only the fields the spec's expand_east example uses are filled in. The
// mandate oneof numbers (10-14) and the five names are safe: they are the
// five writs (Build, Defend, Attack, Mine, Survey) and they do not change.
//
// There are no per-mandate budget or override fields. Targets and areas count
// toward the one playbook size budget.
message MandateSettings {
  // --- Common settings (spec section 6, the Common row) --------------------

  // Rules of engagement. Shared across mandates that field units.
  Roe roe = 1;

  // A unit below this percentage of its HP retreats, following the rules of
  // engagement, and the retreat is always announced. Integer percent, 0-100.
  uint32 retreat_hp_pct = 2;

  // RESERVED — the rest of the Common row. `report_kinds` is which beacon
  // reports reach the seat, which needs the report catalogue (S2, with combat
  // events); `accept_broadcasts` needs radio, which needs a Radio Mast and
  // arrives at S4. Both are named in spec section 6 and neither is invented
  // here.
  reserved 3, 4;
  reserved "report_kinds", "accept_broadcasts";

  // Which writ. Choosing the type is free at place_beacon time; switching it
  // later clears the old settings and targets.
  oneof mandate {
    BuildSettings build = 10;
    DefendSettings defend = 11;
    AttackSettings attack = 12;
    SurveySettings survey = 13;
    MineSettings mine = 14;
  }

  enum Roe {
    ROE_UNSPECIFIED = 0;
    HOLD_FIRE = 1;
    RETURN_FIRE = 2;
    FREE_FIRE = 3;
  }
}

// Spec section 6, the Build row. The skeleton's minimal Build mandate reads
// `targets` and nothing else; the remaining fields are defined here because
// the section-6 table names them, and they stay inert until S1 fills them in.
message BuildSettings {
  // Build the highest-order affordable target that is unbuilt or damaged.
  repeated BuildTarget targets = 1;

  // Repair a structure of yours inside this beacon's sphere once it falls
  // below this percentage of its HP. Integer percent, 0-100; 0 means never.
  uint32 repair_threshold_pct = 2;

  // Rebuild a destroyed target from the list. A destroyed CAPABILITY
  // structure is never rebuilt automatically whatever this says (section 8).
  bool rebuild_destroyed = 3;

  // Whether the mandate may reshape terrain to place a target.
  Terraform terraform = 4;

  // Ground the mandate will not dig, fill or build on.
  repeated Area protected_areas = 5;

  // RESERVED — the repair and reclaim drone fields of section 6's Build row.
  // Drone fields are the unit-mix half of the mandate and arrive with the
  // full Build mandate at S1.
  reserved 6, 7;
  reserved "repair_drones", "reclaim_drones";

  enum Terraform {
    TERRAFORM_UNSPECIFIED = 0;
    NONE = 1;
    FILL = 2;
    DIG = 3;
    BOTH = 4;
  }
}

// PLACEHOLDER STUB — S2, with destruction and combat. Spec section 6's Defend
// row names: protect list (accepts `my commander`), engagement radius as a
// percentage of the sphere radius, pursue never / sphere edge / while in
// reach, auto-fortify, unit mix, picket. Numbers 1-15 are held so the first
// fifteen fields stay in the one-byte tag range.
message DefendSettings {
  reserved 1 to 15;
}

// PLACEHOLDER STUB — S2, with destruction and combat. Spec section 6's Attack
// row names: target (fixed or selector, including `enemy commander`) and
// retarget rule, staging point, launch condition (force size, segment time or
// a broadcast go-code), retreat conditions, after-action, avoid areas,
// breach_allowed, waves.
message AttackSettings {
  reserved 1 to 15;
}

// Spec section 6, the Survey row. Survey-lite ships at the skeleton, which is
// why this one is filled and Defend and Attack are not.
message SurveySettings {
  // Where to look. Scouts scan unexplored ground inside these first, then
  // re-check the sightings closest to leaving the reach window.
  repeated Area probe_areas = 1;

  // How many scouts the mandate fields.
  uint32 scout_count = 2;

  // RESERVED — probe DIRECTIONS, the other half of section 6's "probe areas
  // or directions". A direction is a heading, headings are the sim's u16
  // angle type, and how a playbook spells one is S3's question with the rest
  // of the selector work. Areas cover the skeleton's templates.
  reserved 3;
  reserved "probe_directions";
}

// Spec section 6, the Mine row, which names all four fields with their values:
// "Seam choice: richest / nearest / safest; max dig depth; pillar spacing;
// flee on threat. Never digs under structures." The skeleton fields a mining
// drone and ships the "Expand & Mine" template, so this one is filled like
// Build and Survey rather than held.
message MineSettings {
  // Voxels. Never digs under structures.
  uint32 dig_max_depth = 1;

  bool flee_on_threat = 2;

  // Which seam of the ones the mandate can reach.
  SeamChoice seam_choice = 3;

  // Voxels between the pillars the mandate leaves standing to hold the roof
  // up.
  uint32 pillar_spacing = 4;

  // PLACEHOLDER — how an OMITTED mine setting reads. Spec section 6 names all
  // four fields and their values but does not say what a mandate does when
  // one is left out, and section 10's worked example leaves two of them out:
  // it writes {"mine":{"dig_max_depth":4,"flee_on_threat":true}}. So this
  // message cannot take the package's "an unset enum is a verifier error"
  // rule without making the spec's own example fail to verify, and it cannot
  // take a default without inventing one. Both readings are the section 6
  // mandate contract's to choose — the same contract that decides whether
  // these messages move to gp/v1/mandate.proto — and they are a pair: an
  // omitted seam_choice and an omitted pillar_spacing get the same treatment
  // or the row is inconsistent. OWNER decides at S1 (economy), which is when
  // mining first has numbers to be wrong about; T6 (verifier) implements
  // whichever it is. Nothing before S1 depends on the answer: the skeleton's
  // "Expand & Mine" template writes the same two fields the spec's example
  // does.

  enum SeamChoice {
    SEAM_CHOICE_UNSPECIFIED = 0;
    RICHEST = 1;
    NEAREST = 2;
    SAFEST = 3;
  }
}
