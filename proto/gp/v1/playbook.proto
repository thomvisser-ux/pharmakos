// CONTRACT FILE: changes need owner approval.
//
// The playbook envelope. A playbook is typed declarative data, not a script:
// a route of steps, prioritised handlers (rules), a required on_death block
// and a required fallback. It drives one seat's commander for one segment
// (spec section 10).
//
// On disk a playbook is a JSONC file: canonical proto JSON for this package
// plus comments, which the editor round-trips. See
// examples/playbooks/expand_east.jsonc for the worked example this file is
// checked against.
//
// Conventions in this package, all load-bearing:
//
//   * Enums are nested inside the message that owns them. Canonical proto
//     JSON writes an enum as its value name verbatim, so a player types
//     "author_kind": "HUMAN", not "AUTHOR_KIND_HUMAN". Bare value names are
//     only unique if each enum has its own scope, hence the nesting. The
//     buf lint exceptions this needs are recorded in proto/buf.yaml.
//   * Zero values keep a full prefix (AUTHOR_KIND_UNSPECIFIED). They are
//     sentinels; an unset enum is a verifier error (E000x), never a default.
//   * Every duration is game milliseconds, never ticks. The sim runs at
//     20 Hz and takes decisions every 250 ms of game time, but no number in a
//     playbook is expressed in ticks (spec section 10, "Execution").
//   * Durations are int32, not int64, and that is a JSON decision rather than
//     a range one. The proto3 JSON mapping EMITS a 64-bit integer as a QUOTED
//     STRING ("timeout_ms": "120000") while accepting both forms; the spec's
//     worked example — which examples/playbooks/expand_east.jsonc copies
//     verbatim and which this schema is checked against — writes bare numbers
//     ("timeout_ms":120000). A stock encoder could not reproduce that file
//     byte for byte, and spec section 13 requires an exact byte round-trip
//     through plan-core's canonical form. int32 emits a bare number, so the
//     schema, the mapping and the golden file agree without anyone having to
//     deviate from the mapping. Range is not the constraint: 2^31 ms is about
//     24.8 days, against an 8-minute maximum segment.
//     OWNER: this resolves examples/README.md's open point 1 in the schema.
//     Ratify it with an entry in docs/design/decisions-log.md section 2.7
//     before the schema is frozen; the other way out — a canonical writer that
//     deviates from the proto3 mapping for int64 — would have to be written
//     down here instead.
//   * proto3 has no required fields. "Required" below means the verifier
//     rejects the playbook without it (E01xx, limits and required blocks) —
//     nothing is ever silently defaulted, and nothing is silently stripped.
//   * Reserved field numbers are a promise, not a hint. Each reservation
//     names the version it returns in.

syntax = "proto3";

package gp.v1;

// =============================================================================
// Envelope
// =============================================================================

// The whole file. One playbook, one segment, one seat.
message Playbook {
  // Required. Rejected if unsupported (E000x).
  SchemaVersion schema_version = 1;

  // Required.
  Meta meta = 2;

  // Required. The route and the handlers.
  Declarative declarative = 3;

  // Required block (spec section 4: "Playbooks must include an on_death
  // block").
  OnDeath on_death = 4;

  // Required block. The guaranteed tail.
  Fallback fallback = 5;

  // RESERVED — player Dispatches. Cut from v1: chatter is engine-authored and
  // one-way, so a playbook never carries player text. Returns in v1.2 with
  // the live conduit (spec section 18).
  reserved 6;
  reserved "dispatch";

  // RESERVED — the `kind` half of the envelope's kind/version tag. Spec
  // section 15 lists "a kind/version tag on playbooks" among the seams kept
  // for later, and section 17 names "the playbook envelope with kind/version"
  // as one of the contracts the walking skeleton builds to full quality.
  // schema_version above is the version half; this number is the kind half,
  // and it is held rather than filled because what the tag has to
  // distinguish — playbook, template, sample, whatever v1.1's published
  // library adds — is settled at the skeleton, and a tag that is guessed now
  // and changed later is a WIRE_JSON break in a file format players hand-edit.
  // Filling it is an owner decision; adding it is additive, which is exactly
  // why the number is reserved now.
  reserved 7;
  reserved "kind";
}

// Minor versions add optional fields. A major version comes with a converter
// that is kept forever. Submitted playbooks with unknown fields are rejected.
message SchemaVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

message Meta {
  // Free text, shown in the editor and the recap.
  string title = 1;

  // Who wrote this file.
  AuthorKind author_kind = 2;

  // The plan fingerprint: one of the reserved seams (spec section 15, "Seams
  // kept for later"). Content hash of the canonicalised playbook, recorded by
  // the verifier alongside the rules hash and the report hash (section 11,
  // "Its hashes are recorded").
  //
  // PLACEHOLDER: the hash function and the canonicalisation it runs over are
  // fixed by the determinism contract, not here. xxh3 is the per-tick state
  // hash; whether the fingerprint reuses it is an owner decision.
  bytes fingerprint = 3;

  // Free text for the author. Round-tripped, never interpreted.
  string note = 4;

  // RESERVED — team_id, for teams and more than 3 seats. Roadmap, no version
  // fixed (spec section 18, unordered list).
  reserved 5;
  reserved "team_id";

  enum AuthorKind {
    AUTHOR_KIND_UNSPECIFIED = 0;

    // A human, through the editor or by hand.
    HUMAN = 1;

    // The built-in operator, including the safe playbook it files on a
    // timeout (spec section 14).
    BUILTIN = 2;

    // RESERVED VALUE, not implemented in v1. An external script that emits
    // the same canonical gp.v1 JSON the editor emits and goes through the
    // same verifier. Arrives in v1.1 with the scripting API (spec section
    // 18). The verifier rejects SCRIPT in v1.
    SCRIPT = 3;
  }
}

// The body of the playbook. "Declarative" is the v1 vocabulary: route steps
// with guards, handlers, selectors, on_death, fallback and options — exactly
// what the editor renders (spec section 10).
message Declarative {
  // Ordered. The commander walks it from the top.
  repeated Step route = 1;

  // Prioritised rules. On each decision the first enabled handler whose
  // condition is true starts its body; at most one body runs at a time and no
  // handler pre-empts another.
  repeated Handler handlers = 2;

  // Per-playbook switches.
  Options options = 3;
}

// PLACEHOLDER STUB. "Options" is named as part of the v1 vocabulary but the
// spec does not enumerate its fields. The one option the spec does pin down
// by name is "allow dormant beacons" (spec section 7: adding draw beyond
// supply is an error unless it is set).
message Options {
  // When false, a playbook that adds draw beyond supply is an error (E0601).
  // When true it is allowed, and the shortfall is a warning (W06xx).
  bool allow_dormant_beacons = 1;

  // There is deliberately no reflex_hp_pct. The self-preservation reflex
  // fires at commander HP <= 20%, fixed and not disableable (spec section
  // 10). Author-tuned bravery is an ordinary flee handler, not a setting.
  reserved 2;
  reserved "reflex_hp_pct";
}

// =============================================================================
// Steps
// =============================================================================

// One route step, or one step of a handler body. Every step supports the same
// guards.
message Step {
  // Author's name for this step. Jump targets refer to it, and it is what the
  // editor and the plain-language rendering show.
  string label = 1;

  // Free text. Round-tripped, never interpreted.
  string note = 2;

  // Guard: if true when the step would start, the step is skipped.
  Condition skip_if = 3;

  // Guard: game milliseconds. Required on wait_until, optional elsewhere
  // (spec section 10: "Timeout is required"). A step that times out fails,
  // and on_fail decides what happens next.
  int32 timeout_ms = 4;

  // Guard: what to do when the step fails.
  OnFail on_fail = 5;

  // 6-9 are free for further guards.

  // The step itself. Exactly one, required.
  oneof kind {
    // Completes within the arrive radius. Fails on no path or timeout.
    MoveStep move = 10;

    // Completes when all rows are committed. Fails if the beacon is
    // destroyed, the commander dies, or the commander leaves range. Damage
    // does not interrupt.
    InterfaceStep interface = 11;

    // 12 s deploy, then any initial settings at interface rates. Fails if
    // placement becomes illegal. Choosing the mandate type is free.
    PlaceBeaconStep place_beacon = 12;

    // Completes when the condition is true. timeout_ms is required.
    WaitUntilStep wait_until = 13;

    // Completes when the duration elapses.
    HoldStep hold = 14;

    // Only with a Radio Mast, and only while the commander is in mast
    // coverage.
    BroadcastStep broadcast = 15;
  }

  // RESERVED — held back to v1.1 with the expert editor view. A minor version
  // with no converter (spec section 10, section 18). Out-of-vocabulary
  // constructs are rejected on Load and on submit with a code and a JSON
  // Pointer, never silently stripped.
  reserved 16, 17, 18, 19;
  reserved "set_flag", "clear_flag", "branch", "repeat";

  // RESERVED — roadmap, no version fixed (spec section 18, unordered list).
  //   20 reassign  — reassigning units between beacons
  //   21 logistics — logistics delivery
  //   22 capture   — beacon capture objectives
  reserved 20, 21, 22;
  reserved "reassign", "logistics", "capture";
}

message MoveStep {
  // Fixed point or late-bound selector. Resolves when the step starts, then
  // stays pinned for that step.
  Location to = 1;

  Pace pace = 2;

  enum Pace {
    PACE_UNSPECIFIED = 0;
    DIRECT = 1;
    AVOID_KNOWN_THREATS = 2;
  }
}

// PLACEHOLDER STUB. The interface row catalogue is the on-site change list in
// spec section 5, which carries a duration per row; it is not enumerated
// here. Each row is atomic: one change that commits at the end of its own
// duration, so a multi-field edit is all-or-nothing. Committed rows stay, and
// a resumed visit is a new visit that pays the handshake again.
message InterfaceStep {
  // Which beacon to visit. Fixed id or selector.
  BeaconRef beacon = 1;

  // Applied in order. Each commits on its own.
  repeated InterfaceRow rows = 2;
}

// PLACEHOLDER STUB: numbers 1-9 hold the rows the spec names directly; the
// rest of the catalogue (spec section 5) lands with the mandate-settings
// contract.
message InterfaceRow {
  oneof row {
    // Switching a beacon's mandate clears the old mandate's settings and
    // targets. The Quartermaster priority belongs to the beacon and survives.
    MandateSettings set_mandate = 1;

    // Changes settings or targets within the current mandate.
    MandateSettings set_mandate_settings = 2;

    // 1.5 s (spec section 5).
    QuartermasterPriority set_priority = 3;

    // Recycle the beacon.
    RecycleRow recycle = 4;
  }

  // Belongs to the beacon, not the mandate: it survives a mandate switch (spec
  // section 6). Nested here, in the row that changes it, because a playbook's
  // initial settings ARE interface rows — InitialSettings.priority refers to
  // this same enum as InterfaceRow.QuartermasterPriority.
  //
  // Nested, not top-level, because proto enum values live in the PARENT scope:
  // a top-level enum here would put the bare names LOW, NORMAL and HIGH into
  // the package scope gp.v1, where seams.proto and every later message also
  // live, and no other enum in the package could ever spell them. That is the
  // collision the file's nesting convention exists to prevent (see the header
  // and proto/buf.yaml's ENUM_VALUE_PREFIX exception). Nesting does not change
  // the JSON spelling: "priority": "NORMAL" is unaffected.
  enum QuartermasterPriority {
    QUARTERMASTER_PRIORITY_UNSPECIFIED = 0;
    LOW = 1;
    NORMAL = 2;
    HIGH = 3;
  }
}

message RecycleRow {}

message PlaceBeaconStep {
  // The site must lie inside one of your own spheres and within the
  // commander's placement range.
  Location at = 1;

  // Author's labels. Selectors may match on them.
  repeated string tags = 2;

  // Applied after the 12 s deploy, at interface rates.
  InitialSettings initial = 3;
}

message InitialSettings {
  InterfaceRow.QuartermasterPriority priority = 1;

  // Choosing the mandate type is free; every other initial setting costs its
  // normal interface time after the deploy.
  MandateSettings mandate = 2;
}

message WaitUntilStep {
  // Required.
  Condition condition = 1;

  // The timeout lives on Step.timeout_ms and is required here (E01xx).
  // Every wait has a timeout: that is half of why every playbook halts.
}

message HoldStep {
  // Game milliseconds.
  int32 ms = 1;
}

// PLACEHOLDER STUB. The message bodies are named in spec section 10 ("Sent:
// mark target, threat at, go-code, rally") but not specified field by field.
// A radio message is untrusted data and is stamped by the engine with its
// sender and its Mast of origin; the author does not write those fields, and
// nothing over the air can reconfigure a beacon.
message BroadcastStep {
  oneof payload {
    MarkTarget mark_target = 1;
    ThreatAt threat_at = 2;
    GoCode go_code = 3;
    Rally rally = 4;
  }
}

message MarkTarget {
  Location at = 1;
}

message ThreatAt {
  Location at = 1;
}

message GoCode {
  // The code an Attack mandate's launch condition waits on, e.g. "A".
  string code = 1;
}

message Rally {
  Location at = 1;
}

// What happens when a step fails: skip it, abort the route, or jump to a
// later step (spec section 10). A jump only ever goes forward: that is the
// other half of why every playbook halts.
message OnFail {
  Action action = 1;

  // Only with JUMP_FORWARD. Must name a Step.label later in the same route.
  string jump_to_label = 2;

  enum Action {
    ON_FAIL_UNSPECIFIED = 0;
    SKIP = 1;
    ABORT_ROUTE = 2;
    JUMP_FORWARD = 3;
  }
}

// =============================================================================
// Handlers (rules)
// =============================================================================

message Handler {
  // Unique within the playbook. Referenced by diagnostics and by the
  // "rule fired" playbook-state predicate.
  string id = 1;

  // Required.
  Condition when = 2;

  // Runs to its end; no handler pre-empts another.
  repeated Step body = 3;

  // What the route does once the body ends.
  Resume resume = 4;

  // Game milliseconds. >= 5000 (spec section 10, "Rule firing").
  int32 cooldown_ms = 5;

  // 1-8 (spec section 10, "Rule firing").
  uint32 max_fires = 6;

  // Only with JUMP_FORWARD. Must name a Step.label later in the route.
  string resume_at_label = 7;

  // Free text. Round-tripped, never interpreted.
  string note = 8;

  enum Resume {
    RESUME_UNSPECIFIED = 0;
    CONTINUE = 1;
    SKIP_STEP = 2;
    JUMP_FORWARD = 3;
    END_ROUTE = 4;
  }
}

// =============================================================================
// Conditions
// =============================================================================

// all / any / not trees over predicates. Depth <= 4, <= 24 nodes, integer
// comparisons only (spec section 10, "Conditions").
//
// Conditions read only the seat's knowledge store. Deliberately absent, and
// deliberately not reserved, because they are never coming: enemy playbooks,
// enemy treasury and mandates, unseen positions, enemy intent, randomness.
//
// PLACEHOLDER STUB. Numbers 20-99 are the predicate catalogue range. Two
// predicates are pinned here because the spec's worked example uses them; the
// rest of the catalogue arrives with the predicate contract, which owns these
// families (spec section 10):
//
//   clock; commander (HP, position, deaths, recent damage); own beacon
//   (status, HP, under attack, units by role, mandate, powered or dormant,
//   structures, reports since); aggregates; enemy knowledge (units near,
//   beacon known, structure near); economy (treasury, income forecast, kW
//   supply, draw and headroom); capability licence and structure state; mast
//   coverage; playbook state (step reached, rule fired, posture).
message Condition {
  oneof node {
    All all = 1;
    Any any = 2;
    Not not = 3;

    // --- commander family -------------------------------------------------
    CmdrHpPct cmdr_hp_pct = 20;
    CmdrTookDamageWithin cmdr_took_damage_within = 21;
  }

  // RESERVED — flag predicates, held back to v1.1 with set_flag/clear_flag
  // and the expert editor view (spec section 10, section 18).
  reserved 100, 101;
  reserved "flag_set", "flag_clear";

  // RESERVED — radio predicates: link up, jammed, satellite pass. Roadmap, no
  // version fixed (spec section 18, "Radio warfare").
  reserved 110, 111, 112;
  reserved "link_up", "jammed", "satellite_pass";

  // RESERVED — grid-island predicates. Roadmap, no version fixed (spec
  // section 18, "Conflict and economy": grid islands and batteries).
  reserved 120;
  reserved "grid_island";
}

message All {
  repeated Condition items = 1;
}

message Any {
  repeated Condition items = 1;
}

message Not {
  Condition item = 1;
}

message CmdrHpPct {
  Cmp cmp = 1;

  // Percent, integer. 0-100.
  uint32 pct = 2;

  enum Cmp {
    CMP_UNSPECIFIED = 0;
    LT = 1;
    LE = 2;
    EQ = 3;
    NE = 4;
    GE = 5;
    GT = 6;
  }
}

message CmdrTookDamageWithin {
  // Game milliseconds.
  int32 ms = 1;
}

// Every enemy predicate must declare its freshness. Attack target selectors
// do not: they take their freshness from the seat's reach memory N instead,
// so there is one reach window and one verifier check (spec section 10,
// "Knowledge").
message Freshness {
  Kind kind = 1;

  // Game milliseconds. Only with KNOWN_WITHIN.
  int32 known_within_ms = 2;

  enum Kind {
    FRESHNESS_UNSPECIFIED = 0;
    VISIBLE_NOW = 1;
    KNOWN_WITHIN = 2;
  }
}

// =============================================================================
// on_death and fallback
// =============================================================================

// Required block. The commander respawns at the core after a delay that grows
// with each death; if the core is gone, at the surviving beacon nearest to
// where it died (spec section 4).
message OnDeath {
  OnRespawn on_respawn = 1;

  // After this many deaths the playbook stops and the fallback takes over.
  uint32 max_deaths_before_fallback = 2;

  enum OnRespawn {
    ON_RESPAWN_UNSPECIFIED = 0;

    // Resume the route at the step the commander was on.
    CONTINUE = 1;

    // RESERVED — the rest of the on_respawn vocabulary. The spec names only
    // CONTINUE; anything else is an owner decision, not an invention here.
    reserved 2 to 9;
  }
}

// Required block. The guaranteed tail: what the commander does once the route
// is finished, aborted, or out of deaths. One of three postures (spec section
// 10, "A guaranteed tail").
message Fallback {
  oneof posture {
    FallbackHold hold = 1;
    FallbackShadow shadow = 2;
    FallbackPatrol patrol = 3;
  }
}

message FallbackHold {
  Location at = 1;
}

message FallbackShadow {
  // Stay with this beacon.
  BeaconRef beacon = 1;
}

message FallbackPatrol {
  // PLACEHOLDER STUB: the patrol route shape is not specified. A list of
  // locations is the obvious reading of "patrol" and is what the editor's map
  // route would produce.
  repeated Location waypoints = 1;
}

// =============================================================================
// Locations, selectors and references
// =============================================================================

// A place, fixed or late-bound. Selectors resolve when the step starts, then
// stay pinned for that step (spec section 10, "Late-bound selectors").
//
// PLACEHOLDER STUB: numbers 1-9 hold the forms the spec's example uses; the
// full selector catalogue ships in v1 (selectors are explicitly NOT deferred
// to the expert view) and lands with the selector contract in 10-49.
message Location {
  oneof place {
    Voxel voxel = 1;
    BeaconRef beacon_anchor = 2;

    // "the safest own beacon" — the same target the fixed 20% reflex walks
    // to. Shorthand for beacon_anchor { safest {} }.
    Safest safest = 3;
  }
}

// Integer voxel coordinates. Not a position: sim positions are Q16.16 and
// squared distances Q32.32, but a playbook names voxels, which are whole
// numbers (spec section 15, "Maths").
message Voxel {
  int32 x = 1;
  int32 y = 2;
  int32 z = 3;
}

// A beacon, fixed or late-bound.
//
// PLACEHOLDER STUB: the spec's worked examples of selectors are "my weakest
// Defend beacon" and "the nearest known enemy beacon within the reach
// window". Only the forms the example file uses are pinned here; 10-49 is the
// selector catalogue range.
message BeaconRef {
  oneof ref {
    // A beacon id from the seat's frozen snapshot. Bindings are per-match: a
    // saved playbook is bound to seat, round, beacon ids and voxels, so
    // cross-match reuse needs a rebind step (roadmap, v1.1).
    string beacon_id = 1;

    Safest safest = 2;
  }
}

message Safest {}

// QuartermasterPriority used to live here, at package scope. It is nested in
// InterfaceRow now — every enum in gp.v1 is nested inside the message that owns
// it, without exception, because proto enum values live in the parent scope.

// =============================================================================
// Mandate settings
// =============================================================================

// PLACEHOLDER STUB, AND NOT THIS FILE'S CONTRACT. The five mandates and their
// settings are spec section 6; this message exists only so the envelope and
// the worked example type-check. It should move to gp/v1/mandate.proto when
// the section 6 contract is written, which is a separate owner-approved
// change.
//
// Only the fields the spec's expand_east example uses are filled in. The
// mandate oneof numbers (10-14) and the five names are safe: they are the
// five writs (Build, Defend, Attack, Mine, Survey) and they do not change.
//
// There are no per-mandate budget or override fields. Targets and areas count
// toward the one playbook size budget.
message MandateSettings {
  // Rules of engagement. Shared across mandates that field units.
  Roe roe = 1;

  // Which writ. Choosing the type is free at place_beacon time; switching it
  // later clears the old settings and targets.
  oneof mandate {
    BuildSettings build = 10;
    DefendSettings defend = 11;
    AttackSettings attack = 12;
    SurveySettings survey = 13;
    MineSettings mine = 14;
  }

  enum Roe {
    ROE_UNSPECIFIED = 0;
    HOLD_FIRE = 1;
    RETURN_FIRE = 2;
    FREE_FIRE = 3;
  }
}

// PLACEHOLDER STUB: targets (blueprint, anchor, rotation, order), repair
// threshold, rebuild destroyed, terraform, protected areas, drone fields.
message BuildSettings {}

// PLACEHOLDER STUB: protect list, engagement radius, pursue, auto-fortify,
// unit mix, picket.
message DefendSettings {}

// PLACEHOLDER STUB: target and retarget rule, staging point, launch
// condition, retreat conditions, after-action, avoid areas, breach_allowed,
// waves.
message AttackSettings {}

// PLACEHOLDER STUB: probe areas or directions, scout count, roe, retreat
// conditions.
message SurveySettings {}

message MineSettings {
  // Voxels. Never digs under structures.
  uint32 dig_max_depth = 1;

  bool flee_on_threat = 2;

  // PLACEHOLDER: seam choice (richest / nearest / safest) and pillar spacing
  // belong here too; they are section 6's to name.
  reserved 3, 4;
  reserved "seam_choice", "pillar_spacing";
}
