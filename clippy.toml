#
# Clippy configuration for the whole workspace.
#
# CONTRACT FILE. This file, the `[workspace.lints]` tables in Cargo.toml, the proto files
# and the determinism code are the four things that need owner approval to change
# (spec §15, Dev harness; AGENTS.md §5). Weakening an entry here weakens a determinism
# guarantee for every crate at once.
#
# Two halves make up the lint policy:
#
#   * `[workspace.lints]` in Cargo.toml sets the LEVELS (deny float_arithmetic,
#     as_conversions, disallowed_types, disallowed_methods, …). That is what a plain
#     `cargo build` obeys.
#   * this file holds the LISTS those lints fire on, and the small number of thresholds.
#     `cargo xtask ci` re-states the levels on the command line so CI is right even if
#     someone edits the manifest.
#
# ---------------------------------------------------------------------------------------
# The wall
# ---------------------------------------------------------------------------------------
# Clippy has no per-path allow-list, so the walled presentation/solve module is a CRATE
# BOUNDARY, enforced by `cargo xtask ci` rather than by this file:
#
#   * `cargo xtask clippy` pass 1 lints the whole workspace MINUS the walled crates with
#     the full deny set;
#   * pass 2 lints the walled crates with `-D warnings` plus `-A clippy::float_arithmetic`,
#     `-A clippy::float_cmp`, `-A clippy::as_conversions`,
#     `-A clippy::cast_possible_truncation`, `-A clippy::cast_precision_loss`,
#     `-A clippy::cast_sign_loss`, `-A clippy::disallowed_types` and
#     `-A clippy::disallowed_methods`. The three `cast_*` allowances are there because
#     converting float vertex data to integers is the reason the wall exists; without them
#     `[workspace.lints.clippy]` would still deny the conversion and pass 2 could not pass;
#   * `cargo xtask wall-guard` then fails the build if sim, plan-core, verifier, operator,
#     gateway or gamectl depends on a walled crate, transitively included — which is
#     what keeps the allowance from leaking into hashed state. That list is
#     `WALL_GUARDED_PACKAGES` in xtask/src/main.rs; it is the research guard's list less
#     the walled `bench` (which is on both), plus `sim`, which cannot join the research
#     guard because `sim` is the crate that defines the `research` feature.
#
# The allow-list of walled crates lives in one place, `WALLED_PACKAGES` in
# xtask/src/main.rs. Today it reads:
#
#     presentation, solve, client-gdext, mesher, bench   (with or without the pharmakos- prefix)
#
# The first two are the spec's own wording — "a walled presentation/solve module"
# (spec §15, Maths). The other three are crates that exist: the thin gdext bridge; the
# greedy mesher, which decisions log §2.7 item 56 decided is its own walled crate — integer
# chunk data in, vertex buffers out, linking without gdext, and depended on by client-gdext
# alone today; and the bench, P1's timing harness (S1's plan, decision 2, approved by
# decisions log §2.7 item 128 (3) (b)) — the walled harness AGENTS.md §4.5 sanctions, which
# reads the clock while it drives the verifier and a hosted match from outside, is never
# shipped, and is also on the research guard. Adding a name to that list widens the float,
# cast, hash-map and clock allowance for a whole crate, so it is a contract change too.
#
# PLACEHOLDER: `presentation` and `solve`, named and not created — owner, if either is proposed.
# `pharmakos-client-gdext`, `pharmakos-mesher` and `pharmakos-bench` of the five exist (the register's M-02).
#
# Inside a walled crate, keep the float surface at the edge: marshal to and from integer
# types as early as possible, and never hand a float back to anything the sim hashes.

# Minimum supported Rust version, so clippy does not suggest newer APIs than we compile on.
# [workspace.package] rust-version carries the same number, and xtask's
# `the_toolchain_is_pinned_once_everywhere` holds the two equal and at or below the
# version rust-toolchain.toml pins.
#
# PLACEHOLDER: the MSRV stays 1.85 below the 1.98.1 pin — owner, S1, in a sweep when no
# lane holds a crate. S1's plan (task con1, S1-01) raises it to 1.98 with the pin, and the
# first contract pull request found it cannot: clippy's lints follow the MSRV, and 1.98
# turns on the let-chain form of `collapsible_if` (let chains are stable from 1.88), the
# constant-chunk-size and manual-implementation lints: 69 `collapsible_if` warnings and a
# dozen others at that pull request's base, across all ten crates, eight of them outside
# that lane's paths (AGENTS.md section 6).
# Raising it is one mechanical pass of `cargo xtask ci --fix` over the whole tree, which
# only a moment with no lane open can take; until then the lints stay at the 1.85 floor
# and the code compiles on the pinned 1.98.1 as before.
msrv = "1.85"

# Nothing here is a published crate, so clippy may suggest API-breaking improvements.
avoid-breaking-exported-api = false

# `unwrap_used` is denied and `expect_used` warns (Cargo.toml). Both are fine in tests,
# where a panic is the failure report.
allow-unwrap-in-tests = true
allow-expect-in-tests = true

# Disallowed macros (clippy::disallowed_macros, denied by cargo xtask ci). Empty on
# purpose: the lint is enabled so that adding an entry here takes effect without touching
# xtask or the manifests. Candidates for later, once there is a logging facade and a
# diagnostics channel: `std::println`, `std::eprintln`, `std::dbg` in library crates.
# (It sits here, above the first [[table]] header, because a bare key written below one
# would be parsed as a field of that table.)
disallowed-macros = []

# Words clippy's doc_markdown lint would otherwise flag as needing backticks.
# ".." keeps clippy's own default list and extends it.
doc-valid-idents = [
    "..",
    "JSONC",
    "GDScript",
    "MagicaVoxel",
    "MessagePack",
    "Protobuf",
    "WebSocket",
    "gdext",
    "xxh3",
    "rkyv",
    "imbl",
]

# ---------------------------------------------------------------------------------------
# Disallowed types (clippy::disallowed_types — denied in [workspace.lints.clippy])
# ---------------------------------------------------------------------------------------
# Every entry here is a determinism hazard, not a style preference.

[[disallowed-types]]
path = "std::collections::HashMap"
reason = "iteration order is unspecified and randomly seeded per process, so it leaks into the per-tick hash. Use BTreeMap, a sorted Vec, or imbl::OrdMap for copy-on-write tables."

[[disallowed-types]]
path = "std::collections::HashSet"
reason = "same as HashMap: unordered iteration. Use BTreeSet, a sorted Vec, or imbl::OrdSet."

[[disallowed-types]]
path = "std::collections::hash_map::RandomState"
reason = "the per-process random seed behind HashMap's order. Nothing deterministic may depend on it."

[[disallowed-types]]
path = "std::collections::hash_map::DefaultHasher"
reason = "SipHash with an unstable, unspecified output across toolchain versions. State hashing is xxh3 over the canonical encoding, seeded from one named constant."

[[disallowed-types]]
path = "std::time::Instant"
reason = "wall-clock time. The sim's clock is the 20 Hz tick counter; time-dependent behaviour is not reproducible from (map seed, playbooks, rules hash). Benchmarks and the presentation layer live behind the wall."

[[disallowed-types]]
path = "std::time::SystemTime"
reason = "wall-clock time, and it can move backwards. Timestamps that must be recorded (save files, diagnostics) are taken at the edge, outside hashed state."

# Primitive float types. `float_arithmetic` and `float_cmp` deny float OPERATIONS; these
# two deny the type itself, so a crate outside the wall cannot hold an `f32` field or put
# one in a signature and pass it around untouched. Verified to resolve and fire on the
# pinned toolchain (clippy 1.98.1). The walled crates are linted in pass 2 with
# `-A clippy::disallowed_types` on the command line, so the mesher's vertex buffers are
# unaffected.

[[disallowed-types]]
path = "f32"
reason = "the sim is integer-only: Q16.16 positions, Q32.32 squared distances, u16 angles, integer HP and $. Floats live behind the wall."

[[disallowed-types]]
path = "f64"
reason = "as above."

# ---------------------------------------------------------------------------------------
# Disallowed methods (clippy::disallowed_methods — denied in [workspace.lints.clippy])
# ---------------------------------------------------------------------------------------

[[disallowed-methods]]
path = "std::time::Instant::now"
reason = "wall-clock read. Use the tick counter; if you are measuring performance, do it behind the wall or in a bench target."

[[disallowed-methods]]
path = "std::time::SystemTime::now"
reason = "wall-clock read, and not monotonic. Not permitted inside anything the state hash covers."

[[disallowed-methods]]
path = "std::fs::read_dir"
reason = "directory order differs between ext4, NTFS and APFS, so a listing that feeds a golden run or a template list is platform-dependent. Collect, sort, then use — and if you do exactly that, allow the lint locally with a comment saying so."

# The four entries once held back here until their paths resolved (the register's M-03),
# each decided by its path in S1's first contract pull request (S1's plan, decision 9,
# ruled by decisions-log item 128). None is added, and each for a reason of its own:
#
# slice `sort_unstable_by`                — a ban on one spelling is the hole the sim's own
#                                           guard was built to close: `crates/sim/tests/
#                                           confinement.rs`'s SORT_SPELLINGS lists nine
#                                           caller-keyed sort and search spellings and refuses
#                                           every one
#                                           in the crate that owns hashed state unless the
#                                           line carries the item-62 marker saying its key
#                                           ends in a unique id. That rule stands everywhere.
# `Iterator::sum`                         — overflow checks are on in every profile, release
#                                           included (spec section 15), and the standard
#                                           library's integer `Sum` carries them, so an
#                                           overflowing sum panics rather than wraps; the ban
#                                           would also fire on counts in the gateway, the
#                                           operator and their tests, where no `$` or kW is
#                                           summed. `$` and kW keep folding with checked
#                                           arithmetic, so an overflow is a result.
# rand::random, rand::thread_rng          — `rand` is not a dependency and not on the
#                                           approved list (AGENTS.md section 3 rule 5), so the
#                                           path cannot resolve; the sim's confinement test
#                                           refuses `thread_rng` by name, and a pull request
#                                           adding `rand` is an owner decision that brings its
#                                           ban with it.
# godot::prelude::Time::get_ticks_msec    — only `pharmakos-client-gdext` reaches the `godot`
#                                           crate, and it is walled: its pass lifts
#                                           `disallowed_methods` on the command line
#                                           (WALL_ALLOW), so the entry could never fire, and
#                                           the pacer's clock there is sanctioned (AGENTS.md
#                                           section 3 rule 4).
