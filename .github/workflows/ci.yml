          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-templates-ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079-linux

      - name: Install the export templates, checked against Godot's SHA-512
        if: steps.scope.outputs.prose_only != 'true' && steps.templates.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tpz="$RUNNER_TEMP/Godot_v4.7.2-stable_export_templates.tpz"
          curl --fail --location --silent --show-error --output "$tpz" \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          (cd "$RUNNER_TEMP" && echo "ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079  Godot_v4.7.2-stable_export_templates.tpz" | sha512sum -c -)
