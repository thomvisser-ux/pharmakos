# SPDX-FileCopyrightText: 2026 Pharmakos contributors
# SPDX-License-Identifier: GPL-3.0-or-later
#
# CONTRACT FILE (AGENTS.md section 5): changes to what CI checks need owner approval.
#
# One command runs on three operating systems — `cargo xtask ci` — and a final job
# byte-compares the per-tick hash chains the three produced. That comparison is gate G4
# in the flesh: "identical hashes on 3 operating systems".
#
# Hash chain path convention (also documented in xtask/src/main.rs):
#
#     target/determinism/hashes.txt
#         one line per tick, in tick order from 0
#         "<tick in decimal>\t<xxh3-64 state hash as 16 lowercase hex digits>"
#         \n endings, trailing newline, no \r anywhere
#
# Each matrix leg uploads that file as the artefact `determinism-hashes-<os>`; the
# `determinism-cross-os` job downloads all three and compares them byte for byte.
#
# PLACEHOLDER: the workspace compiles and `cargo xtask ci` is green, but there is still no
# determinism binary — spike G4 is closed and its findings are written up, and the binary
# itself lands with the walking skeleton's sim. Until it does, the matrix legs pass with
# the `determinism` and `golden` steps reporting "skipped" with a reason, the hash
# artefacts are absent, and the cross-OS job says so instead of failing. The three lines to
# flip when the binary lands are marked "FLIP AT G4": `if-no-files-found`, the
# `continue-on-error` on the download, and the `exit 0` in the compare step.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Incremental compilation buys nothing on a cold CI runner and makes builds less
  # reproducible; determinism work would rather have the cache be the artefact cache.
  CARGO_INCREMENTAL: "0"
  # `cargo xtask ci` skips a step whose external tool is missing. In CI every tool is
  # installed on purpose, so a missing one is a broken runner, not a reason to go green.
  PHARMAKOS_REQUIRE_TOOLS: "1"

jobs:
  ci:
    name: cargo xtask ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # 90, not 45 (decisions-log item 109): windows-latest ran the suite in 41 minutes at T14
    # and ran out of time once T15 added its headless matches. The limit is a hang guard,
    # not a budget. PLACEHOLDER: the suite's own time budget, and which tests pay for it,
    # are T20's to set with xtask's closing half-week (owner).
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # The REUSE licence check is platform-independent, so it runs once, on Linux.
          #
          # `--skip screenshot` on the ubuntu leg is REQUIRED, not an optimisation. The
          # `screenshot` step's preconditions are project → golden → Linux → godot →
          # xvfb-run, and the last two go through `skip_or_fail`, which is a hard failure
          # under PHARMAKOS_REQUIRE_TOOLS. godot and xvfb are installed only in the
          # `screenshot` job below, so the moment T16 commits `godot/project.godot` and
          # the first vista golden, this leg would pass the first three preconditions and
          # then fail on a tool it was never given. The render belongs to that job, which
          # installs what it needs; this leg would also be doing it twice.
          #
          # `--skip stage-client` on the ubuntu and windows legs is REQUIRED for the same
          # reason. `stage-client` builds the gdext cdylib, stages it and then runs
          # `godot --headless --path godot --import`; godot is installed in the `client`
          # job below and nowhere else, so on these two legs the step would reach
          # `skip_or_fail` and fail under PHARMAKOS_REQUIRE_TOOLS. The macOS leg keeps the
          # step and reports the real reason it cannot run: `pharmakos.gdextension`
          # declares windows.x86_64 and linux.x86_64 only (decisions-log item 73), so
          # there is no macOS library for Godot to load. That skip is the one worth
          # reading in the summary, and it is why the step is not skipped there too.
          - os: ubuntu-latest
            xtask_args: "--skip screenshot --skip stage-client"
            reuse: true
          - os: windows-latest
            xtask_args: "--skip reuse --skip stage-client"
            reuse: false
          - os: macos-latest
            xtask_args: "--skip reuse"
            reuse: false
    steps:
      - name: Check out the full history
        uses: actions/checkout@v4
        with:
          # `buf breaking --against .git#branch=main` reads the base branch out of the
          # local object store, so the whole history has to be here.
          fetch-depth: 0

      - name: Make `main` available locally
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git rev-parse --abbrev-ref HEAD)" = "main" ]; then
            echo "already on main; buf breaking compares against the checkout"
          elif git fetch --no-tags --quiet origin +refs/heads/main:refs/heads/main; then
            echo "fetched origin/main for the breaking-change comparison"
          else
            echo "::notice::no main branch on the remote yet — buf breaking will skip"
          fi

      - name: Install the Rust toolchain
        # rust-toolchain.toml pins the channel and the components; this action installs
        # rustup's stable so that pin resolves. PLACEHOLDER: pin these actions to commit
        # SHAs before the repository goes public.
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          # PINNED, for the same reason protoc-gen-prost is pinned below: crates/proto's
          # generated-tree check is a byte-for-byte comparison, and buf's own release
          # changes what `buf generate` emits (1.73.0 produced the committed tree;
          # `latest` on 2026-09-15 produced 470 bytes less and failed all three legs).
          # Keep this in step with the buf the tree was regenerated with; raising it
          # means regenerating the tree in the same commit.
          version: 1.73.0
          github_token: ${{ github.token }}

      - name: Install protoc-gen-prost
        shell: bash
        # crates/proto's `the_checked_in_tree_matches_a_fresh_generation` regenerates
        # src/generated with `buf generate` and diffs it against what is committed, which
        # needs buf's prost plugin as well as buf itself. Without this step the test
        # skipped on every runner and the committed tree — a checked-in artefact of the
        # .proto contract files — could drift from proto/** with CI green; the test now
        # honours PHARMAKOS_REQUIRE_TOOLS and fails instead, so the install is what keeps
        # the leg green honestly.
        #
        # The version is PINNED, not `latest`: the check is a byte-for-byte comparison of
        # generated source, so a new plugin release that changes its output by a line
        # would fail every PR until someone regenerated. 0.5.0 is the version the tree was
        # generated with. Raising it means regenerating the tree in the same commit.
        run: cargo install protoc-gen-prost --version 0.5.0 --locked

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Install reuse
        if: matrix.reuse
        shell: bash
        run: |
          set -euo pipefail
          pipx install reuse
          # pipx puts its shims in ~/.local/bin, which is not on PATH for the steps that
          # follow unless we say so — and PHARMAKOS_REQUIRE_TOOLS turns "not found" into
          # a failure rather than a skip.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: cargo xtask ci
        shell: bash
        run: cargo xtask ci ${{ matrix.xtask_args }}

      - name: Upload this operating system's hash chain
        # `always()` so a failure in a later step still hands the cross-OS job what the
        # determinism step produced.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: determinism-hashes-${{ matrix.os }}
          path: target/determinism/hashes.txt
          # FLIP AT G4: make this `error`, so a leg that produces no hash chain fails
          # here rather than silently reducing the cross-OS comparison to two files.
          if-no-files-found: warn
          retention-days: 14

  dco:
    name: DCO sign-off
    # Pull requests only: the check is "every commit this PR adds carries a
    # Signed-off-by trailer", and on a push to main the range would be empty or the
    # whole history. AGENTS.md section 8 and docs/CONTRIBUTING.md both point here, so
    # this job is what makes "CI checks it" true.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Every commit carries a Signed-off-by trailer
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          # `%(trailers:key=...)` prints nothing when the commit has no such trailer,
          # so an empty value is the failure. Command substitution rather than a pipe:
          # a pipe under `pipefail` would make grep's "no match" exit status abort the
          # loop instead of reporting the commit.
          for sha in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            signoff=$(git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha")
            if [ -z "${signoff//[[:space:]]/}" ]; then
              subject=$(git show -s --format='%s' "$sha")
              echo "::error::no Signed-off-by on ${sha:0:12} — ${subject}"
              missing=$((missing + 1))
            fi
          done

          if [ "$missing" -ne 0 ]; then
            {
              echo "### DCO"
              echo
              echo "${missing} commit(s) in this pull request have no \`Signed-off-by\` trailer."
              echo
              echo "Contributions are accepted under the Developer Certificate of Origin 1.1"
              echo "(docs/DCO.txt). Sign new commits with \`git commit -s\`, and fix a branch"
              echo "that is already written with \`git rebase --signoff <base>\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "every commit in the range is signed off"

  determinism-cross-os:
    name: cross-OS determinism guard
    needs: ci
    # Runs even when a matrix leg failed: an ubuntu-only clippy failure should not hide a
    # hash divergence that the other two legs did produce.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download every hash chain
        # Before spike G4 no leg produces a hash chain, and download-artifact fails
        # the step when its pattern matches nothing ("Unable to find any artifacts").
        # That would go red on the placeholder path, where the compare step below is
        # written to report the skip and exit 0. The compare step handles zero files
        # (`shopt -s nullglob`), so tolerating the empty download is safe.
        # FLIP AT G4: remove `continue-on-error` — after G4 a missing artefact means
        # a leg did not produce its chain, which must not read as a pass.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: determinism-hashes-*
          path: hashes

      - name: Compare the three hash chains byte for byte
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(hashes/*/hashes.txt)
          count=${#files[@]}

          if [ "$count" -lt 3 ]; then
            echo "::notice::${count}/3 hash chains present — the determinism binary arrives with spike G4"
            {
              echo "### Cross-OS determinism"
              echo
              echo "Skipped: ${count}/3 hash chains present (placeholder until spike G4)."
            } >> "$GITHUB_STEP_SUMMARY"
            # FLIP AT G4: `exit 1` here. Three chains are the gate; fewer than three means
            # the guard did not run, which must not read as a pass.
            exit 0
          fi

          reference="${files[0]}"
          status=0
          {
            echo "### Cross-OS determinism"
            echo
            echo "Reference: \`${reference}\` ($(wc -l < "$reference") ticks)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          for file in "${files[@]:1}"; do
            if cmp -s "$reference" "$file"; then
              echo "match: $file"
              echo "- ✅ \`${file}\` matches" >> "$GITHUB_STEP_SUMMARY"
            else
              status=1
              first=$(cmp "$reference" "$file" 2>&1 || true)
              echo "::error::hash chains differ: $reference vs $file ($first)"
              {
                echo "- ❌ \`${file}\` differs — ${first}"
                echo
                echo '```diff'
                # `diff` exits 1 precisely when the files differ, which is the case
                # we are in — without the `|| true` the pipeline fails, `pipefail`
                # and `set -e` abort the script here, and the closing fence plus the
                # whole explanation below never get written. The diagnostic is the
                # entire point of this branch, so it must not be the thing that dies.
                { diff -u "$reference" "$file" || true; } | head -n 20
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          if [ "$status" -ne 0 ]; then
            echo
            echo "The same binary produced different per-tick state hashes on different"
            echo "operating systems. Bisect by tick from the first differing line above;"
            echo "the usual suspects are unordered iteration, an unchecked cast, a"
            echo "non-total sort comparator, or usize/isize reaching hashed state."
            echo "Do not re-baseline the golden chain to make this green."
          fi
          exit "$status"

  screenshot:
    name: vista screenshot (linux)
    # Linux only, and deliberately so. The golden is rendered under xvfb with
    # the lavapipe software rasteriser; comparing a second platform's rasteriser
    # against it would be permanently red and would say nothing about the
    # geometry (skeleton-plan §7 decision 22, recommended and not yet logged —
    # G1 measured 1.14 % of pixels differing between a Quadro and lavapipe on
    # identical geometry). The stronger of the two geometry checks is the
    # client's and the mesher's digests, which need no GPU and run on every leg.
    #
    # This job is the ONLY place the vista is rendered: godot and xvfb are
    # installed here and nowhere else, which is why the ubuntu `ci` leg above
    # passes `--skip screenshot`.
    #
    # FILLED BY T16. The scene is res://scenes/vista_shot.tscn: the committed
    # keyframe fixture (godot/fixtures/view_keyframe.jsonl, a byte-identical copy
    # of the gateway's golden) drawn through the client's live decode entry with
    # NO host running. The install steps run whether or not a golden is
    # committed, because the first golden is rendered HERE (decisions-log item
    # 105 (5)): with no tests/golden/vista/expected.vista.png the bootstrap step
    # below renders the vista anyway and the artefact carries it, to be looked
    # at and committed; with one, `cargo xtask screenshot` renders and compares.
    # T20 promotes the step from skipping to required.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: screenshot-ubuntu

      - name: Install a virtual display and the software rasteriser
        # `godot --headless` CANNOT take a screenshot: it selects the dummy
        # rendering driver, `RenderingServer.frame_post_draw` never fires, and a
        # screenshot coroutine awaiting it parks for ever — silently, producing
        # no PNG and no error (G1 §10.12). The render runs windowed under xvfb
        # with lavapipe instead.
        #
        # Note what is NOT here: `VK_ICD_FILENAMES`. Pointing it at a path that
        # does not exist on this image makes the Vulkan loader find *no* driver,
        # after which Godot silently falls back to OpenGL 3 — a different
        # renderer from the golden's. Let the loader enumerate the installed
        # ICDs.
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary || echo "::notice::vulkaninfo failed; the render step will report what it selected"

      - name: Install Godot 4.7.2
        # The pinned build decisions-log item 73 names, exactly as the `client`
        # job installs it (Linux only here). PHARMAKOS_GODOT is what
        # `cargo xtask stage-client` and `cargo xtask screenshot` run.
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot"
          curl --fail --location --silent --show-error \
            --output "$HOME/godot/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q -o "$HOME/godot/godot.zip" -d "$HOME/godot"
          mv "$HOME/godot/Godot_v4.7.2-stable_linux.x86_64" "$HOME/godot/godot"
          chmod +x "$HOME/godot/godot"
          echo "$HOME/godot" >> "$GITHUB_PATH"
          echo "PHARMAKOS_GODOT=$HOME/godot/godot" >> "$GITHUB_ENV"
          version=$("$HOME/godot/godot" --version | head -n 1)
          echo "godot: ${version}"
          case "${version}" in
            4.7.2.stable*) ;;
            *) echo "::error::expected Godot 4.7.2.stable, got ${version}"; exit 1 ;;
          esac

      - name: Stage the client library
        # The vista is drawn by the bridge, so the extension has to be built,
        # staged into godot/bin and imported before the scene can load it —
        # `cargo xtask screenshot` imports but does not build or stage.
        shell: bash
        run: cargo xtask stage-client

      - name: Render a first vista (no golden committed yet)
        # The bootstrap for decisions-log item 105 (5): the first golden is this
        # leg's render, looked at by a person and committed. `cargo xtask
        # screenshot` skips before rendering when there is no golden to compare
        # with, so this step renders with the same command line it would use and
        # leaves the PNG where the upload below finds it. It runs only while
        # tests/golden/vista/expected.vista.png is absent — the same step is how
        # a deliberate re-render starts: delete the golden, push, download, look.
        if: hashFiles('tests/golden/vista/expected.vista.png') == ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/golden/vista
          xvfb-run -a -s "-screen 0 1280x720x24" "${PHARMAKOS_GODOT}" --path godot \
            --resolution 1280x720 -- --scene=res://scenes/vista_shot.tscn \
            "--shot=$PWD/target/golden/vista/actual.vista.png"
          test -s target/golden/vista/actual.vista.png

      - name: cargo xtask screenshot
        # The step runs `godot --headless --path godot --import` itself before
        # rendering. That pre-step is not optional: a non-editor Godot run loads
        # GDExtensions only from `res://.godot/extension_list.cfg`, which the
        # editor writes when it scans the project and which is git-ignored — so
        # on a fresh checkout the extension's classes instantiate as
        # placeholders and the first call on them fails. G1 lost four runs to
        # this.
        #
        # The comparison's verdict goes out as `::notice::` annotations as well
        # as to the step summary, because GitHub hides job logs and step
        # summaries from logged-out viewers.
        shell: bash
        run: cargo xtask screenshot

      - name: Upload the render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vista-screenshot
          path: target/golden/vista/actual.vista.png
          # Flipped at T16: the vista exists, so a leg that produced no PNG
          # rendered nothing, and that must not read as a pass.
          if-no-files-found: error
          retention-days: 14

  client:
    name: client extension (${{ matrix.os }})
    # T12's acceptance, and the one thing no other leg can check: does the gdext
    # cdylib actually LOAD into Godot, and did the bridge catch a panic doing its
    # work. Everything `cargo xtask stage-client --check` asserts is also asserted
    # by `cargo test` on all three legs above — the geometry comparison between
    # upload paths A and B, the rules marshalling, the schema round trip. What
    # only this job can tell us is whether `PharmakosBridge` is a real class in a
    # real engine rather than a placeholder, which on a fresh checkout is exactly
    # what it is until `--import` has run (spike G1 §10.12; four runs lost).
    #
    # Windows and Linux, because those are the two platforms
    # `godot/pharmakos.gdextension` declares (decisions-log item 73) and the two
    # the client ships on (spec §15). macOS is deliberately absent: there is no
    # macOS library entry for Godot to load, and the `ci` leg above reports that
    # as a named skip rather than pretending the step ran.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            godot_asset: Godot_v4.7.2-stable_linux.x86_64.zip
            godot_binary: Godot_v4.7.2-stable_linux.x86_64
          - os: windows-latest
            godot_asset: Godot_v4.7.2-stable_win64.exe.zip
            godot_binary: Godot_v4.7.2-stable_win64.exe
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: client-${{ matrix.os }}

      - name: Install Godot 4.7.2
        # PINNED to the exact build decisions-log item 73 names — "godot = "=0.5.5"
        # and Godot 4.7.2 exactly, the pair every G1 number was taken on". A bump
        # is determinism-adjacent: it re-runs the geometry golden and goes through
        # a deliberate pull request, so `latest` has no place here.
        #
        # The binary is put on PATH under the name `godot`, because that is what
        # `cargo xtask stage-client` looks for — the same name a developer has
        # locally, so the command is the same one in both places.
        shell: bash
        env:
          GODOT_ASSET: ${{ matrix.godot_asset }}
          GODOT_BINARY: ${{ matrix.godot_binary }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot"
          curl --fail --location --silent --show-error \
            --output "$HOME/godot/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/${GODOT_ASSET}"
          # `unzip` is on the Linux image and is NOT part of Git for Windows; 7-Zip is on
          # the Windows image. Neither is worth an action, and a step that assumed one
          # would fail on exactly one leg, which is the kind of thing that costs a run.
          if command -v unzip >/dev/null 2>&1; then
            unzip -q -o "$HOME/godot/godot.zip" -d "$HOME/godot"
          else
            7z x -y -o"$HOME/godot" "$HOME/godot/godot.zip" > /dev/null
          fi
          # The PATH entry has to be spelled the way a NATIVE process spawn
          # resolves it, not the way this shell does. `$HOME` under Git Bash on
          # the Windows runner is an MSYS POSIX path (`/c/Users/runneradmin`),
          # and writing that to `$GITHUB_PATH` publishes an entry Git Bash can
          # follow and `CreateProcess` cannot — so every later bash step finds
          # `godot` and xtask's `Command::new("godot")` does not. That is what
          # made this leg red on the first run of this job: the version step
          # below printed 4.7.2 and the very next step said godot was not
          # installed. `cygpath -w` converts it to `C:\Users\runneradmin\godot`,
          # which both resolve.
          #
          # PHARMAKOS_GODOT is the belt to that brace: `cargo xtask stage-client`
          # and `cargo xtask screenshot` run the binary it names in place of a
          # bare `godot`, so the step does not depend on how any shell spelled a
          # PATH entry at all.
          #
          # `cygpath -w` for the directory, because a Windows PATH entry is
          # spelled with backslashes; `cygpath -m` for the binary, because that
          # form (`C:/Users/.../godot.exe`) is the one BOTH this shell and a
          # native `CreateProcess` accept, and the guard step below runs it from
          # bash while xtask runs it from Rust.
          if [ "${RUNNER_OS}" = "Windows" ]; then
            mv "$HOME/godot/${GODOT_BINARY}" "$HOME/godot/godot.exe"
            godot_dir="$(cygpath -w "$HOME/godot")"
            godot_exe="$(cygpath -m "$HOME/godot/godot.exe")"
          else
            mv "$HOME/godot/${GODOT_BINARY}" "$HOME/godot/godot"
            chmod +x "$HOME/godot/godot"
            godot_dir="$HOME/godot"
            godot_exe="${godot_dir}/godot"
          fi
          echo "${godot_dir}" >> "$GITHUB_PATH"
          echo "PHARMAKOS_GODOT=${godot_exe}" >> "$GITHUB_ENV"

      - name: Godot reports the pinned version
        # A wrong archive is otherwise found much later, by a failure that reads
        # like a code problem.
        #
        # This step asks the question the NEXT step will ask, in the way it will
        # ask it. Running `godot --version` through bash proves only that bash
        # can resolve the name; the first run of this job passed exactly that
        # check and then failed on a native spawn of the same name. So on
        # Windows `where` is consulted as well — it resolves against the same
        # PATH a native process gets — and the binary PHARMAKOS_GODOT names is
        # run directly, which is what xtask actually invokes.
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" = "Windows" ]; then
            cmd //c where godot
          else
            command -v godot
          fi
          version=$("${PHARMAKOS_GODOT}" --version | head -n 1)
          echo "godot: ${version} (PHARMAKOS_GODOT=${PHARMAKOS_GODOT})"
          case "${version}" in
            4.7.2.stable*) ;;
            *) echo "::error::expected Godot 4.7.2.stable, got ${version}"; exit 1 ;;
          esac

      - name: cargo xtask stage-client --check
        # Build the cdylib, copy it into godot/bin, byte-scan the staged library
        # for `gdext_rust_init`, run `godot --headless --path godot --import`, and
        # then run the headless client check — which exits non-zero if the bridge
        # caught a panic at a `#[func]` boundary or if the two upload paths left
        # different geometry resident.
        #
        # PHARMAKOS_REQUIRE_TOOLS is set for the whole workflow, so a runner that
        # somehow lost its Godot fails here rather than skipping quietly.
        shell: bash
        run: cargo xtask stage-client --check

      - name: Build gamectl for the headless watch run
        # The watch run below spawns `gamectl host` as the lobby does (decisions-log
        # item 107 (2), confirmed as item 108 (2)). A debug build, like the staged
        # client, so a panic in the host is a panic rather than an abort.
        shell: bash
        run: cargo build --package pharmakos-gamectl --bin gamectl

      - name: Headless watch run against a real gamectl host
        # T16's live acceptance (docs/design/skeleton-plan-t16a-notes.md section A (4)):
        # the lobby's host link spawns `gamectl host` with OS.execute_with_pipe, reads
        # its announce line, opens the admin and seat connections, idles 35 s in the
        # Lull (longer than the gateway's 30 s READ_TIMEOUT, so a missing keep-alive
        # drops a connection), ends the Lull, plays the segment at 4x until `_status`
        # reaches RECAP, and asserts no caught panic, no dropped connection and no
        # refused call. It then closes the host's standard input and waits for the
        # child to exit. The scene's exit code is the verdict.
        #
        # This step is also where OS.execute_with_pipe is confirmed on Linux: the
        # owner measured it on Windows only (item 108 (2)).
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" = "Windows" ]; then
            gamectl="$(cygpath -m "$PWD/target/debug/gamectl.exe")"
            root="$(cygpath -m "$PWD")"
          else
            gamectl="$PWD/target/debug/gamectl"
            root="$PWD"
          fi
          set +e
          "${PHARMAKOS_GODOT}" --headless --path godot res://scenes/watch_check.tscn -- \
            "--gamectl=${gamectl}" "--root=${root}" > watch_check.log 2>&1
          status=$?
          set -e
          cat watch_check.log
          if [ "${status}" -ne 0 ]; then
            echo "::error::the headless watch run failed (exit ${status}); its report is above"
            exit "${status}"
          fi
          grep -q '^\[watch-check\] OK' watch_check.log

      - name: No gamectl is left once the client has exited
        # "The child exits when the client does" (item 108 (2)): the watch run has
        # exited, so no host may still be running on this runner.
        shell: bash
        run: |
          set -euo pipefail
          sleep 2
          if [ "${RUNNER_OS}" = "Windows" ]; then
            if tasklist //FI "IMAGENAME eq gamectl.exe" | grep -qi gamectl; then
              echo "::error::a gamectl process outlived the client"; tasklist //FI "IMAGENAME eq gamectl.exe"; exit 1
            fi
          else
            if pgrep -x gamectl > /dev/null; then
              echo "::error::a gamectl process outlived the client"; pgrep -a gamectl; exit 1
            fi
          fi
          echo "no gamectl process is running"
