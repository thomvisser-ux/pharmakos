          name: package-diagnostics-linux
          path: |
            target/package/logs/
            target/golden/package/actual.linux.txt
          if-no-files-found: warn
          retention-days: 14

  clean-launch-windows:
    name: clean launch (windows-latest)
    needs: package-windows
    # No job-level `if:` (this file's header): it runs whenever the package job succeeded,
    # and on a prose-only pull request it prints the notice and skips every other step.
    runs-on: windows-latest
    # A hang guard, not a budget.
    timeout-minutes: 15
    steps:
      - name: Only prose changed, so there is no zip to launch
        if: needs.package-windows.outputs.prose_only == 'true'
        shell: bash
        run: echo "::notice title=docs-only fast path::Only prose changed, so the package job built no zip and this job launched nothing. It runs in full on main's push (decisions-log item 115 (4))."

      - name: Download the zip
        if: needs.package-windows.outputs.prose_only != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pharmakos-windows
          path: download

      - name: Extract it with Windows' own tool
        if: needs.package-windows.outputs.prose_only != 'true'
        shell: pwsh
        run: Expand-Archive -Path download/pharmakos-windows-x86_64.zip -DestinationPath .

      - name: gamectl seat doctor passes inside the extracted folder (acceptance (b))
        if: needs.package-windows.outputs.prose_only != 'true'
        shell: bash
        run: |
          set -uo pipefail
          (cd Pharmakos && ./gamectl.exe seat doctor) > doctor.log 2>&1
          status=$?
          if grep -Eq '(^|[^0-9a-f])[0-9a-f]{64}([^0-9a-f]|$)' doctor.log; then
            echo "doctor.log holds a 64-hex run and is not printed; the last step names its lines"
          else
            cat doctor.log
          fi
          exit "${status}"

      - name: The shipped smoke check reaches the lobby, run from the parent folder (acceptance (a))
        # From a bash step: Windows PowerShell 5.1 does not wait for a GUI executable. Run by
        # path from the parent folder, so the root can only come from the executable's
        # folder, and with no `--import`: an export cannot import, and its extension list is
        # the package job's.
        if: needs.package-windows.outputs.prose_only != 'true'
        shell: bash
        run: |
          set -uo pipefail
          ./Pharmakos/Pharmakos.exe --headless -- --scene=res://scenes/smoke_check.tscn > smoke.log 2>&1
          status=$?
          if grep -Eq '(^|[^0-9a-f])[0-9a-f]{64}([^0-9a-f]|$)' smoke.log; then
            echo "smoke.log holds a 64-hex run and is not printed; the last step names its lines"
          else
            cat smoke.log
          fi
          if [ "${status}" -ne 0 ]; then
            echo "::error::the smoke check failed (exit ${status})"
            exit "${status}"
          fi
          grep -q '^\[smoke\] OK' smoke.log

      - name: No gamectl is left once the game has exited
        if: needs.package-windows.outputs.prose_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sleep 2
          if tasklist //FI "IMAGENAME eq gamectl.exe" | grep -qi gamectl; then
            echo "::error::a gamectl process outlived the game"; tasklist //FI "IMAGENAME eq gamectl.exe"; exit 1
          fi
          echo "no gamectl process is running"

      - name: No seat token in the logs
        # A seat token is 64 hex digits (decisions-log item 107 (2)). Only line numbers are
        # printed, never the line.
        if: always() && needs.package-windows.outputs.prose_only != 'true'
        shell: bash
        run: |
          set -uo pipefail
          if grep -Enq '(^|[^0-9a-f])[0-9a-f]{64}([^0-9a-f]|$)' smoke.log doctor.log; then
            echo "::error::a log holds a 64-hex run, the shape of a seat token"
            grep -En '(^|[^0-9a-f])[0-9a-f]{64}([^0-9a-f]|$)' smoke.log doctor.log | cut -d: -f1,2
            exit 1
          fi
          echo "no 64-hex run in smoke.log or doctor.log"

  clean-launch-linux:
    name: clean launch (ubuntu-24.04)
    needs: package-linux
    # No job-level `if:` (this file's header).
    runs-on: ubuntu-24.04
    # A hang guard, not a budget.
    timeout-minutes: 15
    steps:
      - name: Only prose changed, so there is no zip to launch
        if: needs.package-linux.outputs.prose_only == 'true'
        shell: bash
        run: echo "::notice title=docs-only fast path::Only prose changed, so the package job built no zip and this job launched nothing. It runs in full on main's push (decisions-log item 115 (4))."

      - name: Download the zip
        if: needs.package-linux.outputs.prose_only != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pharmakos-linux
          path: download

      - name: Extract it with unzip, keeping the modes the zip records
        # No chmod anywhere in this job: it proves a tester's unzip leaves both executables
        # runnable and every folder enterable.
        if: needs.package-linux.outputs.prose_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          unzip -q download/pharmakos-linux-x86_64.zip -d .
          ls -ld Pharmakos Pharmakos/*

      - name: gamectl seat doctor passes inside the extracted folder (acceptance (b))
        if: needs.package-linux.outputs.prose_only != 'true'
        shell: bash
        run: |
          set -uo pipefail
          (cd Pharmakos && ./gamectl seat doctor) > doctor.log 2>&1
          status=$?
          if grep -Eq '(^|[^0-9a-f])[0-9a-f]{64}([^0-9a-f]|$)' doctor.log; then
            echo "doctor.log holds a 64-hex run and is not printed; the last step names its lines"
          else
            cat doctor.log
          fi
          exit "${status}"

      - name: The shipped smoke check reaches the lobby, run from the parent folder (acceptance (a))
        if: needs.package-linux.outputs.prose_only != 'true'
        shell: bash
        run: |
          set -uo pipefail
          ./Pharmakos/Pharmakos.x86_64 --headless -- --scene=res://scenes/smoke_check.tscn > smoke.log 2>&1
          status=$?
          if grep -Eq '(^|[^0-9a-f])[0-9a-f]{64}([^0-9a-f]|$)' smoke.log; then
            echo "smoke.log holds a 64-hex run and is not printed; the last step names its lines"
          else
            cat smoke.log
          fi
          if [ "${status}" -ne 0 ]; then
            echo "::error::the smoke check failed (exit ${status})"
            exit "${status}"
          fi
          grep -q '^\[smoke\] OK' smoke.log

      - name: No gamectl is left once the game has exited
        if: needs.package-linux.outputs.prose_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sleep 2
          if pgrep -x gamectl > /dev/null; then
            echo "::error::a gamectl process outlived the game"; pgrep -a gamectl; exit 1
          fi
          echo "no gamectl process is running"

      - name: No seat token in the logs
        # A seat token is 64 hex digits (decisions-log item 107 (2)). Only line numbers are
        # printed, never the line.
        if: always() && needs.package-linux.outputs.prose_only != 'true'
        shell: bash
        run: |
          set -uo pipefail
          if grep -Enq '(^|[^0-9a-f])[0-9a-f]{64}([^0-9a-f]|$)' smoke.log doctor.log; then
            echo "::error::a log holds a 64-hex run, the shape of a seat token"
            grep -En '(^|[^0-9a-f])[0-9a-f]{64}([^0-9a-f]|$)' smoke.log doctor.log | cut -d: -f1,2
            exit 1
          fi
          echo "no 64-hex run in smoke.log or doctor.log"
