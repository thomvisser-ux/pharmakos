# SPDX-FileCopyrightText: 2026 Pharmakos contributors
# SPDX-License-Identifier: GPL-3.0-or-later
#
# CONTRACT FILE (AGENTS.md section 5): changes to what CI checks need owner approval.
#
# One command runs on three operating systems — `cargo xtask ci` — and a final job,
# `cross-OS determinism guard`, byte-compares what the three produced: the determinism
# binary's per-tick hash chain, every scenario's chain, the path-hash file, and the
# mesher, mapgen and vista geometry digests (decisions-log items 71 and 116 (6)(n)). That
# comparison is gate G4 in the flesh: "identical hashes on 3 operating systems".
#
# Hash chain path convention (also documented in xtask/src/main.rs):
#
#     target/determinism/hashes.txt
#         one line per tick, in tick order from 0
#         "<tick in decimal>\t<xxh3-64 state hash as 16 lowercase hex digits>"
#         \n endings, trailing newline, no \r anywhere
#
# Each matrix leg uploads that file and the fresh `actual.*` files under
# target/golden/{scenarios/*,pathing,mesher,mapgen}/ and target/golden/vista/
# actual.geometry.txt as ONE artefact, `cross-os-<os>`. The guard downloads all three and
# requires every file any leg uploaded on all three legs, the fixed kinds named in its
# script, and at least one scenario chain; it compares each whole, byte for byte. No perf
# figure is uploaded or compared: a number that cannot vary across platforms must not be
# compared across them, and a figure that can is published per runner by the `perf
# alarms` job instead. The three G4 lines are flipped: an empty upload is an error, a
# failed download is a failure, and a missing copy of any kind is red.
#
# Every `uses:` is pinned to a full commit SHA with its ref in a trailing comment
# (decisions-log item 116 (6)(o)); a ref marked `(branch)` has no tag of that name. The
# comment is the SHA's most specific tag (`# v2.9.2`, not `# v2` or `# v4 (v4.3.0)`): that
# is the form Dependabot rewrites when it moves the SHA, so a bump never leaves a stale one.
#
# THE DOCS-ONLY FAST PATH (decisions-log item 115 (4)). Every required job runs on every
# pull request, because the ruleset's twelve required checks must report under their own
# names (decisions-log item 121 (3)); a `paths-ignore` filter or a job-level `if:` would
# leave some of them never reporting. Instead each job that builds — the three
# `cargo xtask ci` legs, the two `client extension` legs, `vista screenshot (linux)` and
# the two `package (<os>)` jobs — runs `cargo xtask ci-scope` right after its checkout and
# toolchain steps, in a step with `id: scope`. It answers
# `prose_only=true` only for a `pull_request` whose merge commit changes nothing but
# `docs/**`, `AGENTS.md`, `CLAUDE.md`, `.claude/**` and top-level `*.md`, and false on every
# other event and on any error (the rules and their tests are in xtask/src/scope.rs).
#
# The rules for editing this file around it:
#   * every step the fast path skips is gated `steps.scope.outputs.prose_only != 'true'`,
#     never `== 'false'`, so a failed decision or a misspelt step id runs the step; the
#     gate is ADDED to an existing condition, never put in its place;
#   * only a step that runs in prose mode alone tests `== 'true'`: each job's notice, and
#     the ubuntu leg's `cargo xtask reuse`;
#   * no job gets a job-level `if:` for it: a skipped job prints no notice, and a skipped
#     matrix job reports under its unexpanded name;
#   * the decision is computed in each job, never in a job of its own: a failed `needs:`
#     job would skip its matrix dependents, with the same unexpanded names;
#   * the cross-OS guard takes the legs' answer through the `ci` job's outputs, and the
#     DCO job does not ask at all;
#   * the two `clean launch (<os>)` jobs take their own platform's `package (<os>)` job's
#     answer through that job's `prose_only` output, as the guard does, and have no
#     job-level `if:`: they run whenever their package job succeeded, which it does on a
#     prose-only pull request, print the notice, and skip every other step (decisions-log
#     item 117 (8)). The package jobs compute their own answer like the building jobs;
#   * the `perf alarms` job, which is not required, copies the pattern: it skips its
#     steps and prints the notice on a prose-only pull request;
#   * the scope step answers full in bash, before it builds xtask, whenever the commit
#     changes xtask/, .github/ or .cargo/: a pull request that breaks the decider must not
#     be judged by the broken copy, whose tests are among the steps it would skip. What
#     this cannot cover is a pull request that edits this file to remove the check; that
#     is a workflow change, which review reads by hand in any case.
# So on a prose-only pull request a green `cargo xtask ci (…)` check means the DCO walk
# and the `reuse` step passed and the suite did not run; the suite runs on main's push.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Incremental compilation buys nothing on a cold CI runner and makes builds less
  # reproducible; determinism work would rather have the cache be the artefact cache.
  CARGO_INCREMENTAL: "0"
  # `cargo xtask ci` skips a step whose external tool is missing. In CI every tool is
  # installed on purpose, so a missing one is a broken runner, not a reason to go green.
  PHARMAKOS_REQUIRE_TOOLS: "1"

jobs:
  ci:
    name: cargo xtask ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # 90, not 45 (decisions-log item 109): windows-latest ran the suite in 41 minutes at T14
    # and ran out of time once T15 added its headless matches. The limit is a hang guard,
    # not a budget (item 109 (8)), and it stays one. The suite's own budget is the owner's
    # (decisions-log item 119 (5)): a pull request that takes the Windows `cargo xtask ci`
    # leg past 75 minutes moves or narrows its own slowest tests (to nightly, or to fewer
    # seeds) in the same pull request. Item 116 (6)(f)'s `[profile.*]` question falls due at
    # the same 75 minutes and stays the owner's, a contract change (AGENTS.md section 5),
    # not a way out of the rule. The legs' measured times are in each xtask pull request.
    timeout-minutes: 90
    # The docs-only fast path's answer, for the cross-OS guard. A matrix job has one set of
    # outputs, so this is the last leg's to finish among those that set it. The legs agree
    # unless one hits an error. An error inside the decision answers false and runs that leg
    # in full; if that leg finishes last, the guard compares what exists, which is red after
    # the G4 flip: the safe side. A scope step that fails before it answers (rustup, or
    # xtask failing to build) leaves that leg's output unset, so the guard follows the other
    # legs; that leg still runs in full, since every gate on it reads `!= 'true'`.
    outputs:
      prose_only: ${{ steps.scope.outputs.prose_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The REUSE licence check is platform-independent, so it runs once, on Linux.
          #
          # `--skip screenshot` on the ubuntu leg is REQUIRED, not an optimisation. The
          # `screenshot` step's order is project → Linux → godot → xvfb-run → staging →
          # render, and the two tool checks go through `skip_or_fail`, which is a hard
          # failure under PHARMAKOS_REQUIRE_TOOLS. godot and xvfb are installed only in the
          # `screenshot` job below, so this leg would pass the first two checks and then
          # fail on a tool it was never given. The render belongs to that job, which
          # installs what it needs; this leg would also be doing it twice. The windows and
          # macOS legs keep the step, which skips there before it builds or stages anything:
          # the PNG goldens are Linux-only (decision 22, logged as item 116 (6)(a)).
          #
          # `--skip stage-client` on the ubuntu and windows legs is REQUIRED for the same
          # reason. `stage-client` builds the gdext cdylib, stages it and then runs
          # `godot --headless --path godot --import`; godot is installed in the `client`
          # job below and nowhere else, so on these two legs the step would reach
          # `skip_or_fail` and fail under PHARMAKOS_REQUIRE_TOOLS. The macOS leg keeps the
          # step and reports the real reason it cannot run: `pharmakos.gdextension`
          # declares windows.x86_64 and linux.x86_64 only (decisions-log item 73), so
          # there is no macOS library for Godot to load. That skip is the one worth
          # reading in the summary, and it is why the step is not skipped there too.
          - os: ubuntu-latest
            xtask_args: "--skip screenshot --skip stage-client"
            reuse: true
          - os: windows-latest
            xtask_args: "--skip reuse --skip stage-client"
            reuse: false
          - os: macos-latest
            xtask_args: "--skip reuse"
            reuse: false
    steps:
      - name: Check out the full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # `buf breaking --against .git#branch=main` reads the base branch out of the
          # local object store, so the whole history has to be here.
          fetch-depth: 0

      - name: Install the Rust toolchain
        # rust-toolchain.toml pins the channel and the components; this action installs
        # rustup's stable so that pin resolves. The action's `stable` is a branch, not a
        # tag, and its action.yml at the pinned commit defaults `toolchain` to stable.
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (branch)
        with:
          components: rustfmt, clippy

      - name: Decide whether anything but prose changed
        # The docs-only fast path (see this file's header). Builds xtask alone, which has no
        # dependencies, before the cache is restored. `continue-on-error`, so that a failed
        # decision leaves the output unset and every `!= 'true'` gate below runs its step.
        id: scope
        continue-on-error: true
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A change to the decider itself (xtask/, the workflows, or the `cargo xtask`
          # alias under .cargo/) is never judged by its own copy: that copy could be the
          # broken one, and the tests that would catch it are among the steps it skips.
          # `git diff --quiet` exits 1 on a difference and 128 on an error; both answer full.
          if ! git diff --quiet --no-renames HEAD^1 HEAD -- xtask .github .cargo; then
            echo "full: the commit changes xtask/, .github/ or .cargo/ (or git failed), so the decider does not judge its own change"
            echo "prose_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cargo xtask ci-scope

      - name: Only prose changed, so the suite does not run
        if: steps.scope.outputs.prose_only == 'true'
        shell: bash
        run: |
          if [ "${{ matrix.reuse }}" = "true" ]; then
            echo "::notice title=docs-only fast path::Only prose changed (docs/**, AGENTS.md, CLAUDE.md, .claude/**, top-level *.md), so \`cargo xtask ci\` did not run on this leg: it runs the \`reuse\` step alone, and the DCO job walks the sign-offs. The full suite runs on main's push (decisions-log item 115 (4))."
          else
            echo "::notice title=docs-only fast path::Only prose changed (docs/**, AGENTS.md, CLAUDE.md, .claude/**, top-level *.md), so \`cargo xtask ci\` did not run on this leg; the ubuntu leg runs the \`reuse\` step and the DCO job walks the sign-offs. The full suite runs on main's push (decisions-log item 115 (4))."
          fi

      - name: Make `main` available locally
        if: steps.scope.outputs.prose_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git rev-parse --abbrev-ref HEAD)" = "main" ]; then
            echo "already on main; buf breaking compares against the checkout"
          elif git fetch --no-tags --quiet origin +refs/heads/main:refs/heads/main; then
            echo "fetched origin/main for the breaking-change comparison"
          else
            echo "::notice::could not fetch main from the remote — the buf step will fail: buf breaking has no local main to compare against"
          fi

      - name: Cache cargo registry and target
        if: steps.scope.outputs.prose_only != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.os }}

      - name: Install buf
        if: steps.scope.outputs.prose_only != 'true'
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1 (branch; the repository is archived)
        with:
          # PINNED, for the same reason protoc-gen-prost is pinned below: crates/proto's
          # generated-tree check is a byte-for-byte comparison, and buf's own release
          # changes what `buf generate` emits (1.73.0 produced the committed tree;
          # `latest` on 2026-09-15 produced 470 bytes less and failed all three legs).
          # Keep this in step with the buf the tree was regenerated with; raising it
          # means regenerating the tree in the same commit.
          version: 1.73.0
          github_token: ${{ github.token }}

      - name: Install protoc-gen-prost
        if: steps.scope.outputs.prose_only != 'true'
        shell: bash
        # crates/proto's `the_checked_in_tree_matches_a_fresh_generation` regenerates
        # src/generated with `buf generate` and diffs it against what is committed, which
        # needs buf's prost plugin as well as buf itself. Without this step the test
        # skipped on every runner and the committed tree — a checked-in artefact of the
        # .proto contract files — could drift from proto/** with CI green; the test now
        # honours PHARMAKOS_REQUIRE_TOOLS and fails instead, so the install is what keeps
        # the leg green honestly.
        #
        # The version is PINNED, not `latest`: the check is a byte-for-byte comparison of
        # generated source, so a new plugin release that changes its output by a line
        # would fail every PR until someone regenerated. 0.5.0 is the version the tree was
        # generated with. Raising it means regenerating the tree in the same commit.
        run: cargo install protoc-gen-prost --version 0.5.0 --locked

      - name: Install cargo-deny
        if: steps.scope.outputs.prose_only != 'true'
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny

      - name: Install reuse
        if: matrix.reuse
        shell: bash
        run: |
          set -euo pipefail
          pipx install reuse
          # pipx puts its shims in ~/.local/bin, which is not on PATH for the steps that
          # follow unless we say so — and PHARMAKOS_REQUIRE_TOOLS turns "not found" into
          # a failure rather than a skip.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: cargo xtask reuse (docs-only fast path)
        # The one suite step the fast path keeps: a prose change can still add a file
        # without an SPDX header. It is the suite's own step, which builds nothing but xtask.
        if: matrix.reuse && steps.scope.outputs.prose_only == 'true'
        shell: bash
        run: cargo xtask reuse

      - name: Clear what an earlier run left in target/
        # The cache step above restores target/, and the cross-OS artefact below is read
        # out of it: a chain or a digest left by an earlier run must not pass for this
        # one's when this leg stops before producing its own.
        if: steps.scope.outputs.prose_only != 'true'
        shell: bash
        run: rm -rf target/golden target/determinism

      - name: cargo xtask ci
        if: steps.scope.outputs.prose_only != 'true'
        shell: bash
        run: cargo xtask ci ${{ matrix.xtask_args }}

      - name: Upload what the cross-OS guard compares
        # One artefact per leg: the determinism step's chain, and every fresh output the
        # `test` step wrote for the kinds that must agree across operating systems —
        # each scenario's chain (and expand-east-segment's event log), the path hashes,
        # and the mesher, mapgen and vista geometry digests. The actuals come from the
        # `test` step and the chain from `determinism`, so `always()` hands the guard
        # whatever a leg produced before a later step failed; a leg that failed before
        # `test` uploads nothing, the upload is an error, and the guard is red, which is
        # right. Not on the fast path, where nothing was produced.
        if: always() && steps.scope.outputs.prose_only != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cross-os-${{ matrix.os }}
          path: |
            target/determinism/hashes.txt
            target/golden/scenarios/*/actual.*
            target/golden/pathing/**/actual.*
            target/golden/mesher/**/actual.*
            target/golden/mapgen/**/actual.*
            target/golden/vista/actual.geometry.txt
          # Flipped at G4 (decisions-log item 116 (6)(n)): a leg that produced nothing
          # fails here rather than silently reducing the comparison.
          if-no-files-found: error
          retention-days: 14

  dco:
    name: DCO sign-off
    # The check is "every commit this branch adds carries a Signed-off-by trailer".
    # On a pull request the range is base..head. On a `workflow_dispatch` the range is
    # origin/main..HEAD, so a dispatch run on a branch walks that branch's sign-offs
    # rather than posting a skipped required check, which the ruleset counts as
    # satisfied (decisions-log item 116 (6)(m)); a dispatch of main itself has an empty
    # range and passes. It still skips on main's push, where the range would be empty or
    # the whole history. AGENTS.md section 8 and docs/CONTRIBUTING.md both point here,
    # so this job is what makes "CI checks it" true. Dependabot signs off its own commits
    # (`Signed-off-by: dependabot[bot] <support@github.com>`), so the walk accepts them
    # unchanged and needs no exemption (decisions-log item 122 (4)).
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Every commit carries a Signed-off-by trailer
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            # A dispatch has no pull request: walk what the dispatched ref adds to main.
            git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
            range="origin/main..HEAD"
          else
            range="${BASE_SHA}..${HEAD_SHA}"
          fi
          echo "walking ${range}"
          missing=0
          # `%(trailers:key=...)` prints nothing when the commit has no such trailer,
          # so an empty value is the failure. Command substitution rather than a pipe:
          # a pipe under `pipefail` would make grep's "no match" exit status abort the
          # loop instead of reporting the commit.
          for sha in $(git rev-list "$range"); do
            signoff=$(git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha")
            if [ -z "${signoff//[[:space:]]/}" ]; then
              subject=$(git show -s --format='%s' "$sha")
              echo "::error::no Signed-off-by on ${sha:0:12} — ${subject}"
              missing=$((missing + 1))
            fi
          done

          if [ "$missing" -ne 0 ]; then
            {
              echo "### DCO"
              echo
              echo "${missing} commit(s) in this pull request have no \`Signed-off-by\` trailer."
              echo
              echo "Contributions are accepted under the Developer Certificate of Origin 1.1"
              echo "(docs/DCO.txt). Sign new commits with \`git commit -s\`, and fix a branch"
              echo "that is already written with \`git rebase --signoff <base>\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "every commit in the range is signed off"

  determinism-cross-os:
    name: cross-OS determinism guard
    needs: ci
    # Runs even when a matrix leg failed: an ubuntu-only clippy failure should not hide a
    # hash divergence that the other two legs did produce.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The docs-only fast path: this job neither checks out nor compiles, because it runs
    # after the legs and would lengthen every pull request. It takes the legs' answer from
    # the `ci` job's outputs instead. The download and the compare are gated on it, so the
    # flipped G4 lines inside them stay skipped on a prose-only pull request. Otherwise a
    # leg that uploads nothing turns this job red, the safe side (decisions-log items
    # 115 (4) and 116 (6)(n)); there is no leg-count leniency.
    steps:
      - name: Only prose changed, so there are no hash chains to compare
        if: needs.ci.outputs.prose_only == 'true'
        shell: bash
        run: echo "::notice title=docs-only fast path::Only prose changed, so the \`cargo xtask ci\` legs did not run the suite and produced no hash chains; this guard compared nothing. It runs in full on main's push (decisions-log item 115 (4))."

      - name: Download every leg's artefact
        # Flipped at G4: no `continue-on-error`. A missing artefact means a leg did not
        # produce what it must, which must not read as a pass.
        if: needs.ci.outputs.prose_only != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: cross-os-*
          path: legs

      - name: Compare every kind byte for byte across the three
        # The kinds are the union of the relative paths the three legs uploaded, plus the
        # fixed ones named once below; each is required on all three legs and compared
        # whole, parsing no columns — the counts inside the digest and path-hash lines
        # come from the same deterministic computation as their hashes. No scenario is
        # named, so a new scenario needs no edit here. On a difference it names the
        # operating system that differs, the file and the first differing line.
        if: needs.ci.outputs.prose_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          # Where download-artifact put the three legs, one folder per leg. A variable so
          # the script can be run by hand over synthetic folders (the pull request that
          # wrote it shows three such runs).
          legs_dir="${CROSS_OS_DIR:-legs}"
          legs=(ubuntu-latest windows-latest macos-latest)
          # The kinds every leg must produce whatever else it produces, named once, here.
          # Scenario chains are not listed: every scenario's files are required on all
          # three legs through the union below, and at least one scenario chain is.
          fixed=(
            determinism/hashes.txt
            golden/pathing/actual.path-hashes.txt
            golden/mesher/actual.digests.txt
            golden/mapgen/actual.digests.txt
            golden/vista/actual.geometry.txt
          )
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          status=0
          fail() { echo "::error::$1"; echo "- ❌ $1" >> "$summary"; status=1; }

          { echo "### Cross-OS determinism"; echo; } >> "$summary"

          for os in "${legs[@]}"; do
            if [ ! -d "$legs_dir/cross-os-$os" ]; then
              fail "the $os leg uploaded nothing (no cross-os-$os artefact): its suite stopped before the test step, or the upload failed"
            fi
          done

          # The kinds: every relative path any leg uploaded, plus the fixed ones.
          kinds=$(
            {
              for os in "${legs[@]}"; do
                if [ -d "$legs_dir/cross-os-$os" ]; then
                  (cd "$legs_dir/cross-os-$os" && find . -type f | sed 's|^\./||')
                fi
              done
              printf '%s\n' "${fixed[@]}"
            } | sort -u
          )
          if ! printf '%s\n' "$kinds" | grep -q '^golden/scenarios/[^/]*/actual\.hashes\.txt$'; then
            fail "no leg uploaded a scenario chain (golden/scenarios/<name>/actual.hashes.txt)"
          fi

          compared=0
          while IFS= read -r kind; do
            [ -n "$kind" ] || continue
            present=()
            for os in "${legs[@]}"; do
              if [ -f "$legs_dir/cross-os-$os/$kind" ]; then
                present+=("$os")
              else
                fail "$kind is missing on $os"
              fi
            done
            [ "${#present[@]}" -ge 2 ] || continue
            # The odd one out: a leg that matches no other leg, when two others agree.
            differs=()
            for os in "${present[@]}"; do
              matches=0
              for other in "${present[@]}"; do
                if [ "$other" != "$os" ] && cmp -s "$legs_dir/cross-os-$os/$kind" "$legs_dir/cross-os-$other/$kind"; then
                  matches=$((matches + 1))
                fi
              done
              [ "$matches" -gt 0 ] || differs+=("$os")
            done
            if [ "${#differs[@]}" -eq 0 ]; then
              compared=$((compared + 1))
              echo "match: $kind (${present[*]})"
              continue
            fi
            for os in "${differs[@]}"; do
              # Against a leg that is not odd, when there is one; otherwise every leg
              # differs from every other and the first present one is the reference.
              reference=""
              for other in "${present[@]}"; do
                odd=0
                for d in "${differs[@]}"; do [ "$d" = "$other" ] && odd=1; done
                if [ "$odd" -eq 0 ]; then reference="$other"; break; fi
              done
              if [ -z "$reference" ]; then
                [ "$os" = "${present[0]}" ] && continue
                reference="${present[0]}"
              fi
              a="$legs_dir/cross-os-$reference/$kind"
              b="$legs_dir/cross-os-$os/$kind"
              report=$(cmp "$a" "$b" 2>&1 || true)
              line=$(printf '%s\n' "$report" | sed -n 's/.* line \([0-9][0-9]*\).*/\1/p' | head -n 1)
              if [ -z "$line" ] || printf '%s' "$report" | grep -q EOF; then
                # One file is a prefix of the other: cmp reports EOF on the shorter one,
                # so the first differing line is the first one past its end.
                line=$(( $(wc -l < "$a") < $(wc -l < "$b") ? $(wc -l < "$a") + 1 : $(wc -l < "$b") + 1 ))
              fi
              fail "$kind differs on $os from $reference at line $line"
              echo "  $reference: $(sed -n "${line}p" "$a" | head -c 200)"
              echo "  $os: $(sed -n "${line}p" "$b" | head -c 200)"
            done
          done <<< "$kinds"

          echo "$compared kind(s) byte-identical on every leg that has them"
          echo "- $compared kind(s) byte-identical across the legs" >> "$summary"
          if [ "$status" -ne 0 ]; then
            echo
            echo "The same commit produced different bytes on different operating systems, or a"
            echo "leg produced less than the others. Bisect a chain by tick from the first"
            echo "differing line above; the usual suspects are unordered iteration, an unchecked"
            echo "cast, a non-total sort comparator, or usize/isize reaching hashed state. Do not"
            echo "re-bless a golden to make this green."
          fi
          exit "$status"

  screenshot:
    name: vista screenshot (linux)
    # Linux only, and deliberately so. The goldens are rendered under xvfb with
    # the lavapipe software rasteriser; comparing a second platform's rasteriser
    # against them would be permanently red and would say nothing about the
    # geometry (skeleton-plan §7 decision 22, logged as decisions-log item
    # 116 (6)(a) — G1 measured 1.14 % of pixels differing between a Quadro and
    # lavapipe on identical geometry). The stronger of the two geometry checks is
    # the client's and the mesher's digests, which need no GPU, run on every leg
    # and are compared across the three by the cross-OS guard.
    #
    # This job is the ONLY place the shots are rendered: godot and xvfb are
    # installed here and nowhere else, which is why the ubuntu `ci` leg above
    # passes `--skip screenshot`.
    #
    # Three shots, each drawn through the bridge with NO host running
    # (xtask/src/main.rs, `SHOTS`): the vista (res://scenes/vista_shot.tscn, the
    # committed keyframe fixture, T16), the diagnostic rows (rows_shot.tscn) and
    # the wizard's first page (wizard_shot.tscn), T19's, compared since T20.
    # `cargo xtask screenshot` stages the extension itself, renders every shot
    # and then compares each with its golden; a shot with no golden still renders
    # and its actual is uploaded, and the step fails naming it. That is how a
    # first golden is made and how a deliberate re-render starts (decisions-log
    # item 105 (5)): delete the golden, push, download the artefact, look, commit.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Both parents of a pull request's merge commit, for `cargo xtask ci-scope`.
          fetch-depth: 2

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (branch)

      - name: Decide whether anything but prose changed
        # The docs-only fast path (see this file's header), as in the `ci` legs.
        id: scope
        continue-on-error: true
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A change to the decider itself (xtask/, the workflows, or the `cargo xtask`
          # alias under .cargo/) is never judged by its own copy: that copy could be the
          # broken one, and the tests that would catch it are among the steps it skips.
          # `git diff --quiet` exits 1 on a difference and 128 on an error; both answer full.
          if ! git diff --quiet --no-renames HEAD^1 HEAD -- xtask .github .cargo; then
            echo "full: the commit changes xtask/, .github/ or .cargo/ (or git failed), so the decider does not judge its own change"
            echo "prose_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cargo xtask ci-scope

      - name: Only prose changed, so the vista does not run
        if: steps.scope.outputs.prose_only == 'true'
        shell: bash
        run: echo "::notice title=docs-only fast path::Only prose changed (docs/**, AGENTS.md, CLAUDE.md, .claude/**, top-level *.md), so the vista render did not run in this job. It runs in full on main's push (decisions-log item 115 (4))."

      - name: Cache cargo registry and target
        if: steps.scope.outputs.prose_only != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: screenshot-ubuntu

      - name: Install a virtual display and the software rasteriser
        if: steps.scope.outputs.prose_only != 'true'
        # `godot --headless` CANNOT take a screenshot: it selects the dummy
        # rendering driver, `RenderingServer.frame_post_draw` never fires, and a
        # screenshot coroutine awaiting it parks for ever — silently, producing
        # no PNG and no error (G1 §10.12). The render runs windowed under xvfb
        # with lavapipe instead.
        #
        # Note what is NOT here: `VK_ICD_FILENAMES`. Pointing it at a path that
        # does not exist on this image makes the Vulkan loader find *no* driver,
        # after which Godot silently falls back to OpenGL 3 — a different
        # renderer from the golden's. Let the loader enumerate the installed
        # ICDs.
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary || echo "::notice::vulkaninfo failed; the render step will report what it selected"
          # No shim: `cargo xtask screenshot` finds xvfb-run on PATH by looking, not by
          # running it with `--version`, which xvfb-run lacks (decisions-log item 110 (4)).

      - name: Install Godot 4.7.2
        # The pinned build decisions-log item 73 names, exactly as the `client`
        # job installs it (Linux only here). PHARMAKOS_GODOT is what
        # `cargo xtask screenshot` runs.
        if: steps.scope.outputs.prose_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot"
          curl --fail --location --silent --show-error \
            --output "$HOME/godot/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q -o "$HOME/godot/godot.zip" -d "$HOME/godot"
          mv "$HOME/godot/Godot_v4.7.2-stable_linux.x86_64" "$HOME/godot/godot"
          chmod +x "$HOME/godot/godot"
          echo "$HOME/godot" >> "$GITHUB_PATH"
          echo "PHARMAKOS_GODOT=$HOME/godot/godot" >> "$GITHUB_ENV"
          version=$("$HOME/godot/godot" --version | head -n 1)
          echo "godot: ${version}"
          case "${version}" in
            4.7.2.stable*) ;;
            *) echo "::error::expected Godot 4.7.2.stable, got ${version}"; exit 1 ;;
          esac

      - name: cargo xtask screenshot
        # The step stages the client library itself (the same function as
        # `cargo xtask stage-client`) and runs `godot --headless --path godot
        # --import` before rendering. The import is not optional: a non-editor
        # Godot run loads GDExtensions only from `res://.godot/extension_list.cfg`,
        # which the editor writes when it scans the project and which is
        # git-ignored — so on a fresh checkout the extension's classes instantiate
        # as placeholders and the first call on them fails. G1 lost four runs to
        # this. Each shot's size and red-channel variance goes out as a
        # `::notice title=<shot> render::` line before any check.
        #
        # The comparison's verdict goes out as `::notice::` annotations as well
        # as to the step summary, because GitHub hides job logs and step
        # summaries from logged-out viewers.
        if: steps.scope.outputs.prose_only != 'true'
        shell: bash
        run: cargo xtask screenshot

      - name: Upload the renders
        # All three shots, whether or not their checks passed: a shot with no golden, or
        # one that moved, is looked at from here. Not on the fast path, where nothing was
        # rendered: `if-no-files-found: error` would otherwise turn the skip red.
        if: always() && steps.scope.outputs.prose_only != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vista-screenshot
          path: |
            target/golden/vista/actual.vista.png
            target/golden/vista/actual.rows.png
            target/golden/vista/actual.wizard.png
          # A job that rendered nothing must not read as a pass.
          if-no-files-found: error
          retention-days: 14

  client:
    name: client extension (${{ matrix.os }})
    # T12's acceptance, and the one thing no other leg can check: does the gdext
    # cdylib actually LOAD into Godot, and did the bridge catch a panic doing its
    # work. Everything `cargo xtask stage-client --check` asserts is also asserted
    # by `cargo test` on all three legs above — the geometry comparison between
    # upload paths A and B, the rules marshalling, the schema round trip. What
    # only this job can tell us is whether `PharmakosBridge` is a real class in a
    # real engine rather than a placeholder, which on a fresh checkout is exactly
    # what it is until `--import` has run (spike G1 §10.12; four runs lost).
    #
    # Windows and Linux, because those are the two platforms
    # `godot/pharmakos.gdextension` declares (decisions-log item 73) and the two
    # the client ships on (spec §15). macOS is deliberately absent: there is no
    # macOS library entry for Godot to load, and the `ci` leg above reports that
    # as a named skip rather than pretending the step ran.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            godot_asset: Godot_v4.7.2-stable_linux.x86_64.zip
            godot_binary: Godot_v4.7.2-stable_linux.x86_64
          - os: windows-latest
            godot_asset: Godot_v4.7.2-stable_win64.exe.zip
            godot_binary: Godot_v4.7.2-stable_win64.exe
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Both parents of a pull request's merge commit, for `cargo xtask ci-scope`.
          fetch-depth: 2

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (branch)

      - name: Decide whether anything but prose changed
        # The docs-only fast path (see this file's header), as in the `ci` legs.
        id: scope
        continue-on-error: true
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A change to the decider itself (xtask/, the workflows, or the `cargo xtask`
          # alias under .cargo/) is never judged by its own copy: that copy could be the
          # broken one, and the tests that would catch it are among the steps it skips.
          # `git diff --quiet` exits 1 on a difference and 128 on an error; both answer full.
          if ! git diff --quiet --no-renames HEAD^1 HEAD -- xtask .github .cargo; then
            echo "full: the commit changes xtask/, .github/ or .cargo/ (or git failed), so the decider does not judge its own change"
            echo "prose_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cargo xtask ci-scope

      - name: Only prose changed, so the client check does not run
        if: steps.scope.outputs.prose_only == 'true'
        shell: bash
        run: echo "::notice title=docs-only fast path::Only prose changed (docs/**, AGENTS.md, CLAUDE.md, .claude/**, top-level *.md), so the client check and the watch run did not run in this job. It runs in full on main's push (decisions-log item 115 (4))."

      - name: Cache cargo registry and target
        if: steps.scope.outputs.prose_only != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: client-${{ matrix.os }}

      - name: Install Godot 4.7.2
        # PINNED to the exact build decisions-log item 73 names — "godot = "=0.5.5"
        # and Godot 4.7.2 exactly, the pair every G1 number was taken on". A bump
        # is determinism-adjacent: it re-runs the geometry golden and goes through
        # a deliberate pull request, so `latest` has no place here.
        #
        # The binary is put on PATH under the name `godot`, because that is what
        # `cargo xtask stage-client` looks for — the same name a developer has
        # locally, so the command is the same one in both places.
        if: steps.scope.outputs.prose_only != 'true'
        shell: bash
        env:
          GODOT_ASSET: ${{ matrix.godot_asset }}
          GODOT_BINARY: ${{ matrix.godot_binary }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot"
          curl --fail --location --silent --show-error \
            --output "$HOME/godot/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/${GODOT_ASSET}"
          # `unzip` is on the Linux image and is NOT part of Git for Windows; 7-Zip is on
          # the Windows image. Neither is worth an action, and a step that assumed one
          # would fail on exactly one leg, which is the kind of thing that costs a run.
          if command -v unzip >/dev/null 2>&1; then
            unzip -q -o "$HOME/godot/godot.zip" -d "$HOME/godot"
          else
            7z x -y -o"$HOME/godot" "$HOME/godot/godot.zip" > /dev/null
          fi
          # The PATH entry has to be spelled the way a NATIVE process spawn
          # resolves it, not the way this shell does. `$HOME` under Git Bash on
          # the Windows runner is an MSYS POSIX path (`/c/Users/runneradmin`),
          # and writing that to `$GITHUB_PATH` publishes an entry Git Bash can
          # follow and `CreateProcess` cannot — so every later bash step finds
          # `godot` and xtask's `Command::new("godot")` does not. That is what
          # made this leg red on the first run of this job: the version step
          # below printed 4.7.2 and the very next step said godot was not
          # installed. `cygpath -w` converts it to `C:\Users\runneradmin\godot`,
          # which both resolve.
          #
          # PHARMAKOS_GODOT is the belt to that brace: `cargo xtask stage-client`
          # and `cargo xtask screenshot` run the binary it names in place of a
          # bare `godot`, so the step does not depend on how any shell spelled a
          # PATH entry at all.
          #
          # `cygpath -w` for the directory, because a Windows PATH entry is
          # spelled with backslashes; `cygpath -m` for the binary, because that
          # form (`C:/Users/.../godot.exe`) is the one BOTH this shell and a
          # native `CreateProcess` accept, and the guard step below runs it from
          # bash while xtask runs it from Rust.
          if [ "${RUNNER_OS}" = "Windows" ]; then
            mv "$HOME/godot/${GODOT_BINARY}" "$HOME/godot/godot.exe"
            godot_dir="$(cygpath -w "$HOME/godot")"
            godot_exe="$(cygpath -m "$HOME/godot/godot.exe")"
          else
            mv "$HOME/godot/${GODOT_BINARY}" "$HOME/godot/godot"
            chmod +x "$HOME/godot/godot"
            godot_dir="$HOME/godot"
            godot_exe="${godot_dir}/godot"
          fi
          echo "${godot_dir}" >> "$GITHUB_PATH"
          echo "PHARMAKOS_GODOT=${godot_exe}" >> "$GITHUB_ENV"

      - name: Godot reports the pinned version
        # A wrong archive is otherwise found much later, by a failure that reads
        # like a code problem.
        #
        # This step asks the question the NEXT step will ask, in the way it will
        # ask it. Running `godot --version` through bash proves only that bash
        # can resolve the name; the first run of this job passed exactly that
        # check and then failed on a native spawn of the same name. So on
        # Windows `where` is consulted as well — it resolves against the same
        # PATH a native process gets — and the binary PHARMAKOS_GODOT names is
        # run directly, which is what xtask actually invokes.
        if: steps.scope.outputs.prose_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" = "Windows" ]; then
            cmd //c where godot
          else
            command -v godot
          fi
          version=$("${PHARMAKOS_GODOT}" --version | head -n 1)
          echo "godot: ${version} (PHARMAKOS_GODOT=${PHARMAKOS_GODOT})"
          case "${version}" in
            4.7.2.stable*) ;;
            *) echo "::error::expected Godot 4.7.2.stable, got ${version}"; exit 1 ;;
          esac

      - name: cargo xtask stage-client --check
        # Build the cdylib, copy it into godot/bin, byte-scan the staged library
        # for `gdext_rust_init`, run `godot --headless --path godot --import`, and
        # then run the headless client check — which exits non-zero if the bridge
        # caught a panic at a `#[func]` boundary or if the two upload paths left
        # different geometry resident.
        #
        # PHARMAKOS_REQUIRE_TOOLS is set for the whole workflow, so a runner that
        # somehow lost its Godot fails here rather than skipping quietly.
        if: steps.scope.outputs.prose_only != 'true'
        shell: bash
        run: cargo xtask stage-client --check

      - name: Build gamectl for the headless watch run
        # The watch run below spawns `gamectl host` as the lobby does (decisions-log
        # item 107 (2), confirmed as item 108 (2)). A debug build, like the staged
        # client, so a panic in the host is a panic rather than an abort.
        if: steps.scope.outputs.prose_only != 'true'
        shell: bash
        run: cargo build --package pharmakos-gamectl --bin gamectl

      - name: Headless watch run against a real gamectl host
        # T16's live acceptance, grown by T19 (docs/design/skeleton-plan-t16a-notes.md
        # section A (4); skeleton-plan-w6-notes.md section A4 as decisions-log item 112
        # amends it); godot/scripts/watch_check.gd's header is the full list. The lobby's
        # host link spawns `gamectl host` with OS.execute_with_pipe for a TWO-seat match,
        # this seat and seat 1, which the host's built-in operator plays with Easy (it
        # plans, submits and says ready at every Lull's start). In round 1's Lull the
        # scene drives the editor (Load's refusal, a Fix, the committed playbook saved
        # back byte for byte, a placement ghost, a map action, QUICK and FULL, the
        # notebook, a draft, a submission whose bytes are the expected file's), the meter,
        # the wizard for every template the gateway lists (pages as they came, one value
        # sent back, Use, a map action, the submission and `gamectl verify`) and the pinned
        # Hold & Build instantiation. Ready then ends the Lull through `all_ready`, the
        # Push plays at 4x until `_status` reaches RECAP, and Continue leads into round
        # 2's Lull, where the carried draft opens through `get_draft`. The idle stretch is
        # spent there: 35 s, longer than the gateway's 30 s READ_TIMEOUT, so a missing
        # keep-alive drops a connection. The scene then quits in the Lull (the host saves
        # it and exits once its standard input closes), changes to a fresh scene, and
        # resumes the match on a second host: round 2's Lull comes back with the notebook,
        # the drafts and the carried draft's bytes. Across both hosts it asserts no caught
        # panic, no dropped connection and no refused call, and that both hosts exited.
        # The scene's exit code is the verdict, and its one OK line names both hosts' pids.
        #
        # This step is also where OS.execute_with_pipe is confirmed on Linux: the
        # owner measured it on Windows only (item 108 (2)).
        if: steps.scope.outputs.prose_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" = "Windows" ]; then
            gamectl="$(cygpath -m "$PWD/target/debug/gamectl.exe")"
            root="$(cygpath -m "$PWD")"
          else
            gamectl="$PWD/target/debug/gamectl"
            root="$PWD"
          fi
          set +e
          "${PHARMAKOS_GODOT}" --headless --path godot res://scenes/watch_check.tscn -- \
            "--gamectl=${gamectl}" "--root=${root}" > watch_check.log 2>&1
          status=$?
          set -e
          cat watch_check.log
          if [ "${status}" -ne 0 ]; then
            echo "::error::the headless watch run failed (exit ${status}); its report is above"
            exit "${status}"
          fi
          grep -q '^\[watch-check\] OK' watch_check.log

      - name: No gamectl is left once the client has exited
        # "The child exits when the client does" (item 108 (2)): the watch run has
        # exited, so no host may still be running on this runner.
        if: steps.scope.outputs.prose_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sleep 2
          if [ "${RUNNER_OS}" = "Windows" ]; then
            if tasklist //FI "IMAGENAME eq gamectl.exe" | grep -qi gamectl; then
              echo "::error::a gamectl process outlived the client"; tasklist //FI "IMAGENAME eq gamectl.exe"; exit 1
            fi
          else
            if pgrep -x gamectl > /dev/null; then
              echo "::error::a gamectl process outlived the client"; pgrep -a gamectl; exit 1
            fi
          fi
          echo "no gamectl process is running"

  perf-alarms:
    name: perf alarms (${{ matrix.os }})
    # Skeleton-plan section 7 decision 23, logged as decisions-log item 116 (6)(b):
    # performance is published per runner as `::notice::` annotations with NO threshold,
    # and never compared across operating systems. This job is NOT in the ruleset and must
    # not be asked to be: nothing gates on it. It must also never go red, because
    # scripts/merge-train.sh stops on any check that is not pass or skipping, required or
    # not; so its measuring step continues on error, and `cargo xtask perf-alarms` turns
    # a failed measurement into a `::warning::` and still exits 0.
    #
    # What it publishes: the mesher p99 (crates/mesher/tests/perf_alarm.rs, run with
    # `--release`, `--ignored` and `--nocapture` as its header says), and the allocations
    # per tick as a notice only — crates/sim/tests/allocations.rs asserts zero in every
    # leg's `test` step, so it is not run again here. The tick-minus-pathing mean is not
    # built: a millisecond figure for the sim may come only from a walled crate driving it
    # from outside (AGENTS.md section 4.5), none exists, and it moves to S2's G3′-real
    # gate. The budgets come with S1's P1 and S2's G3′-real gates, which set them.
    #
    # No cache step: the repository's cache store is past GitHub's 10 GB cap already, and
    # the mesher's release test build is small. It follows the docs-only fast path like the
    # building jobs: a prose-only pull request skips its steps and prints the notice.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Both parents of a pull request's merge commit, for `cargo xtask ci-scope`.
          fetch-depth: 2

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (branch)

      - name: Decide whether anything but prose changed
        # The docs-only fast path (see this file's header), as in the `ci` legs.
        id: scope
        continue-on-error: true
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A change to the decider itself (xtask/, the workflows, or the `cargo xtask`
          # alias under .cargo/) is never judged by its own copy: that copy could be the
          # broken one, and the tests that would catch it are among the steps it skips.
          # `git diff --quiet` exits 1 on a difference and 128 on an error; both answer full.
          if ! git diff --quiet --no-renames HEAD^1 HEAD -- xtask .github .cargo; then
            echo "full: the commit changes xtask/, .github/ or .cargo/ (or git failed), so the decider does not judge its own change"
            echo "prose_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cargo xtask ci-scope

      - name: Only prose changed, so nothing is measured
        if: steps.scope.outputs.prose_only == 'true'
        shell: bash
        run: echo "::notice title=docs-only fast path::Only prose changed (docs/**, AGENTS.md, CLAUDE.md, .claude/**, top-level *.md), so the perf alarms did not run in this job. They run in full on main's push (decisions-log item 115 (4))."

      - name: cargo xtask perf-alarms
        # An alarm, not a gate: continue on error, so even a failure to build cannot turn
        # this job red. Its own timeout sits below the job's: a job that reaches its
        # timeout-minutes concludes as failure, while a step that times out under
        # continue-on-error leaves the job green.
        if: steps.scope.outputs.prose_only != 'true'
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        run: cargo xtask perf-alarms

  # ---------------------------------------------------------------------------------------
  # T21: the unsigned zips (skeleton plan T21; decisions-log item 117 (8)). Four plain jobs,
  # not a matrix, because a `needs:` cannot name one leg of a matrix. All four are required
  # checks in the ruleset (main-protection) since T21 merged (decisions-log items 119 (1)
  # and 121 (3)), so a red one blocks a merge at GitHub as well as in
  # scripts/merge-train.sh, which stops on any check that is not pass or skipping.
  #
  # `package (<os>)` runs `cargo xtask package` and nothing else of substance: every check is
  # in xtask, where it also runs locally (the build, the C-runtime and .pck scans, the import
  # and the in-editor smoke check, the export, the manifest golden, reuse over the extracted
  # zip, and every scenario replayed by the packaged gamectl). The YAML only installs Godot,
  # its export templates and reuse, runs the command, and uploads. It needs no other job, so
  # it runs beside the suite rather than after it, and takes the docs-only fast path like
  # the building jobs. No Swatinem cache: the repository's cache store is past its 10 GB, and
  # the job builds two release binaries and nothing else of the workspace.
  #
  # `clean launch (<os>)` holds no checkout, no Rust, no Godot and no Python: it downloads
  # the zip its package job uploaded, extracts it with the platform's own tool, runs
  # `gamectl seat doctor` inside it (acceptance (b)) and the shipped smoke check from the
  # parent folder (acceptance (a): the root can only come from the executable's folder),
  # checks no gamectl is left, and fails if a log holds a 64-hex run, the shape of a seat
  # token. It runs no `--import`: it holds no project, only an export whose extension list
  # the package job's import wrote.
  # ---------------------------------------------------------------------------------------

  package-windows:
    name: package (windows-latest)
    runs-on: windows-latest
    # A hang guard, not a budget: a cold build of the two release binaries, the import, the
    # smoke check, the export and the replays take well under it.
    timeout-minutes: 60
    outputs:
      prose_only: ${{ steps.scope.outputs.prose_only }}
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Both parents of a pull request's merge commit, for `cargo xtask ci-scope`.
          fetch-depth: 2

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (branch)

      - name: Decide whether anything but prose changed
        # The docs-only fast path (see this file's header), as in the `ci` legs.
        id: scope
        continue-on-error: true
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A change to the decider itself (xtask/, the workflows, or the `cargo xtask`
          # alias under .cargo/) is never judged by its own copy: that copy could be the
          # broken one, and the tests that would catch it are among the steps it skips.
          # `git diff --quiet` exits 1 on a difference and 128 on an error; both answer full.
          if ! git diff --quiet --no-renames HEAD^1 HEAD -- xtask .github .cargo; then
            echo "full: the commit changes xtask/, .github/ or .cargo/ (or git failed), so the decider does not judge its own change"
            echo "prose_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cargo xtask ci-scope

      - name: Only prose changed, so nothing is packaged
        if: steps.scope.outputs.prose_only == 'true'
        shell: bash
        run: echo "::notice title=docs-only fast path::Only prose changed (docs/**, AGENTS.md, CLAUDE.md, .claude/**, top-level *.md), so no zip was built in this job, and its clean-launch job has nothing to launch. It runs in full on main's push (decisions-log item 115 (4))."

      - name: Install Godot 4.7.2, checked against Godot's SHA-512
        # The pinned build decisions-log item 73 names, installed as the `client` job does,
        # with the archive checked first against its line in Godot's published
        # SHA512-SUMS.txt for 4.7.2-stable (decisions-log item 117 (6)).
        if: steps.scope.outputs.prose_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot"
          curl --fail --location --silent --show-error \
            --output "$HOME/godot/Godot_v4.7.2-stable_win64.exe.zip" \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip"
          (cd "$HOME/godot" && echo "83decd58fdf67b9d657958a1ae6bf1929c20785315a81effe245874cdc57acb709bf868e00778a96984338c1b29dafdb453c6847747694621c6ecf5da2259993  Godot_v4.7.2-stable_win64.exe.zip" | sha512sum -c -)
          7z x -y -o"$HOME/godot" "$HOME/godot/Godot_v4.7.2-stable_win64.exe.zip" > /dev/null
          mv "$HOME/godot/Godot_v4.7.2-stable_win64.exe" "$HOME/godot/godot.exe"
          # A native spelling for PATH and for PHARMAKOS_GODOT, as the `client` job explains.
          echo "$(cygpath -w "$HOME/godot")" >> "$GITHUB_PATH"
          echo "PHARMAKOS_GODOT=$(cygpath -m "$HOME/godot/godot.exe")" >> "$GITHUB_ENV"

      - name: Godot reports the pinned version
        if: steps.scope.outputs.prose_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cmd //c where godot
          version=$("${PHARMAKOS_GODOT}" --version | head -n 1)
          echo "godot: ${version} (PHARMAKOS_GODOT=${PHARMAKOS_GODOT})"
          case "${version}" in
            4.7.2.stable*) ;;
            *) echo "::error::expected Godot 4.7.2.stable, got ${version}"; exit 1 ;;
          esac

      - name: Restore the export templates
        # Keyed on the templates archive's SHA-512 and the platform. A pull request restores
        # its own caches and main's; the first run on a branch with neither misses.
        if: steps.scope.outputs.prose_only != 'true'
        id: templates
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/AppData/Roaming/Godot/export_templates/4.7.2.stable
          key: godot-templates-ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079-windows

      - name: Install the export templates, checked against Godot's SHA-512
        # Godot_v4.7.2-stable_export_templates.tpz (1 281 349 702 bytes), checked against its
        # line in Godot's SHA512-SUMS.txt, then only the release template and version.txt
        # are extracted, without folders. Git for Windows has no unzip; 7-Zip is on the image.
        if: steps.scope.outputs.prose_only != 'true' && steps.templates.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # The runner's temporary folder is on the work drive, which has room for the
          # 1.28 GB archive; spelt the way this shell reads it.
          tmp="$(cygpath -u "$RUNNER_TEMP")"
          tpz="$tmp/Godot_v4.7.2-stable_export_templates.tpz"
          curl --fail --location --silent --show-error --output "$tpz" \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          (cd "$tmp" && echo "ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079  Godot_v4.7.2-stable_export_templates.tpz" | sha512sum -c -)
          7z l "$tpz"
          dir="$HOME/AppData/Roaming/Godot/export_templates/4.7.2.stable"
          mkdir -p "$dir"
          7z e -y "$tpz" -o"$dir" templates/windows_release_x86_64.exe templates/version.txt > /dev/null
          rm -f "$tpz"
          ls -la "$dir"

      - name: Check the installed template against its pinned SHA-512
        # On every run, cache hit or miss: the per-file hash of the release template inside
        # the verified archive (the owner's install matched it, item 117 (6)).
        if: steps.scope.outputs.prose_only != 'true'
        shell: bash
        env:
          CACHE_HIT: ${{ steps.templates.outputs.cache-hit }}
        run: |
          set -euo pipefail
          cd "$HOME/AppData/Roaming/Godot/export_templates/4.7.2.stable"
          echo "5b3d39315848983e45400a64662dad4a782636015cf6f659956194e3f196d72e7117a5ad9c94528361f6e1f229ed20c09a1dc740506eb1bcba2fba6bbb727981  windows_release_x86_64.exe" | sha512sum -c -
          [ "$(cat version.txt)" = "4.7.2.stable" ]
          if [ "$CACHE_HIT" = "true" ]; then cache=hit; else cache=miss; fi
          echo "::notice title=export templates::cache $cache; windows_release_x86_64.exe matches its pinned SHA-512"

      - name: Install reuse
        # Pinned: the zip's licence check is acceptance (c), and its counts are checked
        # against reuse 6.2.0's JSON. On Windows the PATH entry is written natively, and the
        # next step asks the question a native spawn will ask, as the client job does for godot.
        if: steps.scope.outputs.prose_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # pipx is a native program, so its bin folder is named natively, and the same
          # folder goes on PATH.
          export PIPX_BIN_DIR="$(cygpath -w "$HOME/.local/bin")"
          if command -v pipx > /dev/null 2>&1; then
            pipx=(pipx)
          else
            python -m pip install --user pipx
            pipx=(python -m pipx)
          fi
          "${pipx[@]}" install reuse==6.2.0
          # reuse needs a module to detect file encodings. On Linux python-magic finds the
          # system's libmagic; Windows has none, so reuse stops with NoEncodingModuleError
          # until charset-normalizer is in its environment (pinned, as the local check ran).
          "${pipx[@]}" inject reuse charset-normalizer==3.4.4
          echo "${PIPX_BIN_DIR}" >> "$GITHUB_PATH"

      - name: reuse is on PATH for a native spawn
        if: steps.scope.outputs.prose_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cmd //c where reuse
          reuse --version | head -n 1

      - name: cargo xtask package
        if: steps.scope.outputs.prose_only != 'true'
        shell: bash
        run: cargo xtask package

      - name: Upload the zip
        # 14 days from a pull request, 90 from a push to main: release.yml reads push runs.
        if: steps.scope.outputs.prose_only != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pharmakos-windows
          path: target/package/dist/pharmakos-windows-x86_64.zip
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 90 || 14 }}

      - name: Upload the diagnostics
        # Always, so a failed run carries what the next fix needs: the export's output, the
        # in-editor smoke log, reuse's report, the note, the notices, the zip's REUSE.toml and
        # its manifest.
        if: always() && steps.scope.outputs.prose_only != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-diagnostics-windows
          path: |
            target/package/logs/
            target/golden/package/actual.windows.txt
          if-no-files-found: warn
          retention-days: 14

  package-linux:
    name: package (ubuntu-24.04)
    # ubuntu-24.04, not -latest: the glibc floor the note states moves only on purpose.
    runs-on: ubuntu-24.04
    # A hang guard, not a budget.
    timeout-minutes: 60
    outputs:
      prose_only: ${{ steps.scope.outputs.prose_only }}
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Both parents of a pull request's merge commit, for `cargo xtask ci-scope`.
          fetch-depth: 2

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (branch)

      - name: Decide whether anything but prose changed
        # The docs-only fast path (see this file's header), as in the `ci` legs.
        id: scope
        continue-on-error: true
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A change to the decider itself (xtask/, the workflows, or the `cargo xtask`
          # alias under .cargo/) is never judged by its own copy: that copy could be the
          # broken one, and the tests that would catch it are among the steps it skips.
          # `git diff --quiet` exits 1 on a difference and 128 on an error; both answer full.
          if ! git diff --quiet --no-renames HEAD^1 HEAD -- xtask .github .cargo; then
            echo "full: the commit changes xtask/, .github/ or .cargo/ (or git failed), so the decider does not judge its own change"
            echo "prose_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cargo xtask ci-scope

      - name: Only prose changed, so nothing is packaged
        if: steps.scope.outputs.prose_only == 'true'
        shell: bash
        run: echo "::notice title=docs-only fast path::Only prose changed (docs/**, AGENTS.md, CLAUDE.md, .claude/**, top-level *.md), so no zip was built in this job, and its clean-launch job has nothing to launch. It runs in full on main's push (decisions-log item 115 (4))."

      - name: Install Godot 4.7.2, checked against Godot's SHA-512
        if: steps.scope.outputs.prose_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot"
          curl --fail --location --silent --show-error \
            --output "$HOME/godot/Godot_v4.7.2-stable_linux.x86_64.zip" \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          (cd "$HOME/godot" && echo "9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  Godot_v4.7.2-stable_linux.x86_64.zip" | sha512sum -c -)
          unzip -q -o "$HOME/godot/Godot_v4.7.2-stable_linux.x86_64.zip" -d "$HOME/godot"
          mv "$HOME/godot/Godot_v4.7.2-stable_linux.x86_64" "$HOME/godot/godot"
          chmod +x "$HOME/godot/godot"
