#
# CONTRACT FILE (AGENTS.md section 5): changes to how a release is cut need owner approval.
#
# Cuts a DRAFT release from green CI (skeleton plan T21; decisions-log item 117 (13)). On a
# pushed `v*` tag it:
#   1. checks the tag's shape, and resolves it to a commit through the API (annotated and
#      lightweight tags alike);
#   2. checks the commit is on main;
#   3. finds ci.yml's push run for that exact commit and requires it to have succeeded:
#      "cut from green CI" means no rebuild, so no toolchain drift;
#   4. downloads that run's `pharmakos-windows` and `pharmakos-linux` zips, renames them
#      pharmakos-<tag>-<os>-x86_64.zip and writes SHA256SUMS.txt;
#   5. takes the notes from CHANGELOG.md's section headed with the package's version string,
#      `xtask/src/package.rs`'s `VERSION` at that commit (the string the zips carry), and
#      requires that string to be the tag's own version, for every tag, with a suffix or
#      without (item 228): a tag on a commit that names another version would publish that
#      version's zips and notes under the wrong name; adds the tag and the commit;
#   6. creates a DRAFT with `gh release create --verify-tag`, a prerelease when the tag has
#      a `-` suffix. The owner publishes it; nothing here publishes anything.
#
# A workflow_dispatch with `tag` and an optional `sha` (default: main's head) runs steps 1 to
# 5 as a dry run and prints what it would upload; the create step's only condition is a
# pushed `v*` tag. The dry run makes step 5's check too, so between tags, while main's
# `VERSION` is the next version with `-dev`, a dry run on main's head fails there by design:
# give it the `sha` of the commit that sets the tag's version. The skeleton's tags were
# `v0.1.0-dev.<n>` from 1 (item 117 (13)); they are history, were cut from a commit whose
# `VERSION` was `0.1.0-dev+skeleton`, and are never pushed again, so step 5's check does not
# have to admit them. From item 228 versions are stage-based before 1.0, the minor number
# the stage: `v0.N.0` closes stage N, `v0.N.P` is a fix, `v0.N.0-m<K>` a milestone build
# inside stage N (a prerelease, by its suffix), and `v1.0.0` is v1; step 1 accepts those
# forms and no other suffix. The main session pushes a tag, each one on the owner's word.
#
# Security: no permissions at the top, `contents: write` and `actions: read` on the one job;
# no checkout and no third-party action; the tag and every input reach the shell only
# through `env:`, never through an expression inside `run:`, and are checked against their
# patterns before anything uses them.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to cut, as v<major>.<minor>.<patch> or v<major>.<minor>.<patch>-m<K> (a dry run: nothing is created)"
        required: true
        type: string
      sha:
        description: "The 40-hex commit to cut from (default: main's head)"
        required: false
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: draft release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the tag and the commit's shape
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PUSHED_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            tag="$PUSHED_TAG"
          else
            tag="$INPUT_TAG"
          fi
          # The scheme's two forms (item 228): a release, or a milestone build `-m<K>`. No
          # other suffix: a `-dev` tag on main's head would cut a release of a dev build.
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-m[0-9]+)?$ ]]; then
            echo "::error::the tag is not v<major>.<minor>.<patch> or v<major>.<minor>.<patch>-m<K>"
            exit 1
          fi
          if [ "$EVENT" = "push" ]; then
            ref="$tag"
          elif [ -n "$INPUT_SHA" ]; then
            if ! [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::sha is not a 40-hex commit"
              exit 1
            fi
            ref="$INPUT_SHA"
          else
            ref="main"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "REF=$ref" >> "$GITHUB_ENV"
          echo "tag $tag, resolving $ref"

      - name: Resolve the commit and check it is on main
        shell: bash
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GH_REPO/commits/$REF" --jq .sha)
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::$REF did not resolve to a commit"
            exit 1
          fi
          status=$(gh api "repos/$GH_REPO/compare/main...$sha" --jq .status)
          case "$status" in
            identical|behind) ;;
            *) echo "::error::$sha is not on main (compare says $status); a release is cut from a merge commit on main"; exit 1 ;;
          esac
          echo "SHA=$sha" >> "$GITHUB_ENV"
          echo "commit $sha is on main ($status)"

      - name: Find ci.yml's push run for that commit, and require it green
        shell: bash
        run: |
          set -euo pipefail
          run=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&per_page=1" \
            --jq '.workflow_runs[0] // empty | [.id, .status, (.conclusion // "none")] | @tsv')
          if [ -z "$run" ]; then
            echo "::error::ci.yml has no push run for $SHA. Only a commit that was main's head when it was pushed gets one (a pull request's merge commit); a commit from inside a branch never will"
            exit 1
          fi
          IFS=$'\t' read -r id status conclusion <<< "$run"
          if [ "$status" != "completed" ]; then
            echo "::error::the push run for $SHA is still running (run $id)"
            exit 1
          fi
          if [ "$conclusion" != "success" ]; then
            echo "::error::the push run for $SHA concluded $conclusion (run $id)"
            exit 1
          fi
          echo "RUN_ID=$id" >> "$GITHUB_ENV"
          echo "push run $id for $SHA succeeded"

      - name: Download the two zips and write their checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p download release
          for os in windows linux; do
            gh run download "$RUN_ID" --name "pharmakos-$os" --dir "download/$os"
            if [ ! -f "download/$os/pharmakos-$os-x86_64.zip" ]; then
              echo "::error::run $RUN_ID's pharmakos-$os artefact holds no pharmakos-$os-x86_64.zip (expired after 90 days, or never uploaded)"
              exit 1
            fi
            mv "download/$os/pharmakos-$os-x86_64.zip" "release/pharmakos-$TAG-$os-x86_64.zip"
          done
          (cd release && sha256sum "pharmakos-$TAG-windows-x86_64.zip" "pharmakos-$TAG-linux-x86_64.zip" > SHA256SUMS.txt)
          ls -la release
          cat release/SHA256SUMS.txt

      - name: Take the notes from CHANGELOG.md at that commit
        shell: bash
        run: |
          set -euo pipefail
          # The heading is the version string the zips carry: `xtask/src/package.rs`'s VERSION
          # at that commit, the one source (decisions-log item 142). It reaches $GITHUB_ENV
          # below, so it must be one line of a version's characters; a rejected value is
          # printed escaped, never raw, so it cannot start a workflow command.
          gh api "repos/$GH_REPO/contents/xtask/src/package.rs?ref=$SHA" --jq .content | base64 -d > package.rs
          heading="$(sed -n 's/^pub(crate) const VERSION: &str = "\([^"]*\)";$/\1/p' package.rs | head -n 1)"
          if ! printf '%s' "$heading" | grep -qxE '[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?'; then
            printf '::error::xtask/src/package.rs at %s has no version-shaped VERSION (found: %q)\n' "$SHA" "$heading"
            exit 1
          fi
          # Every tag, with a suffix or without: the commit's version is the tag's (item 228).
          # $heading passed the version-shape check above, so printing it raw is safe.
          if [ "$heading" != "${TAG#v}" ]; then
            echo "::error::tag $TAG needs the package version ${TAG#v}; at $SHA it is $heading. The tag belongs on the merge commit of the pull request that sets VERSION to ${TAG#v}"
            exit 1
          fi
          gh api "repos/$GH_REPO/contents/CHANGELOG.md?ref=$SHA" --jq .content | base64 -d > changelog.md
          if ! grep -qxF "## $heading" changelog.md; then
            echo "::error::CHANGELOG.md at $SHA has no \`## $heading\` section"
            exit 1
          fi
          {
            echo "Tag: $TAG"
            echo "Commit: $SHA"
            echo
            awk -v h="## $heading" '$0 == h { on = 1; next } on && /^## / { exit } on { print }' changelog.md
          } > notes.md
          echo "VERSION=$heading" >> "$GITHUB_ENV"
          # The notes are repository text: show them with workflow commands stopped.
          stop="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::$stop"
          cat notes.md
          echo "::$stop::"

      - name: Create the draft release
        # The only condition is a positive one: a pushed v* tag. A dispatch never gets here.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" --draft --verify-tag "${prerelease[@]}" \
            --title "$TAG ($VERSION)" --notes-file notes.md \
            "release/pharmakos-$TAG-windows-x86_64.zip" \
            "release/pharmakos-$TAG-linux-x86_64.zip" \
            release/SHA256SUMS.txt

      - name: Dry run - what a tag would upload
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          prerelease=""
          if [[ "$TAG" == *-* ]]; then
            prerelease=" --prerelease"
          fi
          echo "::notice title=release dry run::a pushed $TAG would create a draft$prerelease titled \"$TAG ($VERSION)\" from run $RUN_ID of $SHA, with pharmakos-$TAG-windows-x86_64.zip, pharmakos-$TAG-linux-x86_64.zip and SHA256SUMS.txt"

      # What to do after a refusal, said once, for each event. A pushed v* tag cannot be moved
      # or deleted (the tag rulesets, decisions-log items 119 (2) and 121), so "tag again" is
      # never the remedy (item 230). These steps only print; they decide nothing.
      - name: After a refusal on a pushed tag
        if: failure() && github.event_name == 'push'
        shell: bash
        run: |
          echo "::error title=a pushed tag cannot be moved or deleted::If the tagged commit itself is right and only its ci.yml push run was unfinished, or failed on something a re-run of its failed jobs cures (gh run rerun <that run> --failed, which rebuilds nothing that passed), then re-run THIS run once that run is green: gh run rerun $GITHUB_RUN_ID. If the fault is in the tag's name or in the tagged commit (wrong shape, not a merge commit on main, another version, no changelog section, a real test failure), this tag will never cut a release while the rulesets stand: its version number is spent, and the next one needs the owner's word. Dry-run every tag before pushing it (workflow_dispatch with the tag and the commit's sha)."

      - name: After a refusal on a dry run
        if: failure() && github.event_name != 'push'
        shell: bash
        run: |
          echo "::notice title=the dry run refused this tag::Nothing was created and no tag exists. Cure the cause above, then dry-run again with the same tag and the sha of the commit it is meant for (a dry run with no sha checks main's head as it is at that moment)."
