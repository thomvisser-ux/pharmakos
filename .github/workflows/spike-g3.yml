#
# Plan §4. Lives here rather than in .github/workflows/ so the spike stays
# self-contained; copy it verbatim to .github/workflows/spike-g3.yml in the
# spike worktree. Deleted with this directory in week 5 (spikes/README.md
# rule 6) — except for the `hash-identity` job, which is worth keeping past the
# spike for the same reason G2's `path-identity` is: it is a cheap, early
# instance of the cross-OS determinism contract G4 is establishing, and here it
# is free. Plan §4's last line: "The spike also emits the per-tick hash stream
# from `tickbench`, so this workflow doubles as a second, independent
# determinism trace for G4 at no extra cost."
#
# Note on paths: `defaults.run.working-directory` puts every `run` step inside
# spikes/g3-tick-budget, but upload-artifact and download-artifact paths are
# resolved from the repository root, so those carry the prefix explicitly.
#
# NOTE ON WHAT THE THREE OPERATING SYSTEMS CAN AND CANNOT BE COMPARED ON.
#
# Plan §3 step 7 wants the budget set by the slower of Windows and Linux. The
# gate-configuration *total* cannot decide that here, and the matrix must not be
# read as if it could: `phase_pathing` charges G2's measured nanoseconds divided
# by the host's own measured picoseconds-per-iteration, so the charged half
# reproduces G2's milliseconds on every machine by construction. At the gate
# configuration that charge is ~98% of the tick, so a runner 20% slower at hot
# integer loops still reports a tick mean within noise of the others. The figure
# that does vary is `tick_minus_pathing_mean_ms`, and the destruction-off leg
# below is where it is large enough to read. Compare those; ignore the totals.
#
# NOTE ON THRESHOLDS — read this before changing a number.
#
# The assertions below are **PLACEHOLDER regression alarms, not the gate.**
# Plan §4 says so out loud ("Assert against a LOOSE PLACEHOLDER threshold only:
# hosted vCPUs are slow and noisy, so a 25 ms p99 asserted here would either
# flap or be meaningless") and plan §5's last row says the binding numbers come
# from the dev machine and are recorded in the plan's §9.
#
#   --assert-p99-ms 190   is about 3.4x the 56.04 ms p99 measured on the
#                         developer machine (i7-9800X, Windows 10, pinned to a
#                         core) at the gate configuration with the repath cap
#                         unbounded, over 9 600 ticks after 2 000 of warm-up,
#                         median of three runs.
#   --assert-mean-ms 40   is about 3.8x the 10.52 ms mean measured there.
#
# Both are far ABOVE the G3'-a (25 ms) and G3'-b (12.5 ms) gate values, and
# deliberately so: at the unbounded repath cap this configuration **does not
# meet G3'-a on the developer machine either** (see the plan's §9 Results and
# the repath-cap sweep in cost.json). Asserting the gate value here would fail
# every run and tell nobody anything new. What these alarms catch is the thing
# CI can catch: an order-of-magnitude regression in the synthetic tick between
# spike days.
#
# AND READ THIS BEFORE QUOTING THE 56 ms: that p99 is a readout of ONE
# unmeasured constant, the repath burst frequency (`--burst-one-in`, default
# 1-in-64, a PLACEHOLDER — G2 gave the burst's 8x magnitude, never its rate).
# On the developer machine the same run gives a p99 of 52.10 ms at 1-in-32,
# 56.04 ms at 1-in-64, 11.61 ms at 1-in-128 and 12.19 ms with the burst off,
# for a mean that stays at 10.52-10.67 ms throughout. G3'-a therefore flips from
# FAIL to PASS between two neighbouring values of a number nobody has measured.
# The plan's §9 publishes the whole sweep next to the verdict.
# PLACEHOLDER: owner, at the S2 exit measurement — replace both with the budget
# the sim's own perf gate sets, once the real tick has been measured and the
# per-tick repath cap (decisions-log item 60) has a value.

name: spike-g3-tick-budget

on: [push, workflow_dispatch]

# A new push cancels the previous run: the only way to stop a hung job without
# a GitHub login.
concurrency:
  group: spike-g3-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: spikes/g3-tick-budget

jobs:
  tick:
    strategy:
      fail-fast: false
      matrix:
        # macOS is information only — plan §3 step 7: "Repeat steps 3-5 on
        # Windows and Linux. The budget is set by the slower of the two, since
        # both are first-class. macOS is a CI artefact only and its numbers are
        # recorded as information." So the assertion flags below are added on
        # ubuntu and windows only, and the macOS leg still produces its JSON and
        # its hash stream.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: spikes/g3-tick-budget
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # The spike's own discipline, checked with the spike's own clippy.toml
      # (see its header for why the file exists and what it does and does not
      # shadow). `--all-targets` puts the two binaries under the build too; the
      # library's determinism denials are crate-root attributes in src/lib.rs
      # and travel with the code.
      # out/ exists before anything that can fail, so the upload step at the end
      # always has a directory to look at whatever went wrong before it.
      - run: mkdir -p out

      - run: cargo fmt --all --check
      # `--locked` on every cargo invocation that resolves a graph: this step
      # runs before the `--locked` ones below, so without it, it is the one call
      # that could rewrite Cargo.lock and make the three-OS comparison a
      # comparison of three different builds. (`cargo fmt` takes no --locked.)
      - run: cargo clippy --release --all-targets --locked -- -D warnings

      # The hash identity (incremental == a from-scratch fold, every tick), the
      # cost model's independence from the clock calibration, the broadphase
      # against a brute-force oracle, the kill-credit tiebreak, the copy-on-write
      # store, the brownout order's totality, and the determinism wall's text
      # check. `--locked` because the three-OS hash comparison below is only a
      # controlled experiment if all three runners build the same graph.
      - run: cargo test --release --locked

      # Plan §3 steps 2, 3 and 6 at the gate configuration: 4 seats, 300 units,
      # 40 beacons, a full 8-minute segment (9 600 ticks) after 2 000 ticks of
      # warm-up, a 20 explosions/s destruction stream, three repetitions with
      # the median of the three p99s reported.
      - name: tickbench (gate configuration)
        if: matrix.os != 'macos-latest'
        run: |
          cargo run --release --locked --bin tickbench -- \
            --seats 4 --units 300 --beacons 40 --ticks 9600 --warmup 2000 \
            --edits-per-s 20 --repeat 3 --hash full \
            --json out/tick.json --hashes out/hashes.txt \
            --assert-p99-ms 190 --assert-mean-ms 40

      # macOS: same run, no assertions (plan §3 step 7). It still writes
      # out/hashes.txt, which is what the hash-identity job below compares.
      - name: tickbench (gate configuration, information only)
        if: matrix.os == 'macos-latest'
        run: |
          cargo run --release --locked --bin tickbench -- \
            --seats 4 --units 300 --beacons 40 --ticks 9600 --warmup 2000 \
            --edits-per-s 20 --repeat 3 --hash full \
            --json out/tick.json --hashes out/hashes.txt

      # The per-OS comparison, on the only part of the tick that can differ.
      # The `pathing` phase is ~98% of the gate tick and is charged from G2's
      # measured nanoseconds divided by this host's measured picoseconds per
      # iteration, so it reproduces G2's milliseconds on every machine BY
      # CONSTRUCTION: a runner 20% slower at hot integer loops still reports
      # ~11 ms of pathing. Comparing gate-configuration totals across operating
      # systems therefore compares almost nothing. This leg turns the
      # destruction stream off, which leaves a tick that is mostly real sim
      # work, and `tick_minus_pathing_mean_ms` in both JSONs is the figure the
      # write-up compares platform to platform.
      - name: tickbench (destruction off — the platform comparison)
        run: |
          cargo run --release --locked --bin tickbench -- \
            --seats 4 --units 300 --beacons 40 --ticks 9600 --warmup 2000 \
            --edits-per-s 0 --repeat 3 --hash full \
            --json out/tick-noedits.json

      # The hashing decision (plan §2's warning about the `hash` phase, and §8's
      # item 3). One run in each mode; the two streams must be identical, which
      # `cargo test` already proves and this re-checks on the real segment.
      - name: tickbench (incremental hash, for the hashing decision)
        run: |
          cargo run --release --locked --bin tickbench -- \
            --seats 4 --units 300 --beacons 40 --ticks 9600 --warmup 2000 \
            --edits-per-s 20 --repeat 1 --hash incremental \
            --json out/tick-incremental.json --hashes out/hashes-incremental.txt
          cmp out/hashes.txt out/hashes-incremental.txt \
            && echo "::notice title=hash modes::full and incremental produced identical streams" \
            || { echo "::error title=hash modes::full and incremental DISAGREE"; exit 1; }

      # Plan §3 steps 4 and 5. Advisory — no assertions — because its job is to
      # produce the numbers behind the power budget, not to gate a build. The
      # tick count per point is reduced from the dev machine's 600 to 200: the
      # sweep is 29 points and a hosted vCPU is slow.
      - name: costmodel (sweep, fits, power budget) — advisory
        run: |
          cargo run --release --locked --bin costmodel -- \
            --seats 4 --ticks-per-point 200 --warmup 100 --json out/cost.json

      # Job logs and step summaries are both hidden from logged-out viewers;
      # annotations are not. ci/annotate.py publishes the tick summary, the
      # per-phase table, the cost-model fit and the hash digest as ::notice::
      # commands (and into the step summary for anyone signed in).
      # `if: always()` so a failed assertion still reports the numbers that
      # failed.
      - name: diagnostics as annotations
        if: always()
        # `python`, not `python3`: setup-python@v5 (above) guarantees `python`
        # on all three runners; a `python3.exe` alias on windows-latest is the
        # runner image's business, not something a job should bet on.
        run: python ci/annotate.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g3-${{ matrix.os }}
          path: spikes/g3-tick-budget/out/*
          if-no-files-found: warn

  hash-identity:
    needs: tick
    # `always()`, because this job is the only thing in this workflow that is a
    # real contract check — the cross-OS per-tick hash comparison G4 is
    # establishing, free here. Without it, a flap of the PLACEHOLDER regression
    # alarm above (a loose threshold on a noisy hosted vCPU) would suppress the
    # one result worth having. The download steps below are
    # `continue-on-error` for the same reason; `compare()` already reports a
    # missing hashes.txt as an error and fails the job on it.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # This job checks out nothing, so it must NOT inherit the workflow-level
    # `working-directory: spikes/g3-tick-budget` — that directory does not exist
    # on this runner and every `run` step would fail before its first command.
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: g3-ubuntu-latest
          path: linux
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: g3-windows-latest
          path: windows
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: g3-macos-latest
          path: macos
      # The free G4 evidence. The per-tick hash stream is a pure function of
      # (match seed, configuration) — the repath cap and the clock calibration
      # are deliberately outside hashed state, and `tests/spike.rs` pins that —
      # so all three operating systems must produce the same 9 600 lines.
      - name: compare the hash streams pairwise
        run: |
          rc_total=0
          compare () {
            a="$1"; b="$2"
            if [ ! -f "$a/hashes.txt" ] || [ ! -f "$b/hashes.txt" ]; then
              echo "::error title=hash-identity::hashes.txt is missing from \
          $a or $b, so nothing was compared"
              rc_total=1
              return
            fi
            set +e
            cmp "$a/hashes.txt" "$b/hashes.txt"
            rc=$?
            set -e
            lines=$(wc -l < "$a/hashes.txt")
            if [ "$rc" -eq 0 ]; then
              echo "::notice title=hash-identity $a vs $b::agree on all $lines \
          per-tick hashes"
            else
              echo "::error title=hash-identity $a vs $b::DISAGREE on the \
          per-tick hash stream (cmp exit $rc). This is a G4 failure found by \
          G3' for free; diagnose it before reading any budget number."
              diff <(head -50 "$a/hashes.txt") <(head -50 "$b/hashes.txt") | head -40
              rc_total=1
            fi
          }
          compare linux windows
          compare linux macos
          compare windows macos
          exit "$rc_total"
