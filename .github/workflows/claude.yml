#
# CONTRACT FILE (AGENTS.md section 5).
#
# @claude on issues and pull requests, through the Claude GitHub App. Only the owner can
# trigger it (author_association OWNER below, on top of the action's own write-access check),
# so an outside comment never starts a run or spends the subscription. A run the owner starts
# still reads the thread, so outside text can reach Claude; the limits below bound what it can
# then do.
#
# What a run can do: the action exchanges this job's OIDC token (`id-token: write`) for the
# Claude App's token, which can write contents, pull requests and issues. With it Claude posts
# its replies and pushes branches; it cannot push `main` (the ruleset) or change a workflow
# (the App asks for no `workflows` permission). The job's own `contents: read` limits only the
# job token, which the fork check's `gh` call uses; the checkout persists none.
#
# Hardening (decisions-log item 119 (8)): a pull request from a fork never runs, because the
# action checks out the head it is asked about and Claude's commands would run that code with
# the tokens above in reach; the Bash tools are exact commands, since a prefix rule such as
# `cargo test:*` also admits `--config` and so any shell; subprocesses get a scrubbed
# environment; and Claude reads only the owner's comments and its own.
#
# DCO: the owner decided that commits made here are signed off as the owner, because only the
# owner can trigger a run — the same footing as the owner's local Claude Code sessions. The
# instruction is appended to Claude's system prompt; the `dco` job in ci.yml still checks it.

name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment'
        && contains(github.event.comment.body, '@claude')
        && github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review_comment'
        && contains(github.event.comment.body, '@claude')
        && github.event.comment.author_association == 'OWNER'
        && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_review'
        && contains(github.event.review.body, '@claude')
        && github.event.review.author_association == 'OWNER'
        && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issues'
        && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))
        && github.event.issue.author_association == 'OWNER')
    # Job-level, so a run the `if` skips never joins the group and displaces a waiting request.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    steps:
      # An issue comment on a pull request carries no head repository, so ask for it.
      - name: Refuse pull requests from forks
        if: github.event_name == 'issue_comment' && github.event.issue.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
        run: |
          fork=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json isCrossRepository --jq .isCrossRepository)
          if [ "$fork" != "false" ]; then
            echo "::error::@claude does not run on a pull request from a fork"
            exit 1
          fi

      # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB above makes Claude Code run its subprocesses under
      # bubblewrap, and Claude Code 2.1.288 (v1.0.240's base-action/action.yml at the pinned
      # SHA sets CLAUDE_CODE_VERSION, and its bun.lock pins agent SDK 0.3.288; re-check both
      # on a bump) refuses to start without it: run
      # 36432629735 failed in "Run Claude Code" with "bubblewrap is required for subprocess
      # env scrubbing and isolation" (decisions-log item 124 (5)(d)). The fix keeps the
      # isolation rather than opting out of it. These are the steps the action runs itself,
      # in its "Install subprocess isolation dependencies" step, when it scrubs for
      # `allowed_non_write_users` (an input this workflow does not set, since it would widen
      # who can start a run): bubblewrap and socat from the image's apt sources, three
      # attempts, then the sysctl below. One difference: the action's step is
      # continue-on-error, and this one is not. `command -v bwrap` after the loop fails the
      # job when every attempt failed, here, rather than inside the action.
      #
      # The sysctl: Ubuntu 24.04 (ubuntu-latest) sets
      # kernel.apparmor_restrict_unprivileged_userns=1, which denies the unprivileged user
      # namespace bwrap needs, and Ubuntu's bwrap is not setuid. Turning it off does lift a
      # boundary: bwrap sets no_new_privs, so a sandboxed subprocess cannot use the runner's
      # passwordless sudo, and with the restriction off for the whole VM it can make nested
      # user namespaces again. It is accepted because the action makes the same change
      # itself, and it lasts only for this job's VM, which is thrown away afterwards.
      # Ubuntu's narrower `bwrap-userns-restrict` AppArmor profile (package
      # apparmor-profiles, copied from /usr/share/apparmor/extra-profiles/ into
      # /etc/apparmor.d and loaded with `apparmor_parser -r`, with the sysctl left at 1)
      # would grant the namespace to bwrap alone. It is a follow-up to try in a live run,
      # not part of this change: the action's socat proxy may not work under the profile's
      # unprivileged-bwrap confinement. The last line proves bwrap can make every namespace
      # the sandbox asks for, so a failure shows here and not inside the action.
      - name: Install bubblewrap for Claude Code's subprocess isolation
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap socat && break
            echo "apt-get attempt $i failed, retrying..."
            sleep 5
          done
          command -v bwrap
          command -v socat
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --version
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-all --die-with-parent true

      # No persisted credentials: claude-code-action brings its own App token. From checkout
      # v6 the job's read-only token sits in a RUNNER_TEMP file pulled in by an
      # `includeIf.gitdir` entry; claude-code-action v1.0.240 clears the header from
      # .git/config and `include.path` files only, so git would keep sending that token ahead
      # of the App token and a push would be refused. Keep this line even if a later action
      # handles `includeIf`: nothing here needs the token. The action's first fetches run
      # before it sets its own remote and rely on the repository being public.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code
        uses: anthropics/claude-code-action@ed670b4cf9de2a5a570d130d2f6197b9e543cd64 # v1.0.240
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          include_comments_by_actor: "thomvisser-ux,claude[bot]"
          additional_permissions: |
            actions: read
          claude_args: |
            --allowedTools "Bash(cargo fmt --all),Bash(cargo check --workspace --all-targets),Bash(cargo xtask ci --quick)"
            --append-system-prompt "Follow AGENTS.md and CLAUDE.md. Every commit message ends with a Co-Authored-By trailer for Claude followed by the last line 'Signed-off-by: Thom Visser <thom.visser@gmail.com>' (the owner's DCO sign-off, authorised for commits made from this workflow); write that line into the message yourself and never pass -s or --signoff, which would sign off as the bot. If a change touches an AGENTS.md section 5 contract path, say so in your reply; never merge."

      # The action's own hardening for a scrubbed run (its "Pin bun binary for post-steps",
      # "Prepend system bin dirs to PATH" and "Re-prepend system bin dirs to PATH" steps at
      # the pinned SHA) is gated on `allowed_non_write_users`, which this workflow does not
      # set, so none of it runs. A subprocess of Claude's that writes the runner's
      # $GITHUB_ENV or $GITHUB_PATH file could otherwise steer every later step. What a
      # workflow can copy is the re-prepend and reset, after the action and `if: always()`:
      # this step puts /usr/bin and /bin first again and clears BASH_ENV, LD_PRELOAD,
      # LD_LIBRARY_PATH and the DYLD_* variables, as the action's step does, for the steps
      # that follow it, which here are the checkout's post step (its `token` input is the
      # job's read-only token). What a workflow cannot reach: the action's own steps after
      # "Run Claude Code Action" ("Post buffered inline comments", which holds the App
      # token, and "Revoke app token") run inside the action before any step here can, and
      # the bun pin copies bun into the action's own folder after the action's own Install
      # Bun step. Those two stay open until the action runs its hardening without
      # `allowed_non_write_users`, or this workflow finds a way to set it that does not
      # widen who can start a run. The pre-run "Prepend" step is not copied: a PATH entry
      # written before the run cannot outrank one written during it.
      - name: Reset PATH and the loader variables after Claude Code
        if: always()
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          BASH_ENV: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          NODE_OPTIONS: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_PRELOAD: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
        run: |
          echo "/usr/bin" >> "$GITHUB_PATH"
          echo "/bin" >> "$GITHUB_PATH"
          {
            echo "BASH_ENV="
            echo "LD_PRELOAD="
            echo "LD_LIBRARY_PATH="
            echo "DYLD_INSERT_LIBRARIES="
            echo "DYLD_PRELOAD="
            echo "DYLD_LIBRARY_PATH="
            echo "DYLD_FRAMEWORK_PATH="
          } >> "$GITHUB_ENV"
